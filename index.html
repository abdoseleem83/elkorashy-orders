                    <td style="padding:8px 5px;border-bottom:1px solid #DCE4EC;text-align:center;color:#8A8470;">${serialCounter}</td>
                    <td style="padding:8px 5px;border-bottom:1px solid #DCE4EC;font-weight:600;color:#002050;${unavailNameStyle_(it)}">${esc(it.name||it.product)}${unavailBadgeHTML_(it)}${unconfirmedBadgeHTML_(order)}</td>
                    <td style="padding:8px 5px;border-bottom:1px solid #DCE4EC;text-align:center;font-weight:700;">${qty} ${esc(it.normUnit||'')}</td>
                    <td style="padding:8px 5px;border-bottom:1px solid #DCE4EC;text-align:center;">${it.rawPrice==null?'—':Math.round(it.rawPrice).toLocaleString('en-US')}</td>
                    <td style="padding:8px 5px;border-bottom:1px solid #DCE4EC;text-align:center;font-weight:800;color:#002050;">${lineAmt==null?'—':Math.round(lineAmt).toLocaleString('en-US')}</td>
                  </tr>`;
                }
                rowIndex++;
              });
              });
            });
            return html;
          })()}
        </tbody>
      </table>
      ${rows.some(r=>itemUnavailable_(r)) ? `
      <div style="margin-top:12px;padding:9px 12px;background:#FDECEA;border:1.5px solid #C0392B;border-radius:8px;color:#C0392B;font-weight:800;font-size:13px;">
        ● الأصناف المعلّمة بالأحمر غير متاحة حاليًا في المخزن — محتاجة تأكيد قبل التحميل.

      <div style="display:flex;justify-content:flex-end;margin-top:18px;">
        <div style="width:280px;">
          ${showDiscount && discountTotal>0 ? `
          <div style="display:flex;justify-content:space-between;padding:8px 14px;font-size:16px;font-weight:800;color:#20242B;">
            <span>الإجمالي قبل الخصم</span><span>${Math.round(subtotal).toLocaleString('en-US')} ج.م</span>
          </div>
          ${discountTotal>0?`<div style="display:flex;justify-content:space-between;padding:8px 14px;font-size:16px;color:#1080C0;font-weight:800;">
            <span>${customPct>0 ? 'خصم مخصص ('+customPct+'%)' : 'خصم القطاع'}</span><span>- ${Math.round(discountTotal).toLocaleString('en-US')} ج.م</span>
          </div>`:''}
          <div style="display:flex;justify-content:space-between;padding:10px 14px;background:#002050;color:#fff;border-radius:8px;font-size:17px;font-weight:800;margin-top:4px;">
            <span>الإجمالي بعد الخصم</span><span>${Math.round(netTotal).toLocaleString('en-US')} ج.م</span>
          </div>
          ` : `

            <span>الإجمالي</span><span>${Math.round(subtotal).toLocaleString('en-US')} ج.م</span>
          </div>
          `}
          ${hasMissing ? '<div style="font-size:11.8px;color:#8A5A00;margin-top:6px;text-align:left;">⚠️ فيه أصناف بدون سعر متاح مش داخلة في الإجمالي</div>' : ''}
        </div>
      </div>

      ${rollSummary.length ? `
      <div style="margin-top:14px;display:flex;justify-content:flex-end;">
        <div style="width:280px;background:#F3F6FA;border-radius:8px;padding:10px 14px;">
          <div style="font-size:12.3px;font-weight:800;color:#002050;margin-bottom:6px;">عدد اللفات حسب القطاع</div>
          ${rollSummary.map(r=>{
            const parts = [];
            if(r.rolls>0) parts.push((r.rolls % 1 === 0 ? r.rolls : r.rolls.toFixed(1)) + ' لفة');
            if(r.rods>0) parts.push((r.rods % 1 === 0 ? r.rods : r.rods.toFixed(1)) + ' عود');
            return `
            <div style="display:flex;justify-content:space-between;font-size:12.3px;color:#20242B;padding:3px 0;">
              <span>${esc(r.sector)}</span><span style="font-weight:700;">${esc(parts.join(' + '))}</span>
            </div>`;
          }).join('')}
        </div>
      </div>` : ''}

      ${order.note ? `<div style="margin-top:18px;padding-top:12px;border-top:1px dashed #DCE4EC;font-size:12.9px;color:#6B7A8C;">ملاحظات: ${esc(order.note)}</div>` : ''}

      <div style="margin-top:16px;padding:10px 14px;background:#FBEBD1;border-radius:8px;font-size:11.8px;color:#8A5A00;line-height:1.7;">
        هذه الأسعار سارية ما لم يحدث تعديل في القوائم والأسعار قبل التنفيذ.<br>
        الكميات وفقًا لرصيد المخزن وقت التنفيذ.
        ${!STOCK_TRACKED_WAREHOUSES_.includes(asText(order.warehouse)) ? `<br><b>⚠ الأصناف في مخزن "${esc(asText(order.warehouse))}" غير معتمدة إلا وقت التحميل فقط، نظرًا لعدم حجز بضاعة مسبقًا.</b>` : ''}
      </div>

      <div style="margin-top:26px;padding-top:14px;border-top:1px solid #DCE4EC;text-align:center;font-size:11.2px;color:#6B7A8C;">
        المستند ده تم إنشاؤه تلقائيًا وقت إرسال الطلب — القرشي لأبواب وشبابيك الـ UPVC
        ${CREDIT_LINE ? `<div style="margin-top:5px;color:#A8A498;font-size:10.1px;">${esc(CREDIT_LINE)}</div>` : ''}

    </div>
  `;
  document.body.appendChild(wrap);

  let result = null;
  try{
    const canvas = await withTimeout(
      html2canvas(wrap, {scale: pdfScale_(rows.length), backgroundColor:'#ffffff', useCORS:true, allowTaint:true}),
      20000, 'quote-pdf'
    );
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p','mm','a4');
    const imgData = canvas.toDataURL('image/png');
    const imgWidth = 210;
    const pageHeight = 297;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    const totalPages = pdfPageCount_(imgHeight, pageHeight);
    let heightLeft = imgHeight;
    let position = 0;
    let pageNum = 1;
    doc.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
    stampPdfFooter_(doc, pageNum, totalPages);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      doc.addPage();
      pageNum++;
      doc.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
      stampPdfFooter_(doc, pageNum, totalPages);
      heightLeft -= pageHeight;
    }
    const imgBlob = await canvasToPngBlob_(canvas);
    result = { blob: doc.output('blob'), previewUrl: imgData, imgBlob: imgBlob };
  }catch(e){ console.error('buildQuotePDF failed:', e); result = null; }
  try{ document.body.removeChild(wrap); }catch(e){}
  return result;
}

// ===== طلبية نواقص (صور، مش PDF): زرارين — كرافت ونيو / كومبن واكسسوارات =====
// كل زرار بيطلّع صورة واحدة (PNG) بدل PDF: من فوق "طلبية نواقص {اسم الفرع}"
// والتاريخ، والأصناف باللفة (لمجموعات اللفة)، ومن تحت إجمالي كل قطاع من
// القطاعات اللي بتتحسب باللفة (كرافت/نيو/كومبن). الصفحة دايمًا مقسومة عمودين
// جنب بعض؛ لو الأصناف زادت عن نص الصفحة الأولى بتكمل في العمود التاني تلقائيًا.
const SHORTAGE_IMG_GROUPS_ = {
  kraft_new: { label: 'كرافت ونيو', mains: ['قطاعات كرافت لاين', 'نيو لاين'] },
  combin_acc: { label: 'كومبن واكسسوارات', mains: ['قطاعات PVC كومبن', 'اكسسوارات pvc اكسا'] }
};
// القطاعات اللي إجماليها باللفة بيتحسب في الفوتر (اكسسوارات وحداتها مختلطة
// كرتونة/قطعة فمفيش إجمالي واحد يبقى له معنى ليها).
const SHORTAGE_TOTAL_MAINS_ = ['قطاعات كرافت لاين', 'نيو لاين', 'قطاعات PVC كومبن'];

async function buildShortageImageGroup(order, groupKey){
  if(typeof html2canvas === 'undefined') return null;
  const group = SHORTAGE_IMG_GROUPS_[groupKey];
  if(!order || !order.items || !order.items.length || !group) return null;

  const relevant = order.items.filter(it => group.mains.includes(it.main));
  if(!relevant.length) return null;

  const date = new Date(order.ts);
  const dateStr = date.toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'});

  // الأصناف باللفة لمجموعات اللفة (أو بالعود لو الكمية أقل من لفة كاملة)،
  // وبباقي وحداتها الصغيرة لغير كده
  const rows = relevant.map(it=>{
    const norm = normalizeItemToSmallUnit(it);
    if(ROLL_GROUPS_.includes(it.main)){
      const cat = findCatalogItem(it.main, it.product, it.color);
      const content = Number(cat && cat.unit) || 1;
      const disp = rollsOrRodsDisplay_(norm.qty, content);
      return Object.assign({}, it, { dispQty: disp.qty, dispUnit: disp.unitLabel });
    }
    return Object.assign({}, it, { dispQty: norm.qty, dispUnit: norm.unitLabel });
  });

  const groupsMap = new Map();
  rows.forEach(r=>{
    if(!groupsMap.has(r.main)) groupsMap.set(r.main, []);
    groupsMap.get(r.main).push(r);
  });
  const orderedMains = group.mains.filter(m=>groupsMap.has(m));

  // صف واحد مسطّح لكل الأصناف، مع علم يوضّح بداية قطاع جديد (لعرض هيدر فرعي)
  const flat = [];
  orderedMains.forEach(main=>{
    groupsMap.get(main).forEach((it,i)=> flat.push(Object.assign({}, it, { sectionStart: i===0, sectionLabel: main })));
  });

  // إجمالي كل قطاع من القطاعات المحسوبة باللفة (كرافت/نيو/كومبن) — ممكن
  // يبقى فيه إجمالي لفات وإجمالي عيدان مع بعض لو فيه أصناف اتعرضت بالعود
  // (كميات أقل من لفة كاملة)، فبنعرض الاتنين لو موجودين.
  const totals = orderedMains
    .filter(m=>SHORTAGE_TOTAL_MAINS_.includes(m))
    .map(m=>{
      const items = groupsMap.get(m);
      const rollsSum = items.filter(it=>it.dispUnit==='لفة').reduce((a,it)=>a+(Number(it.dispQty)||0), 0);
      const rodsSum = items.filter(it=>it.dispUnit==='عود').reduce((a,it)=>a+(Number(it.dispQty)||0), 0);
      const parts = [];
      if(rollsSum>0) parts.push(Math.round(rollsSum*10)/10 + ' لفة');
      if(rodsSum>0) parts.push(Math.round(rodsSum*10)/10 + ' عود');
      return { main: m, text: parts.join(' + ') };
    })
    .filter(t=>t.text);

  // 📄 الورقة دلوقتي ليها شكل ثابت: عمودين، كل عمود 15 سطر بالظبط
  // (= 30 صنف للصفحة). الزيادة بتروح لصفحة/صورة جديدة بنفس المقاس بالظبط،
  // بدل ما الورقة تتمدّد وتطول والخط يصغّر عشان يدخل فيها (اللي كان بيخلي
  // كل صورة بحجم وشكل مختلف حسب عدد الأصناف).
  const ROWS_PER_COL_ = 15;
  const PER_PAGE_ = ROWS_PER_COL_ * 2;
  const pages = [];
  for(let i=0; i<flat.length; i+=PER_PAGE_){
    pages.push(flat.slice(i, i+PER_PAGE_));
  }
  if(!pages.length) pages.push([]);

  function rowsHTML(list, startIndex){
    let html = '';
    list.forEach((it,i)=>{
      if(it.sectionStart && SHORTAGE_IMG_GROUPS_[groupKey].mains.length>1){
        html += `<div style="padding:7px 10px;background:#4FA8DC;color:#002050;font-weight:800;font-size:15px;border-radius:6px;margin:${i===0?'0':'10px'} 0 6px 0;">${esc(it.sectionLabel)}</div>`;
      }
      const bg = i%2===0 ? '#FFFFFF' : '#F3F6FA';
      html += `

// بيدوّر على الطلب بمعرّفه (لو موجود) وإلا بيرجع لآخر طلب اتبعت (state.lastOrder) —
// عشان نفس الزرارين يشتغلوا هنا وفي شاشة "تم إرسال الطلب".
function findOrderForShortage_(id){
  if(id){
    const o = state.orders.find(o=>o.id===id) || state.myOrders.find(o=>o.id===id);
    if(o) return o;
  }
  return state.lastOrder;
}

async function handleShortageImage(id, groupKey){
  const order = findOrderForShortage_(id);
  if(!order){ showToast('مفيش طلب'); return; }
  const busyKey = id || 'last';
  state.shortageImgBusy = busyKey + '|' + groupKey; render();
  try{
    const blobs = await buildShortageImageGroup(order, groupKey);
    if(blobs && blobs.length){
      const label = SHORTAGE_IMG_GROUPS_[groupKey].label;
      const base = 'نواقص_' + label.replace(/\s+/g,'_') + '_' + orderNoDisplay_(order);
      if(blobs.length === 1){

        // إن فيه صفحات زيادة عشان مايفتكرش إن الباقي ضاع.

async function prepareWarehouseImages(){
  const o = state.lastOrder;
  if(!o || !o.items || !o.items.length){ showToast('مفيش طلب'); return; }
  state.whImgPreparing = true; state.warehouseImages = []; render();

  // مجموعة رئيسية لكل صورة
  const groups = new Map();
  o.items.forEach(it=>{
    if(!groups.has(it.main)) groups.set(it.main, []);
    groups.get(it.main).push(it);
  });
  const ordered = orderGroups_(groups);
  const out = [];
  for(let i=0;i<ordered.length;i++){
    const g = ordered[i];
    // فسحة صغيرة بين كل صورة عشان الواجهة ما تتجمدش
    await new Promise(r=>setTimeout(r, 60));
    const blob = await buildWarehouseImage(o, g, groups.get(g), i+1, ordered.length);
    if(blob) out.push({ group: g, blob: blob });
  }
  state.warehouseImages = out;
  state.whImgPreparing = false;
  if(!out.length) showToast('تعذّر تجهيز الصور، حاول تاني');
  render();
}

async function shareWarehouseImages(){
  const imgs = state.warehouseImages || [];
  if(!imgs.length){ showToast('جهّز الصور الأول'); return; }
  const o = state.lastOrder;
  const base = 'مخزن_' + String(o ? o.id : 'order').toUpperCase();
  const files = imgs.map((x, i)=> new File([x.blob], base + '_' + (i+1) + '_' + x.group + '.png', {type:'image/png'}));
  try{

      await navigator.share({ files, title:'أمر صرف مخزن', text:'طلب #' + (o?orderNoDisplay_(o):'') });

// ===== excel export (admin) =====
// ===== رفع الأصناف/الرصيد من إكسل (الأدمن) =====
async function handleCatalogFileSelected(act, file){
  if(typeof ExcelJS === 'undefined'){ showToast('حصل خطأ في تحميل أداة قراءة الإكسل، حاول تاني'); return; }
  state.catalogUploadFileName = file.name;
  state.catalogUploadResult = null;
  state.catalogUploadRows = null;
  render();
  try{
    const buffer = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buffer);
    const ws = wb.worksheets[0];
    if(!ws) throw new Error('الملف فاضي');
    const headerRow = ws.getRow(1);
    const headerMap = {}; // نص العنوان (متريم) → رقم العمود
    headerRow.eachCell((cell, colNumber)=>{
      const h = String(cell.value==null ? '' : cell.value).trim();
      if(h) headerMap[h] = colNumber;
    });
    const nameCol = headerMap['اسم الصنف'];
    const stockCol = headerMap['الرصيد'];
    if(!nameCol || !stockCol){
      throw new Error('لازم يكون في عمودين اسمهم بالظبط "اسم الصنف" و"الرصيد" — استخدم النموذج الجاهز');
    }
    const getCell = (row, colName)=>{
      const idx = headerMap[colName];
      if(!idx) return '';
      const v = row.getCell(idx).value;
      if(v && typeof v==='object' && v.text!=null) return v.text; // نص غني/رابط
      return v==null ? '' : v;
    };
    const rows = [];
    ws.eachRow((row, rowNumber)=>{
      if(rowNumber===1) return;
      const name = String(getCell(row,'اسم الصنف')||'').trim();
      if(!name) return;
      if(state.catalogUploadMode==='stock'){
        rows.push({ name, stock: getCell(row,'الرصيد') });
      } else {
        rows.push({
          name,
          main: String(getCell(row,'القطاع')||'').trim(),
          sub: String(getCell(row,'التصنيف الفرعي')||'').trim(),
          unit: getCell(row,'الوحدة'),
          product: String(getCell(row,'اسم المنتج')||'').trim(),
          color: String(getCell(row,'اللون')||'').trim(),
          price: getCell(row,'السعر'),
          stock: getCell(row,'الرصيد'),
          disabled: String(getCell(row,'تعطيل')||'').trim()==='لا'
        });
      }
    });
    if(!rows.length) throw new Error('مفيش صفوف فيها اسم صنف في الملف');
    state.catalogUploadRows = rows;
  }catch(e){
    state.catalogUploadResult = { error: 'تعذّر قراءة الملف: ' + (e && e.message ? e.message : 'خطأ غير معروف') };
    state.catalogUploadRows = null;
  }
  render();
}

async function downloadCatalogTemplate(){
  if(typeof ExcelJS === 'undefined'){ showToast('حصل خطأ في تحميل أداة الإكسل، حاول تاني'); return; }
  const wb = new ExcelJS.Workbook();
  const isStock = state.catalogUploadMode==='stock';
  const ws = wb.addWorksheet('نموذج', { views:[{ rightToLeft:true }] });
  // ⚠️ بنملأ النموذج بأسماء الأصناف الحقيقية الموجودة عندنا دلوقتي (مش مثال
  // وهمي) — عشان لو الأدمن كتب الاسم بإيده وغيّر حرف أو مسافة عن غير قصد،
  // الرفع كان بيفشل بصمت (الاسم "مش موجود"). كده هو بس بيغيّر الأرقام.
  const seen = new Set();
  const uniqueItems = [];
  CATALOG.forEach(d=>{
    if(d.name && !seen.has(d.name)){ seen.add(d.name); uniqueItems.push(d); }
  });
  if(isStock){
    ws.columns = [
      { header:'اسم الصنف', key:'name', width:40 },
      { header:'الرصيد', key:'stock', width:12 },
    ];
    if(uniqueItems.length){
      uniqueItems.forEach(d=>ws.addRow({ name:d.name, stock: (d.stock===null||d.stock===undefined) ? '' : d.stock }));
    } else {
      ws.addRow({ name:'مثال: حلق مفصلي بدون بار كومبن - ابيض', stock:25 });
    }
  } else {
    ws.columns = [
      { header:'اسم الصنف', key:'name', width:34 },
      { header:'القطاع', key:'main', width:20 },
      { header:'التصنيف الفرعي', key:'sub', width:20 },
      { header:'الوحدة', key:'unit', width:10 },
      { header:'اسم المنتج', key:'product', width:28 },
      { header:'اللون', key:'color', width:14 },
      { header:'السعر', key:'price', width:10 },
      { header:'الرصيد', key:'stock', width:10 },
      { header:'تعطيل', key:'disabled', width:10 },
    ];
    if(uniqueItems.length){
      uniqueItems.forEach(d=>ws.addRow({
        name:d.name, main:d.main||'', sub:d.sub||'', unit:d.unit||1,
        product:d.product||d.name, color:d.color||'',
        price:(d.price===null||d.price===undefined)?'':d.price,
        stock:(d.stock===null||d.stock===undefined)?'':d.stock,
        disabled:d.available===false?'لا':''
      }));
    } else {
      ws.addRow({ name:'مثال: حلق مفصلي بدون بار كومبن - ابيض', main:'قطاعات PVC كومبن', sub:'', unit:4, product:'حلق مفصلي بدون بار كومبن', color:'ابيض', price:250, stock:25, disabled:'' });
    }
  }
  ws.getRow(1).font = { bold:true };
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = isStock ? 'نموذج_تحديث_الرصيد.xlsx' : 'نموذج_رفع_الأصناف.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function submitCatalogUpload(){
  if(!state.catalogUploadRows || !state.catalogUploadRows.length) return;
  state.catalogUploadBusy = true; state.catalogUploadResult = null; render();
  const isManageCtx = state.catalogUploadContext==='manage';
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action: isManageCtx ? 'manageUploadCatalog' : 'uploadCatalog',
        token: isManageCtx ? getManageToken() : getAdminToken(),
        mode: state.catalogUploadMode, rows: state.catalogUploadRows
      })
    });
    const data = await res.json();
    if(data && data.ok){
      state.catalogUploadResult = { updated:data.updated||0, added:data.added||0, notFound:data.notFound||[] };
      showToast('تم رفع الملف بنجاح ✅');
    } else {
      state.catalogUploadResult = { error: (data && data.error) ? data.error : 'حصل خطأ في الرفع' };
    }
  }catch(e){
    state.catalogUploadResult = { error: 'تعذّر الاتصال بالسيرفر، حاول تاني' };
  }
  state.catalogUploadBusy = false;
  render();
}

async function exportExcel(statusFilter){
  // statusFilter: واحدة من المراحل التلاتة بالظبط — كل زرار بيصدّر ملف مستقل بطلباته بس
  const ordersForFile = state.orders.filter(o=>o.status===statusFilter);

  if(ordersForFile.length===0){ showToast('مفيش طلبات "' + statusFilter + '" لتصديرها'); return; }
  if(typeof ExcelJS === 'undefined'){ showToast('حصل خطأ في تحميل أداة التصدير، حاول تاني'); return; }

  const NAVY='FF1F3050', WHITE='FFFFFFFF', LIGHT='FFF5F3EE', GOLD='FFC9A227';
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(statusFilter, { views:[{ rightToLeft:true }] });
  ws.columns = [
    { header:'م', key:'serial', width:6 },
    { header:'الموزع', key:'dist', width:18 },
    { header:'المنطقة', key:'region', width:14 },
    { header:'الصنف', key:'product', width:32 },
    { header:'الكمية', key:'qty', width:8 },
    { header:'الوحدة', key:'unit', width:10 },
    { header:'سعر الوحدة', key:'price', width:11 },
    { header:'الإجمالي', key:'total', width:11 },
    { header:'التاريخ', key:'date', width:14 },
  ];
  const headerRow = ws.getRow(1);
  headerRow.eachCell(cell=>{
    cell.font = { bold:true, color:{argb:WHITE}, size:12, name:'Arial' };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:NAVY} };
    cell.alignment = { horizontal:'center', vertical:'middle' };
    cell.border = { top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'} };
  });
  headerRow.height = 22;

  // ⚠️ مهم جدًا: بنجمّع كل طلب لوحده بالـ id الفريد بتاعه، مش باسم الموزّع.
  // قبل كده كان التجميع بالاسم (distName)، فلو موزّعين مختلفين ليهم نفس الاسم
  // بالظبط (زي أكتر من موزّع اسمه "طنطا") كانت طلباتهم بتتلم كلها مع بعض —
  // فيظهر عند موزّع أصناف موزّع تاني ماطلبهاش. التجميع بالـ id الفريد بيضمن
  // إن كل طلب يظهر بأصنافه هو بس ومستحيل يختلط بطلب موزّع تاني.
  const groups = new Map();
  ordersForFile.forEach(o=>{
    const key = o.id;   // مفتاح فريد لكل طلب
    if(!groups.has(key)) groups.set(key, { dist:o.distName||'', region:o.distRegion||'', ts:o.ts, items:[] });
    o.items.forEach(it => groups.get(key).items.push(it));
  });

  let rowIdx = 2, toggle=false, grandTotal=0, serial=0;
  groups.forEach((g)=>{
    const dist = g.dist;
    const startRow = rowIdx;
    const dateStr = new Date(g.ts).toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'});
    const fillColor = toggle ? LIGHT : WHITE;
    g.items.forEach((it, idx)=>{
      grandTotal += it.lineTotal||0;
      serial++;
      // بنصدّر بالوحدة الصغيرة (عود / قطعة) مش باللفة — زي عرض السعر بالظبط
      const norm = normalizeItemToSmallUnit(it);
      // ⚠️ سعر الوحدة المعروض لازم يطابق الإجمالي: نستخرجه من (الإجمالي ÷ الكمية)
      // عشان الكرتونة/اللفة تظهر بسعرها الكامل مش بسعر القطعة (نفس بق عرض السعر).
      const unitPriceDisp = (it.lineTotal!=null && norm.qty) ? (it.lineTotal / norm.qty) : rawPriceForItem(it);
      const row = ws.addRow({
        serial,
        dist: idx===0?dist:'', region: idx===0?g.region:'',
        product: it.name || it.product,
        qty: norm.qty, unit: norm.unitLabel||'',
        price: unitPriceDisp==null ? 'غير متاح' : Math.round(unitPriceDisp),
        total: it.lineTotal==null ? 'غير متاح' : Math.round(it.lineTotal),
        date: idx===0?dateStr:''
      });
      row.eachCell(cell=>{
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:fillColor} };
        cell.border = { top:{style:'hair',color:{argb:'FFDDDDDD'}}, bottom:{style:'hair',color:{argb:'FFDDDDDD'}}, left:{style:'hair',color:{argb:'FFDDDDDD'}}, right:{style:'hair',color:{argb:'FFDDDDDD'}} };
        cell.alignment = { horizontal:'right', vertical:'middle', wrapText:true };
        cell.font = { name:'Arial', size:11 };
      });
      rowIdx++;
    });
    if(g.items.length>1){
      ws.mergeCells(startRow,2,rowIdx-1,2); ws.mergeCells(startRow,3,rowIdx-1,3); ws.mergeCells(startRow,9,rowIdx-1,9);
    }
    const distCell = ws.getCell(startRow,2);
    distCell.font = { bold:true, color:{argb:NAVY}, size:11, name:'Arial' };
    distCell.alignment = { horizontal:'right', vertical:'middle', wrapText:true };
    toggle = !toggle;
  });
  ws.autoFilter = { from:'A1', to:'I1' };

  const totalRow = ws.addRow({ product:'الإجمالي الكلي', total: Math.round(grandTotal) });
  ws.mergeCells(rowIdx, 1, rowIdx, 7);
  totalRow.eachCell(cell=>{
    cell.font = { bold:true, color:{argb:WHITE}, size:12, name:'Arial' };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:GOLD} };
    cell.alignment = { horizontal:'center', vertical:'middle' };
  });

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fileTag = statusFilter.replace(/\s+/g,'_');
  a.href = url; a.download = 'طلبات_الموزعين_' + fileTag + '.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ===== render: staged product block =====
// ⚠️ لما اللون يكون اتحدد بالفعل من خطوة "اختار اللون" العامة اللي فوق
// الشبكة (state.selectedColor)، مفيش داعي نعيد عرض اختيار اللون تاني ولا
// نودّي الموزع لقسم "حدد التفاصيل" البعيد — بنعرضله بس وحدة+كمية+سعر
// وزرار "ضيف للسلة" مباشرة تحت الصنف، عشان يقدر يضيف أصناف كتير بسرعة.
// صف الكمية بشكل 3 أسطر (بطلب صريح):
//  سطر 1: الوحدة (لفة...) + الكمية (- عدد +)
//  سطر 2: سعر الوحدة + الإجمالي
//  سطر 3: ضيف للسلة + إلغاء
// بيتستخدم في القطاعات (اللون متحدد) وفي الاكسسوارات (بعد اختيار اللون).
// ⚠️ بتتأكد إن الكمية اللي الموزّع طالبها (مهما كانت الوحدة: عود/لفة/كرتونة)
// ماتتجاوزش الرصيد الفعلي المتاح في المخزن. بترجع نص التحذير لو فيه تجاوز،
// أو '' لو الكمية سليمة. بتشتغل بس في المخازن اللي رصيدها متتبَّع فعليًا
// (طنطا حاليًا) — المخازن التانية مالهاش رصيد دقيق أصلاً فمفيش داعي نقارن.
function stockShortageWarning_(main, product, color, unitType, qty){
  if(!warehouseAffectsStock()) return '';
  const item = findCatalogItem(main, product, color);
  if(!item) return '';
  const stock = Number(item.stock);
  if(!isFinite(stock)) return '';
  const bigUnits = ['لفة','كرتونة'];
  const content = Number(item.unit) || 1;
  const requestedBase = bigUnits.includes(unitType) ? qty * content : qty;
  if(requestedBase > stock){
    // بنوري المتاح دايمًا بالوحدة الأساسية (عود/قطعة) عشان الرقم يبقى دقيق
    // ومالوش لبس، بدل ما نحاول نحوّله للفة/كرتونة وممكن يبقى كسر مربك.
    return `⚠ الكمية أكبر من المتاح في المخزن — المتاح فعليًا: ${stock} (المطلوب: ${requestedBase})`;
  }
  return '';
}

function renderStagedBlock(s){

    <div class="stagedhead">
      <div>
        <div class="stagedname">${esc(s.product)} ${s.isEditingExisting?'<span class="edittag">✏️ تعديل</span>':''}</div>

    </div>
    ${s.colorRequired ? `
    <label>الألوان (اختار أكتر من واحد)</label>
    <div class="chipwrap chipgrid4 chipsquares" style="margin-bottom:10px;grid-template-columns:repeat(${Math.min(Math.max(s.availableColors.length,1),5)}, minmax(0,1fr));">
      ${s.availableColors.map(c=>{
        const unavailable = isColorUnavailable(s.main, s.product, c);
        if(unavailable){
          return `<button class="chip disabled" data-act="noop-unavailable" disabled>${esc(c)}<small>موقوف</small></button>`;
        }
        const sel = s.selectedColors.includes(c) ? 'active' : '';
        // ⚠️ في مخازن العاشر/المنصورة، أو لو الداخل عميل، الرصيد مالوش معنى —
        // اللون بيتعرض عادي (شكل افتراضي، مفيش لون تلوين ولا لافتة خالص).
        if(!warehouseAffectsStock()){
          return `<button class="chip ${sel}" data-act="toggle-color" data-key="${esc(s.key)}" data-val="${esc(c)}">${esc(c)}</button>`;
        }
        const lvl = colorStockLevel(findCatalogItem(s.main, s.product, c));
        // أحمر: أقل من لفة (أو صفر) · أصفر: أقل من 5 لفات · عادي: كفاية

          return `<button class="chip nostockchip ${sel}" data-act="toggle-color" data-key="${esc(s.key)}" data-val="${esc(c)}">${esc(c)}<small>غير متاح رصيد</small></button>`;

      }).join('')}
    </div>
    ${(()=>{

      // "قليلة" بتوحي إن فيه حاجة، والصفر مفيهوش حاجة أصلاً. بنفصل الرسالتين.
      const outs = s.selectedColors.filter(c => colorStockLevel(findCatalogItem(s.main, s.product, c)) === 'out');
      const partial = s.selectedColors.filter(c => {
        const l = colorStockLevel(findCatalogItem(s.main, s.product, c));

      });
      let html = '';
      if(outs.length){
        html += `<div class="lowstocknote" style="background:#FDECEC;border-color:var(--danger);color:#8A1F1F;">🚫 مفيش رصيد خالص في: ${

        const shortageMsg = stockShortageWarning_(s.main, s.product, c, unitType, qty);
        return `
        <div class="cqrow2">
          <div class="cqrow2-color">${c?esc(c):esc(s.product)}</div>
          <div class="cqrow2-line">
            ${s.unitOptions.length>1 ? `
            <select class="cqselect" data-act="set-color-unit" data-key="${esc(s.key)}" data-val="${esc(c)}">
              ${s.unitOptions.map(u=>`<option value="${esc(u)}" ${s.units[c]===u?'selected':''}>${esc(u)}</option>`).join('')}
            </select>` : `<span class="cqunitfixed">${esc(s.unitOptions[0])}</span>`}
            <div class="qtystepper small">
              <button data-act="staged-qty-dec" data-key="${esc(s.key)}" data-val="${esc(c)}" type="button">−</button>
              <input type="text" inputmode="numeric" pattern="[0-9]*" min="1" value="${qty}" data-act="staged-qty-input" data-key="${esc(s.key)}" data-val="${esc(c)}">
              <button data-act="staged-qty-inc" data-key="${esc(s.key)}" data-val="${esc(c)}" type="button">+</button>
            </div>
          </div>
          ${shortageMsg ? `<div class="qty3-shortage">${esc(shortageMsg)}</div>` : ''}
          <div class="cqrow2-line cqrow2-price">
            <span class="qty3-cell"><b>السعر:</b> ${fmt(price)}</span>
            <span class="qty3-cell qty3-total"><b>الإجمالي:</b> ${fmt(lineTotal)}</span>
          </div>
        </div>`;
      }).join('')}
    </div>` : ''}
    <div class="stagedbtns">
      <button class="confirmbtn" data-act="confirm-staged" data-key="${esc(s.key)}">${s.isEditingExisting?'✓ حفظ التعديل':'✓ تمام، ضيفه للسلة'}</button>
      <button class="cancelbtn" data-act="cancel-staged" data-key="${esc(s.key)}">✖ إلغاء</button>
    </div>
  </div>`;
}

    <div class="card" style="border:2px solid var(--danger);">
      <h2 style="color:var(--danger);">⚠️ الحفظ فشل — السبب:</h2>
      <textarea readonly style="width:100%;min-height:120px;font-family:monospace;font-size:12.3px;direction:ltr;text-align:left;padding:8px;">${esc(state.saveError)}</textarea>
      <button class="savebtn" data-act="clear-save-error" style="margin-top:8px;">إخفاء</button>
    </div>` : '';
  if(state.successOrderId){
    return `
    <main>
      <div class="card success">
        <div class="ic">${ico_('checkCircle',36)}</div>
        <h2>${state.successMode==='updated' ? 'تم عمل طلب جديد بالتعديل ✅' : 'تم إرسال الطلب بنجاح'}</h2>
        ${state.successMode==='updated' ? '<p style="color:#6B6B6B;font-size:13px;margin-top:-4px;">الطلب القديم اتعلّم «مُعدّل» عند المخزن، وده رقمه الجديد.</p>' : ''}
        <p>هيتم مراجعة طلبك والتواصل معاك لتأكيد التنفيذ</p>
        <div class="ordid">#${esc(state.successOrderId)}</div>
        <div class="wanote">
          <p class="wanote-t">📲 لو سمحت اضغط <b>«ابعت الطلب واتساب»</b> عشان المخزن يستلم طلبك.</p>
          <button class="wanote-btn ${state.waSent?'sent':''}" data-act="send-order-img" ${state.waImgPreparing?'disabled':''}>
            <span class="ic">📲</span> ${state.waImgPreparing ? 'جارٍ التجهيز...' : (state.waSent ? 'تم — ابعت تاني' : 'ابعت الطلب واتساب')}
          </button>
          ${(state.waSent || state.waImgPreparing) ? '' : '<div class="wanote-arrow">⬆️</div>'}
        </div>
        <!-- ✂️ بناءً على طلب صريح: المستندات بقت "عرض السعر" بس، بأيقوناته
             التلاتة (واتساب صورة / تنزيل PDF / معاينة). باقي المستندات
             (صورة الطلب العامة، أمر صرف المخزن، طلبية النواقص) اتشالت. -->
        <div class="docsection">
          <div class="docsectiontitle">${ico_('fileIcon',15)} عرض السعر</div>
          <div class="iconbtnrow">
            ${state.quotePdfGenerating ? `
              <div class="loading" style="padding:10px 20px;">جارٍ التجهيز...</div>
            ` : state.quotePdfPlain ? `
              <button class="iconbtn" data-act="preview-quote-plain"><span class="ic">${ico_('eyeIcon',16)}</span><span>معاينة</span></button>
              <button class="iconbtn" data-act="share-quote-plain"><span class="ic">${ico_('shareIcon',16)}</span><span>واتساب</span></button>
              <button class="iconbtn" data-act="download-quote-plain"><span class="ic">⬇️</span><span>تنزيل PDF</span></button>
            ` : `
              <div class="loading" style="padding:10px 20px;">جارٍ التجهيز...</div>
            `}
          </div>
        </div>

        <div class="docsection">
          <div class="docsectiontitle">📦 طلبية النواقص</div>
          <div class="iconbtnrow">
            <button class="iconbtn" data-act="shortage-img" data-group="kraft_new" ${state.shortageImgBusy==='last|kraft_new'?'disabled':''}><span class="ic">🖼️</span><span>${state.shortageImgBusy==='last|kraft_new'?'جارٍ...':'نواقص كرافت ونيو'}</span></button>
            <button class="iconbtn" data-act="shortage-img" data-group="combin_acc" ${state.shortageImgBusy==='last|combin_acc'?'disabled':''}><span class="ic">🖼️</span><span>${state.shortageImgBusy==='last|combin_acc'?'جارٍ...':'نواقص كومبن واكسسوارات'}</span></button>
          </div>
        </div>
        <br>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <button class="newbtn" data-act="edit-last-order">✏️ تعديل الطلب / إضافة أصناف</button>
          <button class="newbtn outline" data-act="new-order">تسجيل طلب جديد</button>
        </div>
      </div>
    </main>`;
  }

  // كل قطاع بلونه الخاص عشان يتميّز عن التاني بصريًا وهو مجمّع 4 في الصف
  const SECTOR_COLOR_CLASS_ = {
    'قطاعات PVC كومبن': 'sc-1',
    'قطاعات كرافت لاين': 'sc-2',
    'نيو لاين': 'sc-3',
    'اكسسوارات pvc اكسا': 'sc-4',
    'ابواب WPC': 'sc-5',
    'تصنيع': 'sc-6',
    'حشوات': 'sc-7',
    'اخري': 'sc-8'
  };
  const sectorChips = SECTOR_CHIPS.map(g=>`
    <button class="chip ${g===OTHER_SECTOR?'gold':(SECTOR_COLOR_CLASS_[g]||'')} ${state.mainGroup===g?'active':''}" data-act="set-group" data-val="${esc(g)}">${esc(g)}</button>
  `).join('');

  let subSection = '';
  let productSection = '';
  // مفاتيح الأصناف اللي عرضنالها صف مختصر (وحدة+كمية+سعر) تحتها في الشبكة
  // نفسها — لأن اللون كان اتحدد بالفعل من خطوة "اختار اللون" فوق، فمفيش
  // داعي نودّي الموزع لقسم "حدد التفاصيل" البعيد. أي صنف تاني (لسه محتاج
  // يختار لون بنفسه) بيفضل يظهر في قسم "حدد التفاصيل" العادي تحت.
  const inlineStagedKeys_ = [];
  if(state.mainGroup && state.mainGroup!==OTHER_SECTOR){
    const needsSub = sectorNeedsSubFilter(state.mainGroup);
    const colorsAvail = !needsSub ? colorsForMain(state.mainGroup) : [];
    let subToUse = null;
    if(needsSub){
      const subs = subGroupsForMain(state.mainGroup);
      const isAcc = state.mainGroup.includes('اكسسوارات');
      const accQ = isAcc ? asText(state.accGlobalSearch).trim() : '';
      if(subs.length>1){
        subSection = `
        <div class="card">
          <h2><span class="num">4</span>اختار التصنيف الفرعي</h2>
          ${isAcc ? `
          <div class="searchbox accglobalsearch">
            <input type="text" placeholder="🔍 ابحث في كل الاكسسوارات (من غير ما تختار تصنيف)..." value="${esc(state.accGlobalSearch)}" data-act="acc-global-search">
          </div>
          ${accQ ? `<div class="accsearchhint">🔎 بتدوّر في كل الاكسسوارات على «${esc(accQ)}» — امسح البحث عشان ترجع للتصنيفات.</div>` : ''}
          ` : ''}
          ${accQ ? '' : `
          <div class="chipwrap chipgrid3">
            ${subs.map(s=>`<button class="chip ${state.subGroup===s?'active':''}" data-act="set-sub" data-val="${esc(s)}">${esc(s)}</button>`).join('')}
          </div>`}
        </div>`;
      }
      // لو فيه بحث عام في الاكسسوارات، نعرض من كل التصنيفات (sub=null) ونتخطى إجبار اختيار تصنيف
      subToUse = accQ ? null : state.subGroup;
    } else if(colorsAvail.length){
      // خطوة "اختار اللون" — بتظهر بعد القطاع مباشرة لأي قطاع فيه ألوان حقيقية
      subSection = `
      <div class="card">
        <h2><span class="num">4</span>اختار اللون</h2>
        <div class="chipwrap chipgrid4">
          ${colorsAvail.map(c=>`<button class="chip ${state.selectedColor===c?'active':''}" data-act="set-color" data-val="${esc(c)}">${esc(c)}</button>`).join('')}
        </div>
      </div>`;
    }
    const colorToUse = colorsAvail.length ? state.selectedColor : null;
    const accGlobalQ = (needsSub && state.mainGroup.includes('اكسسوارات')) ? asText(state.accGlobalSearch).trim() : '';
    const showProducts = needsSub ? (!!subToUse || !!accGlobalQ) : (colorsAvail.length ? !!colorToUse : true);
    if(showProducts){
      const prodMap = productsForGroup(state.mainGroup, subToUse);
      // البحث: لو فيه بحث عام في الاكسسوارات بنستخدمه، وإلا بنستخدم البحث العادي جوه التصنيف
      const q = (accGlobalQ || state.productSearch.trim()).toLowerCase();
      // ترتيب الأصناف رجع زي ما كان — بترتيب الكاتالوج الأصلي، من غير ترتيب حسب التوفر
      let names = [...prodMap.keys()].filter(n => !q || n.toLowerCase().includes(q));
      // لو دخلنا من خطوة "اختار اللون"، بنفلتر الأصناف على اللي فعلاً متاحة
      // باللون ده بس — عشان دي بالظبط اللي طلبها الموزع.
      if(colorToUse){
        names = names.filter(n => colorsForProduct(state.mainGroup, n).some(c=>c.color===colorToUse));
      }
      // ترتيب حسب توفر الرصيد: متوفر أولًا، بعده كمية قليلة، بعده متاح اعواد،
      // وأخيرًا مفيش رصيد خالص — والمنتجات الموقوفة (تعطيل يدوي) في الآخر خالص.
      if(warehouseAffectsStock()){
        const levelRank_ = lvl => lvl==='ok' ? 0 : lvl==='low' ? 1 : lvl==='crit' ? 2 : lvl==='out' ? 3 : 4;
        const rankFor_ = n => {
          const unavailable = colorToUse
            ? !!(findCatalogItem(state.mainGroup, n, colorToUse) && findCatalogItem(state.mainGroup, n, colorToUse).available===false)
            : isProductFullyUnavailable(state.mainGroup, n);
          if(unavailable) return 5;
          const lvl = colorToUse ? colorStockLevel(findCatalogItem(state.mainGroup, n, colorToUse)) : productStockLevel(state.mainGroup, n);
          return levelRank_(lvl);
        };
        names = names
          .map(n=>({n, r:rankFor_(n)}))
          .sort((a,b)=>a.r-b.r)
          .map(x=>x.n);
      }
      productSection = `
      <div class="card">
        <h2><span class="num">5</span>اختار الأصناف (تقدر تختار أكتر من واحد)</h2>
        <div class="currentctx">
          📍 إنت الآن في:
          <b>${esc(state.mainGroup)}</b>${subToUse ? ` — <b>${esc(subToUse)}</b>` : ''}${colorToUse ? ` — <b>${esc(colorToUse)}</b>` : ''}
        </div>
        <div class="searchbox">
          <input type="text" placeholder="ابحث عن اسم الصنف..." value="${esc(state.productSearch)}" data-act="search-product">
        </div>
        <div class="stocklegend">
          ${colorToUse ? `
          <span><i style="background:var(--success);"></i> متوفر</span>
          <span><i style="background:var(--gold);"></i> كمية قليلة</span>
          <span><i style="background:var(--danger);"></i> متاح اعواد</span>
          <span><i style="background:#000;"></i> مفيش رصيد خالص</span>
          <span><i style="background:#C9C5BA;"></i> موقوف</span>
          ` : `
          <span><i style="background:var(--success);"></i> متوفر</span>
          <span><i style="background:var(--danger);"></i> مفيش رصيد (السعر متاح)</span>
          <span><i style="background:#C9C5BA;"></i> موقوف</span>
          `}
        </div>
        <div class="productgrid listmode ${state.mainGroup && state.mainGroup.includes('اكسسوارات') ? 'compact' : ''}">
          ${(()=>{
            // 🔽 لو فيه صنف متحدد دلوقتي في القطاع ده، نعرضه هو بس ونخفي الباقي.
            // أول ما يلغي اختياره (يدوس عليه تاني أو يدوس إلغاء)، كل الأصناف
            // بترجع تظهر. بطلب صريح من المستخدم.
            const stagedNames = names.filter(n => state.staged.some(s=>s.key===stagedKey(state.mainGroup,n)));
            const visibleNames = stagedNames.length ? stagedNames : names;
            return visibleNames.length ? visibleNames.map(n=>{
            const stagedEntry = state.staged.find(s=>s.key===stagedKey(state.mainGroup,n));
            const isStaged = !!stagedEntry;
            const inCart = state.cart.some(it=>it.main===state.mainGroup && it.product===n);
            const colorItem = colorToUse ? findCatalogItem(state.mainGroup, n, colorToUse) : null;
            const unavailable = colorToUse ? !!(colorItem && colorItem.available===false) : isProductFullyUnavailable(state.mainGroup, n);
            // ⚠️ في مخازن العاشر والمنصورة، ولو الداخل عميل، الرصيد مالوش
            // معنى — نوري الصنف عادي من غير أي تلوين أو لافتة "متوفر/مفيش
            // رصيد" خالص. "موقوف" من الأدمن يفضل يتطبق دايمًا مهما كان.
            const showStock = warehouseAffectsStock();
            // في وضع "اختار اللون" بنستخدم المستوى الحقيقي بتاع اللون ده بالظبط
            // (4 مستويات: مفيش رصيد خالص / اعواد / قليلة / متوفر) — نفس الألوان
            // والتصميم المستخدمين أصلاً في شرائح الألوان.
            const lvl = unavailable ? 'unavailable' : (showStock ? (colorToUse ? colorStockLevel(colorItem) : productStockLevel(state.mainGroup, n)) : 'ok');
            const stockClass = unavailable ? 'unavailable' : (showStock ? (
              colorToUse
                ? (lvl==='ok' ? 'instock' : lvl==='low' ? 'lowstock' : lvl==='crit' ? 'critstock' : 'blackstock')
                : (lvl==='ok' ? 'instock' : lvl==='crit' ? 'lowstock' : 'outstock')
            ) : '');
            const tile = `
            <div class="ptile ${isStaged?'selected':''} ${inCart?'incart':''} ${stockClass}" data-act="${unavailable?'noop-unavailable':'toggle-product'}" data-val="${esc(n)}">
              ${isStaged?'<span class="tick">✓</span>':''}
              <span>${esc(n)}</span>
              ${unavailable?'<span class="unavailtag">موقوف</span>':''}
              ${colorToUse ? `
                ${(showStock && !unavailable && lvl==='out')?'<span class="stocktag black">مفيش رصيد خالص</span>':''}
                ${(showStock && !unavailable && lvl==='crit')?'<span class="stocktag out">متاح اعواد</span>':''}
                ${(showStock && !unavailable && lvl==='low')?'<span class="stocktag low">كمية قليلة</span>':''}
                ${(showStock && !unavailable && lvl==='ok')?'<span class="stocktag in">متوفر</span>':''}
              ` : `
                ${(showStock && !unavailable && lvl==='out')?'<span class="stocktag out">مفيش رصيد</span>':''}
                ${(showStock && !unavailable && lvl==='crit')?`<span class="stocktag low">كمية قليلة: ${esc(lowStockColorsLabel(state.mainGroup, n) || '—')}</span>`:''}
                ${(showStock && !unavailable && lvl==='ok')?`<span class="stocktag in">متوفر: ${esc(availableColorsLabel(state.mainGroup, n) || '—')}</span>`:''}
              `}
            </div>`;
            // ⚠️ لو اللون اتحدد بالفعل من خطوة "اختار اللون" فوق (colorToUse)
            // وده الصنف ده كان متضاف بلونه، بنعرض صف مختصر (وحدة+كمية+سعر+
            // زرار إضافة) على طول تحت الصنف — من غير ما نبعته لقسم "حدد
            // التفاصيل" البعيد ولا نعيد سؤاله عن اللون تاني.
            //
            // 🎨 ميزة إضافة ألوان تانية لنفس الصنف من غير ما تخرج من الشاشة:
            // بنعرض صف كمية/سعر منفصل لكل لون اختاره (colorToUse + أي لون
            // زوّده يدويًا)، وتحتهم زرار "+ أضف لون تاني" يفتح شرائح باقي
            // الألوان المتاحة لنفس الصنف. تفعيله من نفس toggleStagedColor
            // اللي بتستخدمها شرائح الألوان العادية.
            let inlineRow = '';
            if(isStaged){
              if(colorToUse && stagedEntry.selectedColors.includes(colorToUse)){
                const extraColors = stagedEntry.availableColors.filter(c=>c!==colorToUse);
                const pickerOpen = state.colorPickerOpenKey === stagedEntry.key;
                inlineRow = `<div class="inlinemulticolor">` +
                  stagedEntry.selectedColors.map(c=>`
                    ${stagedEntry.selectedColors.length>1 ? `<div class="inlinecolorlabel">${esc(c)}</div>` : ''}
                    ${renderInlineQtyRow(stagedEntry, c)}
                  `).join('') +
                  (extraColors.length ? `
                  <button class="addcolorbtn" data-act="toggle-color-picker" data-key="${esc(stagedEntry.key)}">
                    ${pickerOpen ? ico_('xCircle',14) + ' اقفل' : ico_('paletteIcon',14) + ' أضف لون تاني'}
                  </button>
                  ${pickerOpen ? `
                  <div class="chipwrap chipgrid4 chipsquares" style="margin-top:8px;">
                    ${extraColors.map(c=>{
                      const unavailable = isColorUnavailable(stagedEntry.main, stagedEntry.product, c);
                      if(unavailable) return `<button class="chip disabled" data-act="noop-unavailable" disabled>${esc(c)}<small>موقوف</small></button>`;
                      if(!warehouseAffectsStock()) return `<button class="chip" data-act="toggle-color" data-key="${esc(stagedEntry.key)}" data-val="${esc(c)}">${esc(c)}</button>`;
                      const lvl = colorStockLevel(findCatalogItem(stagedEntry.main, stagedEntry.product, c));
                      if(lvl==='out') return `<button class="chip nostockchip" data-act="toggle-color" data-key="${esc(stagedEntry.key)}" data-val="${esc(c)}">${esc(c)}<small>غير متاح رصيد</small></button>`;
                      if(lvl==='crit') return `<button class="chip outstockchip" data-act="toggle-color" data-key="${esc(stagedEntry.key)}" data-val="${esc(c)}">${esc(c)}<small>متاح اعواد</small></button>`;
                      if(lvl==='low') return `<button class="chip gold lowstockchip" data-act="toggle-color" data-key="${esc(stagedEntry.key)}" data-val="${esc(c)}">${esc(c)}<small>كمية قليلة</small></button>`;
                      return `<button class="chip greenchip" data-act="toggle-color" data-key="${esc(stagedEntry.key)}" data-val="${esc(c)}">${esc(c)}</button>`;
                    }).join('')}
                  </div>` : ''}
                  ` : '') +
                `</div>`;
              }else{
                // ⚠️ قبل كده كان بلوك التفاصيل بيروح لقسم "حدد التفاصيل" بعيد
                // تحت الشبكة. دلوقتي بيتفتح مكانه بالظبط تحت الصنف المضغوط،
                // فالموزع يشوف الكمية والوحدة وزراير ضيف للسلة/إلغاء على طول.
                inlineRow = `<div class="inlinestaged">${renderStagedBlock(stagedEntry)}</div>`;
              }
              inlineStagedKeys_.push(stagedEntry.key);
            }
            return tile + inlineRow;
          }).join('') : '<div class="empty">مفيش نتائج بالاسم ده</div>';
          })()}
        </div>
      </div>`;
    }
  }

  let otherSection = '';
  if(state.mainGroup===OTHER_SECTOR){
    otherSection = `
    <div class="card">
      <h2><span class="num">3</span>صنف غير موجود بالقائمة</h2>
      <div class="field">
        <label>اسم الصنف اللي عايزه *</label>
        <input type="text" placeholder="اكتب اسم الصنف" value="${esc(state.otherName)}" data-act="set-othername">
      </div>
      <div class="field">
        <label>ملاحظات على الصنف</label>
        <textarea placeholder="أي تفاصيل عن الصنف (مقاس، خامة...)" data-act="set-othernote">${esc(state.otherNote)}</textarea>
      </div>
      <label>الوحدة</label>
      <div class="chipwrap" style="margin-bottom:14px;">
        ${unitOptionsForGroup(OTHER_SECTOR).map(u=>`
          <button class="chip ${state.otherUnit===u?'active':''}" data-act="set-otherunit" data-val="${esc(u)}">${esc(u)}</button>
        `).join('')}
      </div>
      <label>الكمية</label>
      <div class="qtystepper">
        <button data-act="other-qty-dec" type="button">−</button>
        <input type="number" min="1" value="${state.otherQty}" data-act="other-qty-input">
        <button data-act="other-qty-inc" type="button">+</button>
      </div>
      <div class="field" style="margin-top:12px;">
        <label>السعر (اختياري، لو عارفه)</label>
        <input type="number" min="0" placeholder="مثال: 150" value="${esc(state.otherPrice)}" data-act="set-otherprice">
      </div>
      <button class="addbtn" data-act="add-other">إضافة للسلة</button>
    </div>`;
  }

  // الأصناف اللي عرضنالها صف مختصر تحت الصنف نفسه (لون متحدد من فوق) مش
  // بتتكرر هنا — القسم ده بقى بس للأصناف اللي لسه محتاجة تختار لون بنفسها.
  const remainingStaged = state.staged.filter(s => !inlineStagedKeys_.includes(s.key));
  const stagedSection = remainingStaged.length ? `
    <div class="card">
      <h2><span class="num">6</span>حدد التفاصيل</h2>
      ${remainingStaged.map(renderStagedBlock).join('')}
    </div>` : '';

  const cartSection = `
    <div class="card">
      <h2><span class="num">7</span>الأصناف المطلوبة (${state.cart.length})</h2>
      ${renderCartItemsHtml(state.cart)}
    </div>`;

  // المخزن بقى أول خطوة — يظهر كإيقونات، ولحد ما الموزع يختار مخزن،
  // باقي الفورم (بيانات الموزع، القطاعات، الأصناف...) ما بيظهرش خالص.
  const warehouseCard = `
    <div class="card">
      <h2><span class="num">1</span>برجاء اختيار المخزن لسهولة توجيهه للمسؤول</h2>
      <div class="whgrid">
        ${WAREHOUSES.map(w=>`
          <button class="whtile ${state.warehouse===w?'active':''}" data-act="pick-warehouse-inline" data-val="${esc(w)}">
            <span class="whicon">${warehouseIcon_(w)}</span>
            <span>${esc(w)}</span>
          </button>
        `).join('')}
      </div>

  // زرار للرجوع لأي طلب اتحفظ في السلة قبل كده — ظاهر أول حاجة في الفورم

// ===== render: admin view =====
// نفس منطق الفلترة اللي المتابعة بتعرضه (بحث بالاسم + حالة الطلب)، بنستخدمه
// هنا وكمان في تجهيز PDF النواقص عشان الأصناف اللي بتتجمّع تكون مطابقة
// بالظبط لللي ظاهر على الشاشة في لحظة الضغط على الزرار.
// وقت الطلب كرقم قابل للمقارنة. بنعدّيه على Date عشان لو السيرفر رجّع
// نص أو تاريخ بدل رقم برضه يشتغل، ولو الوقت باظ (صفر/غير صالح) بنرجع صفر.
function orderTimeKey_(o){
  const t = new Date(o && o.ts != null ? o.ts : 0).getTime();
  return isFinite(t) ? t : 0;
}
// رقم الطلب كعدد — بنستخدمه كمرجّح احتياطي لو الأوقات متساوية أو ضايعة.
function orderNoKey_(o){
  const n = parseInt(String((o && o.orderNo) || '').replace(/[^0-9]/g, ''), 10);
  return isFinite(n) ? n : 0;
}

function filteredAdminOrders_(){
  const q = state.adminFilter.trim().toLowerCase();
  return state.orders.filter(o=>{
    if(state.adminStatusFilter!=='all' && o.status!==state.adminStatusFilter) return false;
    if(q && !(o.distName||'').toLowerCase().includes(q)) return false;
    return true;
  // الأحدث فوق والأقدم تحت. بنرتّب بالوقت تنازليًا، ولو الوقت متساوي أو مش
  // موجود بنرجع لرقم الطلب، عشان الترتيب مايعتمدش على ترتيب الصفوف الراجع
  // من الشيت خالص.
  }).slice().sort((a,b)=>{
    const d = orderTimeKey_(b) - orderTimeKey_(a);
    if(d !== 0) return d;
    return orderNoKey_(b) - orderNoKey_(a);
  });
}

    d.name = asText(d.product).trim() + (d.color ? ' - ' + asText(d.color).trim() : '');

function isStandaloneMode(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOSDevice(){
  const ua = navigator.userAgent || '';
  if(/iphone|ipad|ipod/i.test(ua)) return true;
  // ⚠️ iPad من iPadOS 13 وطالع بيقول عن نفسه "Macintosh" في الـ userAgent،
  // فكان بيفشل في الكشف ويظهرله زرار تثبيت أندرويد اللي مش بيشتغل على iOS خالص.
  // بنكشفه هنا من إن عنده لمس (الماك مالوش شاشة لمس).
  if(/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) return true;
  return false;
}

// على iOS، "إضافة إلى الشاشة الرئيسية" شغالة في Safari بس.
// لو اليوزر فاتح اللينك من كروم أو فيسبوك أو واتساب، الخيار ده مش موجود عنده
// أصلاً — وده أكتر سبب بيخلي ناس الآيفون تقول "مش عارف أثبته".
// إشعار يدوي للموزع — بيفتح واتساب برسالة جاهزة. بيشتغل مع أي رقم من غير أي إعداد.
// نص رسالة تبليغ الموزع — مكان واحد بس عشان الرسالة النصية وصورة الإشعار
// يفضلوا متطابقين، ولو النص اتغير تاني نغيّره من هنا وبس.
function notifyMessageText_(ord){
  let msg;
  if(ord.status===STATUS_DONE){
    msg = '✅ تم تنفيذ طلبكم بالكامل وجاهز — يمكنكم التواصل معنا للاستلام\n';
  } else {
    msg = '✅ تم استلام الطلب الخاص بكم وجاري تنفيذه حسب المتاح بالمخزن وسيتم اعلامكم برساله بالمتاح\n';
  }
  msg += 'نشكر صبركم\n';
  msg += 'رقم الطلب: #' + orderNoDisplay_(ord) + '\n';
  msg += 'الموزع: ' + (asText(ord.distName) || '-') + '\n';
  msg += 'المنطقة: ' + (asText(ord.distRegion) || '-') + '\n';
  msg += 'المخزن: ' + (asText(ord.warehouse) || '-') + '\n';
  msg += 'شكرًا لتعاملك مع القرشي لأبواب وشبابيك الـ UPVC';
  return msg;
}

// ===== إرسال الطلب على واتساب (نص) =====
// اسم الصنف كامل: اسم الكتالوج + اللون كلمة واحدة متصلة
// مثال: "ضلفة باب مفصلي فتح للخارج كرافت بيج"
function itemFullName_(it){
  const base = asText(it.name || it.product).trim();
  const col  = asText(it.color).trim();
  if(!col) return base;
  return base.indexOf(col) === -1 ? (base + ' ' + col) : base;
}

// بيحسب لو الصنف ده مش متاح: يا إما موقوف من الأدمن، يا إما رصيده صفر
// في المخزن المختار (سواء لون بعينه أو الصنف كله).
// بتحسب هل الصنف غير متاح في مخزن معيّن بالظبط (مش معتمدة على state.warehouse).
// بنستخدمها في عرض السعر عشان الشارة تتحسب على مخزن الطلب نفسه والرصيد الحالي،
// مهما كان state.warehouse وقت الطباعة.
function unavailableForWarehouse_(main, product, color, warehouse){
  try{
    const c = color ? findCatalogItem(main, product, color) : null;
    if(c && c.available === false) return true;
    if(!color && isProductFullyUnavailable(main, product)) return true;
    // المخزن ده أصلاً مش بيتتبّع فيه رصيد → كله متاح
    if(!STOCK_TRACKED_WAREHOUSES_.includes(asText(warehouse))) return false;
    // نحسب مستوى الرصيد يدويًا (نفس منطق colorStockLevel بس من غير ما نعتمد
    // على warehouseAffectsStock اللي بيبص على state.warehouse)
    const item = c || firstCatalogItem_(main, product);
    if(!item || item.available===false) return true;
    if(item.inStock === false) return true;
    const n = Number(item.stock);
    if(!isFinite(n) || n <= 0) return true;          // صفر رصيد
    const content = Number(item.unit) || 1;
    if(n < content) return true;                      // أقل من لفة كاملة
    return false;
  }catch(e){ return false; }
}
// أول صنف مطابق (لو مفيش لون محدّد) — للاستخدام في حساب الرصيد على مستوى المنتج
function firstCatalogItem_(main, product){
  try{
    const opts = colorsForProduct(main, product).filter(c=>c.available!==false);
    if(!opts.length) return null;
    // نرجّع الصنف صاحب أقل رصيد عشان لو أي لون ناقص نعلّمه
    let worst = null, worstN = Infinity;
    for(const o of opts){
      const ci = findCatalogItem(main, product, o.color);
      const n = Number(ci && ci.stock);
      const v = isFinite(n) ? n : 0;
      if(v < worstN){ worstN = v; worst = ci; }
    }
    return worst;
  }catch(e){ return null; }
}

function computeUnavailable_(main, product, color){
  try{
    const c = color ? findCatalogItem(main, product, color) : null;
    if(c && c.available === false) return true;
    if(!color && isProductFullyUnavailable(main, product)) return true;
    if(!warehouseAffectsStock()) return false;
    const lvl = c ? colorStockLevel(c) : productStockLevel(main, product);
    // ⚠️ 'out' = رصيد صفر · 'crit' = فيه شوية عيدان بس أقل من لفة كاملة.
    // الاتنين لازم يتعلّموا "غير متاح" في عرض السعر، لأن الموزّع بيطلب باللفة
    // والرصيد مايكفيش لفة. قبل كده كنا بنعلّم 'out' بس، فالبنود اللي رصيدها
    // أقل من لفة (بس مش صفر) كانت بتعدّي من غير ملاحظة.
    return lvl === 'out' || lvl === 'crit';
  }catch(e){ return false; }
}

// شارة "غير متاح" الحمرا اللي بتتحط جنب اسم الصنف جوه المستندات.
// هنا (على عكس الواتساب) إحنا بنبني HTML، فالألوان متاحة عادي.
function unavailBadgeHTML_(it){
  if(!itemUnavailable_(it)) return '';
  return ' <span style="display:inline-block;background:#C0392B;color:#FFFFFF;' +
         'font-weight:800;font-size:10.5px;padding:1px 8px;border-radius:9px;' +
         'vertical-align:middle;white-space:nowrap;">\u25cf \u063a\u064a\u0631 \u0645\u062a\u0627\u062d</span>';
}
// ⚠️ المخازن برّه STOCK_TRACKED_WAREHOUSES_ (يعني كل حاجة غير طنطا حاليًا)
// مفيهاش رصيد متتبَّع صنف بصنف — يعني مفيش حجز بضاعة فعلي وقت الطلب، والكمية
// بتتأكد فعليًا بس وقت التحميل. عشان الموزّع يبقى فاهم ده وهو شايف عرض
// السعر، بنحط شارة برتقالية جنب كل صنف (مش حمرا زي "غير متاح" — دي معلومة
// عادية مش تحذير من نقص فعلي).
function unconfirmedBadgeHTML_(order){
  if(STOCK_TRACKED_WAREHOUSES_.includes(asText(order && order.warehouse))) return '';
  return ' <span style="display:inline-block;background:#FBEBD1;color:#8A5A00;' +
         'font-weight:800;font-size:10px;padding:1px 7px;border-radius:9px;' +
         'vertical-align:middle;white-space:nowrap;">\u26a0 \u063a\u064a\u0631 \u0645\u0639\u062a\u0645\u062f \u0625\u0644\u0627 \u0648\u0642\u062a \u0627\u0644\u062a\u062d\u0645\u064a\u0644</span>';
}
function unavailNameStyle_(it){
  return itemUnavailable_(it) ? 'color:#C0392B;font-weight:800;' : '';
}

// وقت بناء رسالة الواتساب: بنعتمد على اللقطة المخزّنة وقت الإضافة للسلة،
// ولو مش موجودة (طلب قديم) بنرجع نحسبها لحظيًا كخطة بديلة.
function itemUnavailable_(it){
  if(it && typeof it.unavailable === 'boolean') return it.unavailable;
  return computeUnavailable_(it && it.main, it && it.product, it && it.color);
}

function buildOrderWaText_(o){
  const d = new Date(o && o.ts ? o.ts : Date.now());
  const dateStr = d.toLocaleDateString('ar-EG-u-nu-latn',{day:'2-digit',month:'2-digit',year:'numeric'});
  const timeStr = d.toLocaleTimeString('ar-EG-u-nu-latn',{hour:'2-digit',minute:'2-digit'});
  const line = '\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501';
  let m = '\ud83d\udeaa *\u0627\u0644\u0642\u0631\u0634\u064a \u0644\u0623\u0628\u0648\u0627\u0628 \u0648\u0634\u0628\u0627\u0628\u064a\u0643 \u0627\u0644\u0640 UPVC*\n';
  m += '\u0637\u0644\u0628 \u062c\u062f\u064a\u062f\n' + line + '\n';
  m += '\ud83d\udc64 \u0627\u0644\u0645\u0648\u0632\u0639: ' + (asText(o.distName) || '-') + '\n';
  m += '\ud83d\udd22 \u0631\u0642\u0645 \u0627\u0644\u0637\u0644\u0628: #' + orderNoDisplay_(o) + '\n';
  m += '\ud83c\udfec \u0645\u062e\u0632\u0646 \u0627\u0644\u062a\u062d\u0645\u064a\u0644: ' + (asText(o.warehouse) || '-') + '\n';
  m += '\ud83d\udd50 \u0648\u0642\u062a \u0627\u0644\u0637\u0644\u0628: ' + dateStr + ' - ' + timeStr + '\n';
  m += line + '\n\ud83d\udce6 *\u0627\u0644\u0623\u0635\u0646\u0627\u0641*\n';
  const items = (o && o.items) ? o.items : [];
  const unavail = [];
  items.forEach(function(it, i){
    const bad = itemUnavailable_(it);
    if(bad) unavail.push(itemFullName_(it));
    m += (i+1) + ') ' + itemFullName_(it) + (bad ? ' \ud83d\udd34 *\u063a\u064a\u0631 \u0645\u062a\u0627\u062d*' : '') + '\n';
    m += '    \u0627\u0644\u0643\u0645\u064a\u0629: ' + (it.qty || 0) + ' ' + (asText(it.unitType) || '') + '\n';
  });
  m += line + '\n';
  // ⚠️ ملاحظة الأصناف غير المتاحة — بتتكتب في آخر الرسالة عشان المسؤول
  // ياخد باله إن الطلب فيه حاجات محتاجة تأكيد قبل التحميل.
  if(unavail.length){
    m += '\ud83d\udd34 *\u0623\u0635\u0646\u0627\u0641 \u063a\u064a\u0631 \u0645\u062a\u0627\u062d\u0629 \u2014 \u0645\u062d\u062a\u0627\u062c\u0629 \u062a\u0623\u0643\u064a\u062f*\n';
    unavail.forEach(function(n){ m += '\ud83d\udd34 *' + n + '*\n'; });
    m += line + '\n';
  }
  if(asText(o.note).trim()) m += '\ud83d\udcdd \u0645\u0644\u0627\u062d\u0638\u0627\u062a: ' + asText(o.note).trim() + '\n';
  m += '\u0625\u062c\u0645\u0627\u0644\u064a \u0639\u062f\u062f \u0627\u0644\u0623\u0635\u0646\u0627\u0641: ' + items.length;
  return m;
}

// ⚠️ السبب الحقيقي إن واتساب مكانش بيفتح: المتصفح (خصوصًا كروم/أندرويد
// وداخل الـPWA) بيمنع window.open لو مانداهش في نفس لحظة ضغطة المستخدم.
// إحنا بننادي عليه بعد await (استنينا رد السيرفر عشان نجيب رقم الطلب الحقيقي)
// فالضغطة بتبقى "ضاعت" وبيتمنع بصمت.
// الحل: بنفتح نافذة فاضية لحظة الضغط على "تأكيد الإرسال" (وهي لسه ضغطة حية)،
// ونحتفظ بيها، وبعد ما الطلب ينجح نوجّهها هي على لينك واتساب.
let __waWin = null;
function reserveWaWindow(){
  try{ __waWin = window.open('about:blank', '_blank'); }catch(e){ __waWin = null; }
}
function releaseWaWindow(){
  try{ if(__waWin && !__waWin.closed) __waWin.close(); }catch(e){}
  __waWin = null;
}
function orderWaUrl_(o){
  return 'https://wa.me/?text=' + encodeURIComponent(buildOrderWaText_(o));
}

// من غير رقم في اللينك -> واتساب بيفتح شاشة "اختار المرسل إليه"
// فالموزع هو اللي يقرر يبعتها لمين (شخص أو جروب) — بس الإرسال نفسه إجباري.
function openOrderWhatsApp(order){
  const o = order || state.lastOrder;
  if(!o){ showToast('مفيش طلب'); return; }
  const url = orderWaUrl_(o);
  // بنتنادى من ضغطة زرار مباشرة، فـ window.open شغّال عادي هنا.
  const w = window.open(url, '_blank');
  if(w){ state.waSent = true; render(); return true; }
  // احتياطي: نوجّه التبويب نفسه
  try{ window.location.href = url; state.waSent = true; render(); return true; }catch(e){}
  showToast('المتصفح منع فتح واتساب — جرّب تاني', 5000);
  return false;
}

function notifyDistributorManually(id){
  const ord = state.orders.find(o=>o.id===id);
  if(!ord) return;
  let msg = notifyMessageText_(ord);
  // ⚠️ من غير رقم متحدد — الرسالة بتفتح واتساب فاضي عشان الأدمن يختار
  // المستلم بنفسه (زي الجروب الخاص) بدل ما تتبعت لرقم الموزع تلقائيًا.
  window.open('https://wa.me/?text=' + encodeURIComponent(msg), '_blank');
}

// أرقام مصر: بنحوّل 01xxxxxxxxx لصيغة دولية 201xxxxxxxxx
function normalizePhoneIntl_(p){
  let d = asText(p).replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('20')) return d;
  if(d.startsWith('0')) return '20' + d.slice(1);
  if(d.startsWith('1')) return '20' + d;
  return d;
}

// الموزع بيبعت الطلب كـ"صورة" ويختار بنفسه هيبعتها لمين (جروب / شخص).
// مفيش رقم محدد — بنفتح شاشة المشاركة بتاعة الموبايل وهو يختار.
//
// ⚠️ قيد مهم: navigator.share لازم يتنده في نفس لحظة الضغطة. لو استنينا الصورة
// تتولد الأول (بتاخد ثانية أو اتنين)، المتصفح بيعتبر إن الضغطة ضاعت وبيلغي
// المشاركة. عشان كده فصلناها خطوتين: "جهّز الصورة" الأول، وبعدين "ابعت".
async function prepareOrderImage(){
  const o = state.lastOrder;
  if(!o){ showToast('مفيش طلب'); return; }
  state.orderImgPreparing = true; render();
  try{
    const res = await buildQuotePDF(o);
    state.orderImage = (res && res.imgBlob) ? res : null;
    if(!state.orderImage) showToast('تعذّر تجهيز الصورة، حاول تاني');
  }catch(e){
    state.orderImage = null;
    showToast('تعذّر تجهيز الصورة: ' + (e && e.message ? e.message : e));
  }
  state.orderImgPreparing = false;
  render();
}

// إرسال الطلب كصورة (نفس صورة عرض السعر، اللي فيها علامات "غير متاح" الحمرا).
// بيجهّز الصورة الأول لو مش متجهّزة، وبعدين يفتح شاشة مشاركة واتساب والموزع
// يختار المستلم. لو الجهاز مبيدعمش مشاركة الملفات، بينزّل الصورة.
async function sendOrderAsImage(){
  const o = state.lastOrder;
  if(!o){ showToast('مفيش طلب'); return; }
  // نجهّز الصورة لو لسه
  if(!state.orderImage || !state.orderImage.imgBlob){
    state.waImgPreparing = true; render();
    try{
      const res = await buildQuotePDF(o);
      state.orderImage = (res && res.imgBlob) ? res : null;
    }catch(e){ state.orderImage = null; }
    state.waImgPreparing = false; render();
    if(!state.orderImage){ showToast('تعذّر تجهيز الصورة، حاول تاني'); return; }
  }
  await shareOrderImage();
  // shareOrderImage بيعلّم state.orderSentToWa — بنزامنها مع waSent عشان الزرار
  if(state.orderSentToWa){ state.waSent = true; render(); }
}

async function shareOrderImage(){
  const q = state.orderImage;
  if(!q || !q.imgBlob){ showToast('جهّز الصورة الأول'); return; }
  const o = state.lastOrder;
  const name = 'طلب_' + String(o ? o.id : 'order').toUpperCase();
  try{
    const img = new File([q.imgBlob], name + '.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[img]})){
      // مفيش رقم — شاشة المشاركة هتفتح وهو يختار الجروب أو الشخص
      await navigator.share({ files:[img], title:'طلبية', text:'طلب #' + (o ? orderNoDisplay_(o) : '') });
      state.orderSentToWa = true;
      render();
      return;
    }
  }catch(e){
    // المستخدم لغى المشاركة — مش خطأ
    if(e && e.name === 'AbortError') return;
  }
  // احتياطي: ننزّل الصورة وهو يرفعها بإيده
  downloadBlob(q.imgBlob, name + '.png');
  showToast('اتحملت الصورة — افتح واتساب وابعتها من المعرض');
  state.orderSentToWa = true;
  render();
}

// تحديث إجباري: بيمسح كل الكاش ويلغي الـ Service Worker ويعيد التحميل من السيرفر.
// بيحل حالة إن الموبايل عالق على نسخة قديمة.
async function forceUpdate(){
  showToast('جارٍ التحديث... استنى لحظة');
  try{
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  // نضيف بارامتر عشوائي عشان نتخطى كاش المتصفح نفسه
  const u = new URL(window.location.href);
  u.searchParams.set('v', Date.now());
  window.location.replace(u.toString());
}

async function copyAppLink(){
  try{
    await navigator.clipboard.writeText(APP_URL);
    showToast('اتنسخ ✅ افتح Safari والصقه');
  }catch(e){
    showToast(APP_URL);
  }
}

function isIOSSafari(){
  if(!isIOSDevice()) return false;
  const ua = navigator.userAgent || '';
  // كروم على iOS فيه CriOS، فايرفوكس FxiOS، إيدج EdgiOS، وتطبيقات جوه (واتساب/فيسبوك) فيها FBAN/FBAV/Instagram
  if(/CriOS|FxiOS|EdgiOS|OPiOS|FBAN|FBAV|Instagram|Line|Twitter/i.test(ua)) return false;
  return /Safari/i.test(ua);
}

// ===== main render =====
// كل مرة بنعمل render بنعيد بناء الصفحة كلها (innerHTML) — وده كان بيضيّع
// مكان التمرير، فالشاشة ترجع لفوق (لأول صنف) في كل مرة تختار صنف.
// هنا بنحفظ مكان التمرير والحقل اللي إيدك فيه، وبنرجّعهم بعد إعادة البناء.
let lastViewKey = '';

// "مرساة" التمرير: بنحفظ العنصر اللي إيدك عليه ومكانه على الشاشة، وبعد إعادة
// البناء بنلاقيه تاني ونظبط التمرير عشان يفضل في نفس المكان بالظبط.
//
// ⚠️ حفظ scrollY لوحده مكانش كفاية: لما تختار صنف، بلوك "حدد التفاصيل" بيتحط
// *فوق* الشبكة، فالمحتوى بيتزحلق لتحت والصنف اللي دوست عليه بيروح من تحت إيدك
// حتى لو التمرير رجع لنفس الرقم. فبنمسك العنصر نفسه مش الرقم.
let scrollAnchor_ = null;

function currentScroll_(){
  return window.scrollY || window.pageYOffset ||
         (document.scrollingElement ? document.scrollingElement.scrollTop : 0) || 0;
}
function scrollTo_(y){
  try{ window.scrollTo(0, y); }catch(e){}
  try{ if(document.scrollingElement) document.scrollingElement.scrollTop = y; }catch(e){}
}

function selectorFor_(el){
  if(!el || !el.dataset || !el.dataset.act) return '';
  let sel = `[data-act="${el.dataset.act}"]`;
  const k = el.getAttribute('data-key');
  const v = el.getAttribute('data-val');
  if(k) sel += `[data-key="${CSS.escape ? CSS.escape(k) : k}"]`;
  if(v) sel += `[data-val="${CSS.escape ? CSS.escape(v) : v}"]`;
  return sel;
}

// بتتنده من onAction قبل ما نغيّر أي حاجة
function setScrollAnchor(el){
  try{
    const sel = selectorFor_(el);
    if(!sel) { scrollAnchor_ = null; return; }
    scrollAnchor_ = { sel, top: el.getBoundingClientRect().top };
  }catch(e){ scrollAnchor_ = null; }
}

function captureUiState_(){
  const el = document.activeElement;
  let focus = null;
  if(el && el.dataset && el.dataset.act && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
    focus = {
      sel: selectorFor_(el),
      start: el.selectionStart,
      end: el.selectionEnd
    };
  }
  return { scrollY: currentScroll_(), focus, anchor: scrollAnchor_ };
}

// ⚠️ كان فيه هنا نظام "مرساة" بيحاول يتتبّع العنصر المضغوط بالاسم ويعوّض
// أي فرق في مكانه بعد الرسم. ده كان بيتعارض مع تثبيت الارتفاع على body
// (اللي بيحل نفس المشكلة أصلاً بطريقة أبسط وأضمن) ومع تثبيت تمرير الشبكة
// الداخلية لوحدها — والتعارض ده هو اللي كان بيسبب قفزة لفوق لما تختار صنف.
// شلنا المرساة خالص وسيبنا حاجتين بس: رجّع نفس رقم التمرير بالظبط، ورجّع
// تمرير الشبكة الداخلية لوحدها (captureGridScroll_/restoreGridScroll_).
// بيحفظ مكان عنصر معيّن على الشاشة (بالـselector بتاعه، مش بمرجع العنصر
// نفسه، عشان العنصر بيتبني من جديد مع كل render) وبيرجّعه لنفس المكان
// بعد أي تغيير — مهما كان السبب في التغيير ده (إضافة/شيل تفاصيل، تغيير
// حالة، ...). أدق بكتير من مسك التمرير كرقم مجرد أو مسك حاوية كبيرة.
function withPositionAnchor_(selector, mutateAndRenderFn){
  let beforeTop = null;
  try{
    const el = document.querySelector(selector);
    if(el) beforeTop = el.getBoundingClientRect().top;
  }catch(e){}

  mutateAndRenderFn();

  if(beforeTop === null) return;
  const applyFix = ()=>{
    try{
      const el2 = document.querySelector(selector);
      if(!el2) return;
      const delta = el2.getBoundingClientRect().top - beforeTop;
      if(Math.abs(delta) > 1) window.scrollBy(0, delta);
    }catch(e){}
  };
  applyFix();
  requestAnimationFrame(applyFix);
}

function restoreUiState_(snap, sameScreen){
  if(!snap) return;
  if(sameScreen && Math.abs(currentScroll_() - snap.scrollY) > 0.5){
    scrollTo_(snap.scrollY);
  }
  const f = snap.focus;
  if(f && f.sel){
    const el = document.querySelector(f.sel);
    if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
      // ⚠️ el.focus() العادي بيخلي المتصفح يسحب الصفحة عشان يوريك الحقل —
      // preventScroll بيرجّع التركيز من غير ما يحرّك الصفحة.
      try{ el.focus({ preventScroll: true }); }catch(e){ el.focus(); }
      try{ el.setSelectionRange(f.start, f.end); }catch(e){}
    }
  }
  if(sameScreen){
    requestAnimationFrame(()=>{
      if(Math.abs(currentScroll_() - snap.scrollY) > 1) scrollTo_(snap.scrollY);
    });
  }
  scrollAnchor_ = null;
}

// 🔑 اللقطة الناقصة: ".productgrid" (شبكة الأصناف) عندها overflow-y:auto
// وscroll خاص بيها لوحدها (مش صفحة المتصفح). كل render بيستبدل الـ innerHTML
// بتاعها بالكامل، فالعنصر القديم بتمريره بيتمسح ويتحط عنصر جديد scrollTop=0 —
// فلو الموزع نازل جوه الشبكة ودوس على صنف تحت، الشبكة "تقفز" لفوق فورًا حتى
// لو صفحة المتصفح نفسها ثابتة. ده كان السبب الحقيقي الباقي وراء القفزات.
function captureGridScroll_(){
  const el = document.querySelector('.productgrid');
  return el ? el.scrollTop : null;
}
function restoreGridScroll_(val){
  if(val === null) return;
  const el = document.querySelector('.productgrid');
  if(el) el.scrollTop = val;
}

// عشان الموزع لما يختار صنف جديد (مش شايله قبل كده) ميحتاجش يدور بنفسه على
// كارت "حدد التفاصيل" اللي ممكن يكون بعيد أوي تحت شبكة الأصناف الطويلة —
// بندزّه (scroll) تلقائيًا لبلوك تفاصيل الصنف ده أول ما يتضاف، مع ترك مسافة
// من فوق عشان الهيدر الثابت ميغطيش أول سطر منه.
function scrollToStagedDetail_(key){
  requestAnimationFrame(()=>{
    const el = document.querySelector(`[data-stagedkey="${CSS.escape(key)}"]`);
    if(!el) return;
    const head = document.querySelector('.fixedhead-outer');
    const headH = head ? head.offsetHeight : 0;
    const rect = el.getBoundingClientRect();
    const targetY = window.scrollY + rect.top - headH - 12;
    window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
  });
}

// بيحط مساحة تحت المحتوى بقد ارتفاع شريط الأزرار الثابت بالظبط،
// عشان آخر كارت في الصفحة يفضل قابل للوصول ومايتغطّاش وراه.
function applyFixedFooterSpacing_(){
  const bar = document.querySelector('.submitbar.fixed');
  const main = document.querySelector('#app > main');
  if(!main) return;
  main.style.paddingBottom = bar ? (bar.offsetHeight + 10) + 'px' : '';
}

function applyFixedHeaderSpacing_(){
  // ⚠️ سطر "نسخة vNN" كان بيروح تحت الهيدر الثابت ويختفي، لأنه أول عنصر
  // جاي في ترتيب الصفحة بعد الهيدر مباشرة — والهيدر الثابت مابياخدش مكانه
  // في الترتيب العادي، فالسطر ده كان بيترسم فوق الصفحة تمامًا (تحت الهيدر).
  // بندفعه هو كمان بنفس ارتفاع الهيدر، وبعده أول عنصر تاني (بانر أو main).
  const head = document.querySelector('.fixedhead-outer');
  const h = head ? head.offsetHeight : 0;
  const version = document.querySelector('#app > .versionline');
  if(version) version.style.marginTop = head ? h + 'px' : '';
  const target = document.querySelector('#app > .installbanner') || document.querySelector('#app > main');
  if(target) target.style.marginTop = '';
}

window.addEventListener('resize', function(){ try{ applyFixedFooterSpacing_(); }catch(e){} });

function render(){
  const app = $('#app');
  const snap = captureUiState_();
  const gridScroll = captureGridScroll_();

  // 🔑 السبب الرئيسي للقفز على مستوى الصفحة: وقت استبدال innerHTML الصفحة
  // بتفضى للحظة، فارتفاعها بيقل، والمتصفح بيقصقص مكان التمرير لأقصى حد متاح.
  // ⚠️ #app عليه min-height:100vh أصلاً، فقفل الارتفاع عليه مبيعملش حاجة —
  // القفل لازم يكون على <body> نفسه (هو صندوق التمرير الفعلي).
  const prevH = document.body.offsetHeight;
  if(prevH) document.body.style.minHeight = prevH + 'px';
  const unlock = ()=>{ try{ document.body.style.minHeight=''; }catch(e){} };

  try{
    if(!isStandaloneMode() && !state.installGateBypassed){
      app.innerHTML = renderInstallGate();
      bindEvents();
      unlock();
      return;
    }
    if(!state.currentUser){
      app.innerHTML = renderAuthView();
      bindEvents();
      unlock();
      return;
    }
    let view;
    if(state.view==='order') view = renderOrderView();
    else if(state.view==='myorders') view = renderMyOrdersView();
    else if(state.view==='manage') view = renderManageView();
    else view = renderAdminView();
    const banner = state.showInstallBanner ? renderInstallBanner() : '';
    app.innerHTML = renderHeader() + banner + view + renderPreviewModal() + renderDiagModal() + renderNotifyPrompt() + renderWarehouseModal() + renderStockModal() + renderPwRequestsModal() + renderCatalogUploadModal() + renderArchiveModal() + renderCartReviewModal() + renderGlobalError();
    bindEvents();
    applyFixedHeaderSpacing_();
    applyFixedFooterSpacing_();

    // نرجّع التمرير بس لو إحنا في نفس الشاشة (مش لما ننتقل من شاشة لشاشة)
    const viewKey = state.view + '|' + (state.successOrderId ? 'success' : '') + '|' + (state.adminUnlocked ? 'a' : '');
    restoreUiState_(snap, viewKey === lastViewKey);
    restoreGridScroll_(gridScroll);
    // ✅ أول ما شاشة النجاح تظهر (انتقال من الفورم ليها)، نثبّت الصفحة فوق
    // عشان الموزع يشوف رسالة النجاح وزرار الواتساب — مش يفضل نازل تحت زي
    // ما كان في الفورم. بنعملها بس عند الدخول للشاشة، مش مع كل رسم.
    if(state.successOrderId && viewKey !== lastViewKey){
      scrollTo_(0);
      requestAnimationFrame(()=>{ scrollTo_(0); });
    }
    lastViewKey = viewKey;
    requestAnimationFrame(()=>{ unlock(); restoreGridScroll_(gridScroll); });
  }catch(err){
    // لو أي جزء من الشاشة فشل يترندر، مانسيبش الشاشة "هنجانة" بصمت — نوريّ رسالة
    // واضحة بدل ما تفضل واقفة من غير أي تفسير.
    console.error('render() failed:', err);
    unlock();
    try{ showToast('⚠️ حصل خطأ في عرض الشاشة: ' + (err && err.message ? err.message : err)); }catch(e){}
  }
}

function renderAuthView(){
  let inner;
  if(state.showBiometricGate) inner = renderBiometricGate();
  else if(state.authView==='register') inner = renderRegisterForm();
  else if(state.authView==='forgot') inner = renderForgotForm();
  else inner = renderLoginForm();
  return `
  <div class="authwrap">
    <div class="authcard" style="text-align:right;">

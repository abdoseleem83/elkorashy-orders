<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>القرشي | طلبات الموزعين</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#002050">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="طلبات القرشي">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
:root{
  --navy:#002050;        /* أزرق كحلي غامق — نفس هوية تطبيق الأبواب بالظبط */
  --navy-deep:#001434;   /* أغمق درجة، للنص عالي التباين */
  --navy-soft:#4FA8DC;   /* أزرق فاتح فاتح — نفس brand-lt بتاع الأبواب */
  --gold:#1080C0;        /* أزرق متوسط زاهي (brand) — للعناصر النشطة/المميزة */
  --gold-light:#4FA8DC;
  --bg:#F3F6FA;          /* نفس خلفية تطبيق الأبواب بالظبط */
  --card:#FFFFFF;
  --ink:#14243A;         /* نفس لون النص بتاع الأبواب */
  --muted:#6B7A8C;
  --line:#DCE4EC;
  --success:#1E7A54;
  --success-bg:#E7F3EE;
  --danger:#B3261E;
  --radius:14px;
}
.ico-svg{vertical-align:middle;flex-shrink:0;position:relative;top:-1px;}
.warehousewarn{
  background:#FBEBD1;color:#8A5A00;border-radius:8px;
  padding:8px 11px;font-size:11.8px;font-weight:700;line-height:1.6;
  margin-bottom:10px;
}
*{box-sizing:border-box;}
/* ⚠️ ده كان السبب الحقيقي إن الهيدر لسه بيتحرك مع التمرير رغم
   position:sticky: overflow-x:hidden من غير overflow-y مكتوب — قاعدة CSS
   بتخلي المتصفح يحط overflow-y:auto ضمنيًا، فـ body كان بيبقى صندوق تمرير
   مستقل عن نافذة العرض الحقيقية. الـ sticky كان بيلتصق بصندوق body الداخلي
   ده، مش بالشاشة اللي إنت شايفها فعليًا — فكان بيبان وكأنه لسه بيتحرك.
   بنكتب overflow-y:visible صراحةً عشان نفس الشاشة (viewport) تفضل هي
   صندوق التمرير الوحيد، وsticky يلتصق بيها هي بالظبط. */
html,body{margin:0;padding:0;max-width:100%;overflow-x:hidden;overflow-y:visible;}
body{
  background:var(--bg);
  color:var(--ink);
  font-family:'Cairo',sans-serif;
  -webkit-font-smoothing:antialiased;
  min-height:100vh;
  font-size:12px;
}
#app{max-width:640px;width:100%;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);overflow-x:hidden;overflow-y:visible;}

/* ---------- profile motif ---------- */
.profile-bar{
  height:5px;
  display:flex;
  width:100%;
}
.profile-bar span{flex:1;}
.profile-bar span:nth-child(1){background:var(--gold);}
.profile-bar span:nth-child(2){background:var(--navy-soft);}
.profile-bar span:nth-child(3){background:var(--gold-light);}
.profile-bar span:nth-child(4){background:var(--navy);}
.profile-bar span:nth-child(5){background:var(--gold);}

.chambers{
  display:flex;
  gap:3px;
  height:22px;
  margin:0 0 2px 0;
}
.chambers i{
  flex:1;
  border:1.5px solid rgba(255,255,255,.35);
  border-radius:2px;
}

/* ---------- header ---------- */
/* ⚠️ position:sticky اتجرّب مرتين ومكنش بيلتصق فعليًا (سواء بسبب overflow
   ضمني على أب، أو تعارض sticky مع أب flex زي #app). بدل ما نكمل نلاحق نفس
   المشكلة، بقى الهيدر جوه صندوق position:fixed حقيقي — ده مش بيعتمد على
   حساب "أقرب أب فيه تمرير" خالص، فمفيش مجال يفشل بنفس الطريقة تاني. */
.fixedhead-outer{
  position:fixed;top:0;left:0;right:0;z-index:100;
  background:var(--navy-deep);
}
.fixedhead-inner{max-width:640px;margin:0 auto;}
header.top{
  background:linear-gradient(155deg,#FFFFFF 0%,#EEF0FA 100%);
  color:var(--ink);
  padding:9px 12px 8px;
  overflow:visible;
  position:relative;
  border-bottom:1px solid var(--line);
}
header.top .brand{
  display:flex;
  align-items:center;
  gap:8px;
}
header.top .logoimg{
  width:27px;height:27px;border-radius:7px;
  background:#fff;object-fit:contain;padding:2px;flex-shrink:0;
  border:1px solid #E7DFC9;
}
header.top h1{font-size:13px;margin:0;font-weight:800;letter-spacing:.1px;line-height:1.2;color:var(--navy-deep);}
header.top p.sub{margin:0;font-size:9.3px;color:var(--muted);font-weight:600;}

header.top.has-cart{padding-left:46px;}

/* السلة — أيقونة صغيرة عائمة أعلى الشمال بعيدة عن باقي الأزرار */
.cartbtn-float{
  position:absolute;
  top:10px;left:10px;
  z-index:5;
  width:32px;height:32px;
  border-radius:50%;
  background:rgba(0,32,80,.08);
  border:1px solid rgba(0,32,80,.22);
  color:var(--navy-deep);
  font-size:14.5px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
  padding:0;
}

nav.tabs{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:8px;
}
/* سهم الرجوع بين صفحات التطبيق — جوه الهيدر فوق التبويبات، يظهر لما فيه صفحة سابقة */
nav.tabs .backnav{
  width:100%;
  background:var(--navy-soft);
  color:#fff;
  border:none;
  border-radius:10px;
  padding:9px;
  font-family:'Cairo',sans-serif;
  font-weight:800;
  font-size:12.5px;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(108,108,224,.3);
}
nav.tabs .backnav:active{background:var(--navy);}
/* التبويبات الأربعة — صف واحد، أزرار مصغّرة كلهم نفس المقاس بالظبط */
nav.tabs .tabgrid{
  display:flex;
  gap:5px;
}
nav.tabs .tabgrid .tabbtn{ flex:1 1 0; min-width:0; }
/* صف الأدوات الصغيرة (بصمة / خصم / خروج) */
nav.tabs .toolrow{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:7px;
  flex-wrap:wrap;
}
.fingerbtn{
  color:var(--muted);
  opacity:.85;
}
.fingerbtn.on{
  background:var(--gold);
  border-color:var(--gold);
  color:#fff;
  opacity:1;
  box-shadow:0 0 8px rgba(16,128,192,.5);
}
.discounttogglebtn{
  background:#fff !important;
  border-color:var(--line) !important;
  color:var(--navy-deep) !important;
  font-weight:800;
  border-radius:999px !important;
}
.discounttogglebtn.small{
  width:auto !important;
  height:34px !important;
  padding:0 14px !important;
  font-size:11px !important;
  min-width:0 !important;
  flex:0 0 auto !important;
}
.discounttogglebtn.off{ text-decoration:line-through; opacity:.7; }
.extradiscwrap{display:inline-flex;align-items:center;gap:4px;vertical-align:middle;direction:rtl;}
.extradiscwrap.mini{margin:0;}
.extradiscwrap label{font-size:12px;color:var(--navy-deep);font-weight:800;white-space:nowrap;}
.extradiscwrap input{width:52px;padding:3px 5px;border:2px solid var(--gold);border-radius:6px;font-size:14px;font-weight:800;text-align:center;background:var(--gold);color:var(--navy-deep);}
.extradiscwrap.mini input{width:38px;padding:2px 4px;font-size:11.5px;}
.extradiscwrap .pctsign{font-size:13px;font-weight:800;color:var(--navy-deep);}
.discounttogglebtn.on{
  background:var(--gold) !important;
  border-color:var(--gold) !important;
  color:#fff !important;
  text-decoration:none;
  opacity:1;
  box-shadow:0 0 8px rgba(16,128,192,.45);
}
/* زرار التبويب الرئيسي — كل الأربعة نفس المقاس والشكل */
nav.tabs .tabbtn{
  display:flex;align-items:center;justify-content:center;gap:3px;
  width:100%;
  min-height:34px;
  background:#fff;
  border:1.5px solid var(--line);
  color:var(--navy-deep);
  padding:6px 3px;
  border-radius:9px;
  font-family:'Cairo',sans-serif;
  font-weight:800;
  font-size:9.6px;
  cursor:pointer;
  transition:.15s;
  position:relative;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}
nav.tabs .tabbtn.active{
  background:var(--navy);
  border-color:var(--navy);
  color:#fff;
  box-shadow:0 3px 10px rgba(0,32,80,.3);
}
/* أزرار الأدوات الصغيرة — دواير متساوية 34px */
nav.tabs .toolbtn{
  width:34px;height:34px;
  min-width:34px;
  border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:15px;
  padding:0;
  border:1.5px solid var(--line);
  background:#fff;
  color:var(--navy-deep);
  cursor:pointer;
  transition:.2s;
  font-family:'Cairo',sans-serif;font-weight:800;
}
nav.tabs .toolbtn.logoutbtn{border-color:rgba(179,38,30,.3);color:var(--danger);}
/* زرار الخروج — باب + كلمة exit، أوسع من الدواير */
nav.tabs .toolbtn.exitbtn{
  width:auto;
  min-width:0;
  border-radius:999px;
  padding:0 14px;
  gap:5px;
  font-size:12px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:.5px;
}
nav.tabs .toolbtn.exitbtn{gap:5px;}
.discounttogglebtn.small{gap:5px;}

main{flex:1;padding:18px 16px 100px;}

/* ---------- cards / sections ---------- */
.card{
  background:var(--card);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:14px;
  border:1px solid var(--line);
}
.card h2{
  font-size:16.2px;
  margin:0 0 12px;
  font-weight:800;
  color:var(--navy);
  display:flex;
  align-items:center;
  gap:8px;
}
.card h2 .num{
  width:22px;height:22px;border-radius:6px;
  background:var(--navy);color:#fff;
  font-size:12.9px;display:flex;align-items:center;justify-content:center;
  font-weight:800;flex-shrink:0;
}

label{
  display:block;
  font-size:14px;
  font-weight:700;
  color:var(--muted);
  margin-bottom:6px;
}
input[type=text],input[type=tel],input[type=number],input[type=password],textarea{
  width:100%;
  border:1.5px solid var(--line);
  border-radius:10px;
  padding:11px 12px;
  font-family:'Cairo',sans-serif;
  font-size:16.2px;
  color:var(--ink);
  background:#FCFBF8;
}
input:focus,textarea:focus,button:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:1px;
  border-color:var(--gold);
}
textarea{resize:vertical;min-height:60px;}
.field{margin-bottom:12px;}
.field:last-child{margin-bottom:0;}
.row2{display:flex;gap:10px;}
.row2 .field{flex:1;}
.row3{display:flex;gap:6px;}
.row3 .field{flex:1;min-width:0;margin-bottom:0;}
.row3 .field input{padding:8px 6px;font-size:11.5px;}
.row3 .field label{font-size:10.5px;margin-bottom:2px;}
.distcard .field{margin-bottom:8px;}

/* chips */
.chipwrap{display:flex;flex-wrap:wrap;gap:8px;}
.inlinemulticolor{margin-top:8px;}
.inlinecolorlabel{font-size:12px;font-weight:800;color:var(--navy);margin:8px 0 3px;}
.addcolorbtn{
  display:inline-flex;align-items:center;justify-content:center;gap:5px;
  width:auto;margin-top:8px;background:#fff;border:1.5px dashed var(--navy-soft);
  color:var(--navy);border-radius:999px;padding:6px 14px;font-family:'Cairo',sans-serif;
  font-weight:800;font-size:11.6px;cursor:pointer;
}
.addcolorbtn:active{background:#EEF0FA;}
/* 4 في الصف — للقطاعات والألوان بالظبط زي ما طلب */
.chipwrap.chipgrid4{display:grid;grid-template-columns:repeat(4, minmax(0,1fr));gap:7px;}
.chipwrap.chipgrid4 .chip{padding:9px 6px;text-align:center;}
/* لون مميّز لكل قطاع — يبقى واضح ومختلف عن اللي جنبه في شبكة الـ4 في الصف */
/* الألوان الفعلية — خلفية تمثل اللون الحقيقي */
.chip.sc-1{background:#EAF3FB;border-color:#8FB8DE;color:#1F4E79;}
.chip.sc-2{background:#EAF7EF;border-color:#8FCFA6;color:#1E6B3A;}
.chip.sc-3{background:#FBEFEA;border-color:#E3A98A;color:#8A4A1F;}
.chip.sc-4{background:#F4EAFB;border-color:#C6A0E0;color:#5B2C82;}
.chip.sc-5{background:#FBEAF0;border-color:#E0A0BE;color:#82285A;}
.chip.sc-6{background:#EAEFFB;border-color:#A0B3E0;color:#2A3C82;}
.chip.sc-7{background:#FBF7EA;border-color:#E0CE9F;color:#7A5F1F;}
.chip.sc-8{background:#EEEEEE;border-color:#BFBFBF;color:#444;}

/* الألوان الحقيقية للاختيار (أبيض، بيج، خشبي، أسود، رمادي، أرو) */
.chip.color-white{background:#FFFFFF;border-color:#D0D0D0;color:#333;}
.chip.color-beige{background:#D4A574;border-color:#C49464;color:#333;}
.chip.color-wood{background:#8B6F47;border-color:#6B5435;color:#FFF;}
.chip.color-black{background:#000000;border-color:#333333;color:#FFF;}
.chip.color-gray{background:#A9A9A9;border-color:#808080;color:#FFF;}
.chip.color-aro{background:#8B7BA8;border-color:#6B5B88;color:#FFF;}
.chip.sc-1.active,.chip.sc-2.active,.chip.sc-3.active,.chip.sc-4.active,
.chip.sc-5.active,.chip.sc-6.active,.chip.sc-7.active,.chip.sc-8.active{
  background:var(--navy);border-color:var(--navy);color:#fff;
}
/* الألوان بقت مربعات متساوية بالظبط (مش بيضاوي زي القطاعات) */
.chipwrap.chipgrid4.chipsquares .chip{
  /* ⚠️ aspect-ratio:1/1 + overflow:hidden كانوا بيقصّوا أي اسم لون طويل
     (زي "بيج بكاوتش 6 م") ويسيبوا كلمة واحدة بس ظاهرة. المربع دلوقتي
     "مربع لحد ما المحتوى يحتاج مساحة أكتر" — يكبر لفوق لو الاسم طويل
     بدل ما يقص جزء منه، ومفيش overflow:hidden خالص على النص. */
  aspect-ratio:1/1;
  min-height:64px;
  max-width:80px;
  width:100%;
  min-width:0;
  margin:0 auto;
  border-radius:10px;
  padding:4px 3px;
  font-size:10px;
  line-height:1.2;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  white-space:normal;
  word-break:break-word;
  height:auto;
}
.chipwrap.chipgrid4.chipsquares .chip small{
  font-size:8px;line-height:1.1;white-space:normal;word-break:break-word;
}
.whgrid{display:grid;grid-template-columns:repeat(2, 1fr);gap:10px;}
.cartbtn{position:relative;}
.cartbadge{
  position:absolute;top:-6px;left:-6px;background:var(--danger);color:#fff;
  border-radius:999px;min-width:18px;height:18px;font-size:10.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;padding:0 4px;
}
.polldiag{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  font-size:11.5px;color:var(--muted);font-weight:700;
  background:#F4F1E8;border-radius:8px;padding:6px 10px;margin-bottom:10px;
}
.polldiag button{
  background:var(--navy);color:#fff;border:none;border-radius:7px;
  padding:5px 12px;font-family:'Cairo',sans-serif;font-weight:800;font-size:11px;cursor:pointer;
}
.navbadge{
  display:inline-flex;align-items:center;justify-content:center;
  background:var(--danger);color:#fff;border-radius:999px;
  min-width:20px;height:20px;font-size:11px;font-weight:800;padding:0 5px;
  margin-right:5px;vertical-align:middle;
  animation:navbadgepulse 1.2s ease-in-out infinite;
}
@keyframes navbadgepulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.18);}
}
.whtile{
  border:1.5px solid var(--line);background:#FCFBF8;border-radius:12px;
  padding:16px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;
  font-family:'Cairo',sans-serif;font-size:14px;font-weight:700;color:var(--ink);
  cursor:pointer;
}
.whtile .whicon{font-size:28px;}
.whtile.active{background:var(--navy);border-color:var(--navy);color:#fff;}
.chip{
  border:1.5px solid var(--line);
  background:#FCFBF8;
  color:var(--ink);
  padding:9px 14px;
  border-radius:999px;
  font-family:'Cairo',sans-serif;
  font-size:12px;
  font-weight:600;
  cursor:pointer;
}
.chip.active{
  background:var(--navy);
  border-color:var(--navy);
  color:#fff;
}
.chip.gold.active{background:var(--gold);border-color:var(--gold);color:var(--navy-deep);}

/* شيبس عمودي (قايمة رأسية) - بيتستخدم لعمود القطاعات الرئيسية */
.chipwrap-vertical{display:flex;flex-direction:column;flex-wrap:nowrap;gap:6px;}
.chipwrap-vertical .chip{
  width:100%;
  text-align:center;
  border-radius:10px;
  padding:10px 6px;
  white-space:normal;
  line-height:1.3;
}

/* تخطيط الأعمدة الثلاثة: القطاعات / الأصناف / التفاصيل - جنب بعض وقابلة للتمرير أفقيًا */
.ordercols{
  display:flex;
  gap:8px;
  align-items:flex-start;
  overflow-x:auto;
  padding-bottom:6px;
  -webkit-overflow-scrolling:touch;
  margin-bottom:12px;
}
.ordercols .card{margin-bottom:0;}
.ordercol{flex:0 0 auto;}
.ordercol-sectors{width:112px;}
.ordercol-products{width:230px;}
.ordercol-details{width:250px;}
.ordercol .productgrid{
  grid-template-columns:1fr;
}

.subchipwrap-compact{
  display:grid;
  grid-template-columns:repeat(4, 1fr);
  gap:5px;
}
.chip.subchip-compact{
  padding:6px 5px;
  font-size:13.4px;
  border-radius:10px;
  line-height:1.3;
  white-space:normal;
  text-align:center;
  overflow-wrap:break-word;
}

.searchbox{position:relative;margin-bottom:10px;}
.searchbox input{padding-left:14px;}
.accsearchhint{font-size:11.5px;color:var(--navy-soft);background:#EEF0FA;border-radius:8px;padding:7px 10px;margin-bottom:8px;font-weight:700;}

.productgrid{
  display:grid;
  grid-template-columns:repeat(4, minmax(0,1fr));
  gap:7px;
  padding:2px;
}
/* الأكسسوارات: أسماء قصيرة، فبنعمل خانات أصغر وأعمدة أكتر */
.productgrid.compact{
  grid-template-columns:repeat(auto-fill, minmax(78px, 1fr));
  gap:6px;
}
.productgrid.compact .ptile{
  min-height:54px;
  font-size:10.6px;
  padding:6px 4px 16px;
}
.productgrid.compact .ptile .stocktag,
.productgrid.compact .ptile .unavailtag{
  font-size:7.8px;
}
.productgrid .ptile{
  border:1.5px solid var(--line);
  border-radius:9px;
  background:#FCFBF8;
  padding:8px 5px 22px;
  font-size:12px;
  line-height:1.3;
  text-align:center;
  cursor:pointer;
  min-width:0;
  overflow-wrap:break-word;
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:72px;
  word-break:break-word;
}
.productgrid .ptile:hover{background:#F0EDE4;}

/* ===== وضع القائمة: الأصناف تحت بعض في صفوف بدل الشبكة =====
   ⚠️ مغيّرناش أي لون — كل كلاسات الحالة (instock/lowstock/outstock/
   blackstock/unavailable) وألوان اللافتات زي ما هي بالظبط. اللي اتغير
   هو التخطيط بس: عمود واحد، والاسم يمين واللافتة شمال في نفس الصف. */
.productgrid.listmode,
.productgrid.listmode.compact{
  grid-template-columns:1fr;
  gap:5px;
}
.productgrid.listmode .ptile,
.productgrid.listmode.compact .ptile{

.productgrid.listmode .ptile .tick{

}
.productgrid.listmode .ptile .stocktag,

.qtystepper{display:flex;align-items:center;gap:10px;}

}

.addbtn{

}

/* cart */
.cartrow{
  display:flex;

  align-items:center;
  padding:11px 0;
  border-bottom:1px solid var(--line);
  gap:10px;
}

.cartrow .info{flex:1;min-width:0;}
.cartrow .pname{font-size:15.1px;font-weight:700;color:var(--ink);}
.cartrow .pmeta{font-size:13.4px;color:var(--muted);margin-top:2px;}
.cartrow .qty{font-size:15.1px;font-weight:800;color:var(--navy);white-space:nowrap;}
.cartrow .del{
  background:none;border:none;color:var(--danger);font-size:20.2px;cursor:pointer;padding:4px 6px;
}
.cartrow .del.edit{color:var(--navy);font-size:16.8px;}
.cartempty{color:var(--muted);font-size:14.6px;text-align:center;padding:14px 0;}
.linetotal{font-size:11.8px;color:var(--gold);font-weight:700;}
.autotag{font-size:11.2px;color:var(--navy);background:#EAF0F8;padding:1px 6px;border-radius:6px;font-weight:700;}
.pricetablewrap{overflow-x:auto;margin-top:14px;border:1px solid var(--line);border-radius:10px;}
.pricetable{width:100%;border-collapse:collapse;font-size:13.4px;white-space:nowrap;}
.pricetable th,.pricetable td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line);}
.pricetable th{background:var(--navy);color:#fff;font-weight:700;font-size:12.9px;}
.pricetable td:nth-child(2){text-align:right;white-space:normal;min-width:140px;}
.pricetable tbody tr:nth-child(even){background:#FAF9F5;}
.pricetable tbody tr:last-child td{border-bottom:none;}
.carttotal{
  display:flex;justify-content:space-between;align-items:center;
  margin-top:12px;padding-top:12px;border-top:2px solid var(--navy);
  font-size:15.7px;font-weight:800;color:var(--navy);
}
.carttotal b{font-size:17.9px;}
.pricenote{font-size:12.3px;color:#8A5A00;margin-top:6px;text-align:center;}

.submitbar{
  padding:14px 16px 18px;
  margin-top:-10px;
}
/* ⚠️ position:sticky ماكانش بيثبّت الشريط فعليًا في التخطيط ده — نفس المشكلة
   اللي حصلت مع الهيدر قبل كده (html/body وoverflow بيعملوا صندوق تمرير جوّاني،
   فالـsticky بيلتصق بيه مش بالشاشة). الحل المضمون: position:fixed حقيقي +
   دالة JS بتقيس ارتفاع الشريط وتحط padding-bottom بنفسه على <main> عشان
   آخر كارت مايتخبّاش وراه. */
.submitbar.fixed{
  position:fixed;bottom:0;left:0;right:0;z-index:90;
  margin-top:0;
  padding:9px 16px calc(11px + env(safe-area-inset-bottom, 0px));
  background:var(--bg);
  border-top:1px solid var(--line);
  box-shadow:0 -6px 20px rgba(0,0,0,.12);
}
.submitbar.fixed .submitbar-inner{max-width:640px;margin:0 auto;}
.submitbar.fixed .cartbar{box-shadow:none;margin-bottom:6px;}
/* ⚠️ الشكل ده اتوحّد بعد ما اتشتكى إن "إرسال الطلب" شكله مختلف تمامًا
   عن "معاينة"/"حفظ للسلة" (عرض وطول وتخطيط مختلف). الثلاثة دلوقتي بنفس
   الحجم والشكل بالظبط — بس إرسال الطلب فاضل بلونه الذهبي المميز. */
.submitrow{display:flex;gap:8px;}
/* شريط السلة — بيظهر فوق أزرار الإرسال أول ما يتضاف صنف */
.cartbar{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  background:#fff;border:1.5px solid var(--navy-soft);border-radius:12px;
  padding:7px 10px;margin-bottom:8px;
  box-shadow:0 4px 14px rgba(0,0,0,.08);
}
.cartbar-txt{font-size:11.6px;font-weight:800;color:var(--navy-deep);}
.cartbar-btn{
  background:var(--navy);color:#fff;border:none;border-radius:9px;
  padding:8px 16px;font-family:'Cairo',sans-serif;font-weight:800;font-size:12px;cursor:pointer;
}
.cartbar-btn:active{background:var(--navy-deep);}
/* شاشة النجاح: تنبيه إجباري لو الطلب ماتبعتش واتساب */
.wanote{
  margin:16px 0;padding:14px;border-radius:14px;
  background:#E9F7EF;border:1.5px solid #25D366;text-align:center;
}
.wanote-t{font-size:13px;color:var(--ink);margin:0 0 12px;line-height:1.6;}
.wanote-btn{
  width:100%;background:#25D366;color:#fff;border:none;border-radius:12px;
  padding:15px;font-family:'Cairo',sans-serif;font-weight:800;font-size:15.5px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:8px;
  box-shadow:0 6px 18px rgba(37,211,102,.4);
  animation:wapulse 1.4s ease-in-out infinite;
}
.wanote-btn.sent{
  background:#1E8E4E;animation:none;box-shadow:none;
}
.wanote-btn .ic{font-size:20px;}
.wanote-arrow{
  font-size:30px;margin-top:6px;line-height:1;
  animation:waarrow 1s ease-in-out infinite;
}
@keyframes wapulse{
  0%,100%{transform:scale(1);}
  50%{transform:scale(1.04);}
}
@keyframes waarrow{
  0%,100%{transform:translateY(0);opacity:1;}
  50%{transform:translateY(-8px);opacity:.55;}
}
.submitrow .submitbtn,
.submitrow .savebtn{
  flex:1;

}

}

<script>
// ===== الكتالوج الاحتياطي واللوجو =====
// ⚠️ الاتنين دول كانوا مكتوبين هنا كسطرين عملاقين: الكتالوج ٢٣٩ كيلوبايت
// واللوجو ٤١ كيلوبايت base64 — يعني ~٢٨٠ كيلوبايت من الملف بيانات مش كود،
// وبتتحمّل من أول بايت في كل مرة التطبيق بيتجدد فيها.
// دلوقتي بقوا ملفين مستقلين (data/catalog-fallback.json و logo.jpg) متخزنين
// في كاش الـ Service Worker، فالتطبيق بيفتح أسرع بكتير وبرضه شغال أوفلاين.
const LOGO_SRC = 'logo.jpg';
let FALLBACK_CATALOG = [];

// اللوجو بيتحمّل مرة واحدة وقت الإقلاع ويتحوّل لـ data URI ويتخزّن في الذاكرة.
// ⚠️ ليه data URI ومش الملف مباشرة؟ لأن html2canvas (اللي بيولّد عروض الأسعار
// وصور الطلبات) بيصوّر نسخة من الصفحة، ولو الصورة لسه بتتحمّل وقت التصوير
// بتطلع فاضية في الـ PDF. الـ data URI بيرسم فورًا من غير أي انتظار.
// قبل ما يخلص التحميل (أول لحظات بس) بنستخدم الملف عادي — العرض على الشاشة
// مالوش مشكلة مع ده.
let LOGO_DATA_URI = '';
function logoSrc_(){ return LOGO_DATA_URI || LOGO_SRC; }
async function preloadLogo_(){
  try{
    const res = await fetch(LOGO_SRC, { cache:'force-cache' });
    if(!res.ok) return;
    const blob = await res.blob();
    LOGO_DATA_URI = await new Promise((resolve, reject)=>{
      const fr = new FileReader();
      fr.onload = ()=>resolve(fr.result);
      fr.onerror = reject;
      fr.readAsDataURL(blob);
    });
  }catch(e){ /* الملف مش متاح — بنفضل على المسار العادي */ }
}
// ===== constants =====

const LS_ADMIN_TOKEN_KEY = 'qurashi_admin_token';
const LS_MANAGE_TOKEN_KEY = 'qurashi_manage_token';
// ===== سطر الاعتماد (تصميم وتنفيذ) =====
// عايز تشيل الرقم؟ امسحه من السطر ده بس. عايز تشيل السطر خالص؟ خليه ''.
const CREDIT_LINE = '';

// اللي التطبيق بيولّدها — عرض السعر، تقرير الأرصدة، طلبية النواقص... إلخ.
const PREPARED_BY_LINE = '';
// ⚠️ بتتنادى بعد كل addImage في أي مستند PDF متعدد الصفحات، عشان تحط سطر
// "إعداد" + رقم الصفحة في هامش أسفل الصفحة الحالية بالظبط (مش آخر المستند

// عشان الإحداثيات تتحط على الصفحة الصح.

const APP_BUILD = 'v200';
const VAPID_PUBLIC_KEY = 'BE8Immwt7xgsP6f4Ka1KUPA5u7qCXgqohZQqksL0B2UfGWb8t_p9XyVc6AMG84zgVt9GP1l3CLCMKX5OARxeYQ0';

// ⚠️ المراحل بقت اتنين بس بطلب صريح: "تم استلام الطلب" ثم "تم تنفيذ الطلب".

const STATUS_LEGACY_PENDING = 'تحت التنفيذ';

function normStatus_(st){
  const v = String(st == null ? '' : st).trim();

// ⚡ فهرس الكتالوج للبحث السريع (O(1) بدل المسح الخطي O(n)):
//   - CATALOG_INDEX: مفتاح دقيق "main|product|color" → الصنف
//   - CATALOG_BY_MAIN_PRODUCT: مفتاح "main|product" → مصفوفة الأصناف (للبحث بدون لون)
//   - CATALOG_BY_PRODUCT: مفتاح "product" → مصفوفة الأصناف (findCatalogItemAnyMain)
// لازم تتناداها rebuildCatalogIndex_() بعد أي تعديل على CATALOG.
let CATALOG_INDEX = new Map();
let CATALOG_BY_MAIN_PRODUCT = new Map();
let CATALOG_BY_PRODUCT = new Map();

function rebuildCatalogIndex_(){
  CATALOG_INDEX = new Map();
  CATALOG_BY_MAIN_PRODUCT = new Map();
  CATALOG_BY_PRODUCT = new Map();
  for(const d of CATALOG){
    const np = normalizeProductName(d.product);
    const nc = normalizeProductName(d.color);
    CATALOG_INDEX.set(d.main + '|' + np + '|' + nc, d);
    const mpKey = d.main + '|' + np;
    let mpArr = CATALOG_BY_MAIN_PRODUCT.get(mpKey);
    if(!mpArr){ mpArr = []; CATALOG_BY_MAIN_PRODUCT.set(mpKey, mpArr); }
    mpArr.push(d);
    let pArr = CATALOG_BY_PRODUCT.get(np);
    if(!pArr){ pArr = []; CATALOG_BY_PRODUCT.set(np, pArr); }
    pArr.push(d);
  }
}

//

const LIB_SRC_ = {
  html2canvas: 'vendor/html2canvas.min.js',
  jspdf:       'vendor/jspdf.umd.min.js',
  exceljs:     'vendor/exceljs.min.js'
};
const LIB_READY_ = {
  html2canvas: ()=> typeof html2canvas !== 'undefined',
  jspdf:       ()=> typeof window.jspdf !== 'undefined',
  exceljs:     ()=> typeof ExcelJS !== 'undefined'
};
const libLoading_ = {};

function loadScriptOnce_(src){
  return new Promise((resolve, reject)=>{
    const el = document.createElement('script');
    el.src = src;
    el.async = true;
    el.onload = ()=>resolve();
    el.onerror = ()=>reject(new Error('تعذّر تحميل ' + src));
    document.head.appendChild(el);
  });
}

// بترجّع true لو كل المكتبات المطلوبة جاهزة، وfalse لو واحدة فشلت.
// الفشل مابيرميش استثناء — كل مكان بينده عليها بيعرض رسالة مفهومة للمستخدم.
async function ensureLibs_(){
  const names = Array.prototype.slice.call(arguments);
  try{
    await Promise.all(names.map(n=>{
      if(LIB_READY_[n]()) return Promise.resolve();
      if(!libLoading_[n]) libLoading_[n] = loadScriptOnce_(LIB_SRC_[n]);
      return libLoading_[n];
    }));
    return names.every(n=>LIB_READY_[n]());
  }catch(e){
    names.forEach(n=>{ libLoading_[n] = null; });   // نسمح بمحاولة تانية
    console.warn('ensureLibs_:', e);
    return false;
  }
}

function productsForGroup(main, sub){
  const seen = new Map();
  CATALOG.filter(d=>d.main===main && (!sub || d.sub===sub)).forEach(d=>{
    if(!seen.has(d.product)) seen.set(d.product, []);
    seen.get(d.product).push(d);
  });
  return seen;
}
function subGroupsForMain(main){
  return [...new Set(CATALOG.filter(d=>d.main===main).map(d=>d.sub).filter(Boolean))];
}
function sectorNeedsSubFilter(main){
  return main.includes('اكسسوارات') || main==='ابواب WPC';
}
function colorsForProduct(main, product){
  return CATALOG.filter(d=>d.main===main && d.product===product);
}
// الألوان المتاحة في قطاع معيّن (بترتيب ظهورها في الكتالوج) — لو القطاع مفيهوش
// ألوان حقيقية (زي شاتر) بترجع مصفوفة فاضية، وساعتها مش هيظهر خطوة "اختار اللون".
function colorsForMain(main){
  const seen = [];
  CATALOG.forEach(d=>{
    if(d.main===main && d.color && !seen.includes(d.color)) seen.push(d.color);
  });
  return seen;
}
function hasRealColors(main, product){
  return colorsForProduct(main, product).some(c => c.color);
}
function isProductFullyUnavailable(main, product){
  const opts = colorsForProduct(main, product);
  return opts.length>0 && opts.every(c=>c.available===false);
}
function isColorUnavailable(main, product, color){
  const item = findCatalogItem(main, product, color);
  return item ? item.available===false : false;
}
// "غير متوفر بالمخزون حاليًا" — تحذير بس، مش بيمنع الاختيار أو عرض السعر
// (عشان موزع/عميل يقدر ياخد سعر صنف حتى لو مفيش رصيد منه دلوقتي).
// أقل من لفة كاملة = صفر فعليًا (في كل مكان، مش بس في التقرير)
// حالة اللون في شاشة الاختيار:
//   'out'  = صفر فعلي (الرصيد صفر أو الأدمن قافله)      -> أحمر "مفيش رصيد"
//   'crit' = أقل من لفة كاملة                            -> أحمر "كمية قليلة"
//   'low'  = أقل من 5 لفات (بس لفة فأكتر)               -> أصفر "كمية قليلة"
//   'ok'   = كفاية
function colorStockLevel(item){
  if(!item || item.available===false) return 'out'; // "موقوف" يفضل زي ما هو
  if(!warehouseAffectsStock(item && item.main)) return 'ok';
  const n = Number(item.stock);
  if(!isFinite(n) || n <= 0) return 'out';
  if(item.inStock === false) return 'out';
  const content = Number(item.unit) || 1;
  if(n < content) return 'crit';               // أقل من لفة
  if(n < lowStockLimitFor(item)) return 'low'; // أقل من 5 لفات
  return 'ok';
}

// المخازن دي (العاشر والمنصورة) ماعندهاش تتبّع رصيد حقيقي — الأصناف كلها
// تتعامل كأنها متاحة دايمًا فيها من غير أي تلوين أو لافتة "متوفر/مفيش رصيد".
// وطنطا والإسكندرية بس هما اللي بيتبع فيهم الرصيد الحقيقي.
// والعميل (مش الموزع) ميشوفش أي معلومة رصيد في أي مخزن، ومش بيشوف اختيار
// مخزن أصلاً — فالرصيد بالنسبالو مالوش معنى في كل الأحوال.
function isClientAccount(){
  return !!(state.currentUser && state.currentUser.distType === 'عميل');
}

// المخازن اللي الرصيد بيتطبّق عليها. الرصيد في شيت "الأصناف" رقم واحد عام
// (مش رصيد منفصل لكل مخزن)، فبنحدد هنا هو بيتحسب لمين.
// أي مخزن مش في القايمة دي: كل أصنافه بتعتبر متاحة، ومفيش علامة "غير متاح"
// لا في الشاشة ولا في عرض السعر ولا في رسالة الواتساب.
// ⚠️ الصنف الموقوف يدويًا من الأدمن (عمود "لا") بيفضل غير متاح في كل المخازن.
// ⚠️🛘 CRITICAL: هذه المصفوفة تحدد المخازن اللي بيتم حجز البضاعة فيهم.
// ⚠️ تعديلها = حجز بضاعة خاطئ + أرقام رصيد كاذبة.
// ⚠️ **بلاش تغيّرها إلا لو قالتلك الإدارة العليا بالظبط.**
const STOCK_TRACKED_WAREHOUSES_ = ['طنطا'];
// ⚠️ الاكسسوارات (main يحتوي على "اكسسوارات") مستثناة من تتبّع الرصيد في كل
// المخازن (حتى طنطا) — بيتعاملوا زي أي مخزن تاني: متاحين دايمًا من غير أي
// تلوين أو لافتة "متوفر/مفيش رصيد". بطلب صريح من المستخدم.
function warehouseAffectsStock(main){
  if(state.currentUser && state.currentUser.distType === 'عميل') return false;
  if(main && main.includes('اكسسوارات')) return false;
  return STOCK_TRACKED_WAREHOUSES_.includes(state.warehouse);
}

function effectiveInStock(item){
  if(!item || item.available===false) return false; // "موقوف" من الأدمن يفضل يتطبق دايمًا
  if(!warehouseAffectsStock(item && item.main)) return true;
  if(item.inStock===false) return false;
  const n = Number(item.stock);
  if(!isFinite(n) || n <= 0) return false;
  const content = Number(item.unit) || 1;
  return n >= content;
}

function isProductOutOfStock(main, product){
  const opts = colorsForProduct(main, product);
  return opts.length>0 && opts.every(c=>c.available!==false && isColorOutOfStock(main, product, c.color));
}

// ⚠️ كان فيه تناقض: تاج الصنف كان بيقول "مفيش رصيد" (أحمر) حتى لو لون واحد
// فيه عيدان متاحة (crit) — بينما شاشة تفاصيل نفس الصنف كانت بتوري اللون ده
// "متاح اعواد". بنجمع حالة الألوان كلها هنا بنفس المنطق (3 مستويات) عشان
// التاج فوق يطابق اللي جوه بالظبط:
//   'ok'   = فيه لون واحد على الأقل بلفة كاملة فأكتر
//   'crit' = مفيش لفة كاملة في أي لون، بس فيه عيدان في لون واحد على الأقل
//   'out'  = كل الألوان صفر فعليًا
function productStockLevel(main, product){
  const opts = colorsForProduct(main, product).filter(c=>c.available!==false);
  if(!opts.length) return 'out';
  let sawCrit = false;
  for(const c of opts){
    const lvl = colorStockLevel(findCatalogItem(main, product, c.color));
    if(lvl==='ok' || lvl==='low') return 'ok';
    if(lvl==='crit') sawCrit = true;
  }
  return sawCrit ? 'crit' : 'out';
}
// بيرجّع نص مختصر بالألوان المتوفرة فعلاً في الصنف ده:
// "جميع الألوان" لو كلها متوفرة · "بيج، ابيض" لو بعضها · '' لو مفيش
// هل الكمية المتاحة قليلة؟ (بنرجّع true/false بس — الموزع مش المفروض يشوف الرقم)
// الرقم اللي جاي من السيرفر أصلاً = الرصيد − المحجوز، وبالعود/القطعة.
function lowStockLimitFor(item){
  // محتوى اللفة (عمود D في شيت الأصناف) — للقطعة بيبقى 1
  const content = Number(item && item.unit) || 1;
  return LOW_STOCK_ROLLS * content;
}
function isLowStock(main, product, color){
  const item = findCatalogItem(main, product, color);
  if(!effectiveInStock(item)) return false;   // أقل من لفة = صفر مش قليل
  const q = Number(item.stock);
  return q < lowStockLimitFor(item);
}

function availableColorsLabel(main, product){
  const opts = colorsForProduct(main, product).filter(c => c.available !== false);
  if(!opts.length) return '';
  const withColor = opts.filter(c => c.color);
  // صنف من غير ألوان أصلاً
  if(!withColor.length) return opts.some(c=>effectiveInStock(c)) ? 'متوفر' : '';
  const inStock = withColor.filter(c => effectiveInStock(c)).map(c => c.color);
  if(!inStock.length) return '';
  if(inStock.length === withColor.length) return 'جميع الألوان';
  return inStock.join('، ');
}

// بيرجّع أسماء الألوان اللي فيها "كمية قليلة" (عيدان بس، مفيش لفة كاملة) —
// عشان تاج الصنف "كمية قليلة" يوضّح أنهي لون بالظبط، مش يسيب الموزع يخمّن.
function lowStockColorsLabel(main, product){
  const opts = colorsForProduct(main, product).filter(c => c.available !== false && c.color);
  const names = opts
    .filter(c => colorStockLevel(findCatalogItem(main, product, c.color)) === 'crit')
    .map(c => c.color);
  return names.join('، ');
}

function isColorOutOfStock(main, product, color){
  const item = findCatalogItem(main, product, color);
  if(!item) return false;
  return item.available!==false && !effectiveInStock(item);
}
function unitOptionsForGroup(main){
  if(main==='ابواب WPC') return ['بدون إكسسوارات','بإكسسوارات'];
  if(['قطاعات PVC كومبن','قطاعات كرافت لاين','نيو لاين','شاتر'].includes(main)) return ['لفة','عود'];
  if(main.includes('اكسسوارات')) return ['كرتونة','قطعة'];
  if(main===OTHER_SECTOR) return ['قطعة','كرتونة','لفة','عود'];
  return ['قطعة'];
}
function unitColumnLabel(main){
  return main==='ابواب WPC' ? 'الإكسسوارات' : 'الوحدة';
}

// ===== تحميل الأصناف =====
// ترتيب المصادر (من الأحسن للأسوأ):
//   ١) السيرفر مباشرة — أسعار وأرصدة لحظية ✅
//   ٢) آخر نسخة ناجحة متخزنة على الجهاز — أسعار وأرصدة حقيقية بس قديمة شوية ⚠️
//   ٣) الكتالوج الاحتياطي (ملف ثابت) — أسامي الأصناف بس، من غير أسعار ولا أرصدة ⛔
//
// ⚠️ المصدر التالت ده كان **المصدر الاحتياطي الوحيد** قبل كده، وده كان بيكدب
// على الموزع: كل الأصناف بتبان "متاحة" (حتى الموقوف والمنتهي من المخزن) وكل
// الأسعار بتختفي — فالموزع يبعت طلب بأصناف مش موجودة أصلاً ويستلم رد بعدين
// إنها كلها مش متاحة. دلوقتي بقى آخر خيار، وبقى فيه تحذير ظاهر في كل الحالات.

function normalizeCatalogItems_(items){
  return items.map(d=>({
    name:d.name, main:d.main, sub:d.sub,
    unit: Number(d.unit)||1, product: d.product || d.name, color: d.color || '',
    price: (d.price===null || d.price===undefined || d.price==='') ? null : Number(d.price),
    available: d.available !== false,
    inStock: d.inStock !== false,
    stock: (d.stock===null || d.stock===undefined) ? null : Number(d.stock),
    reserved_qty: (d.reserved_qty===null || d.reserved_qty===undefined) ? 0 : Number(d.reserved_qty)
  }));
}

function saveCatalogCache_(items, discounts){
  try{
    localStorage.setItem(LS_CATALOG_CACHE_KEY, JSON.stringify({
      ts: Date.now(), items: items, discounts: discounts || {}
    }));
  }catch(e){ /* الذاكرة اتملت — مش مشكلة، بنكمل عادي */ }
}

function readCatalogCache_(){
  try{
    const raw = localStorage.getItem(LS_CATALOG_CACHE_KEY);
    if(!raw) return null;
    const c = JSON.parse(raw);
    if(c && Array.isArray(c.items) && c.items.length) return c;
  }catch(e){}
  return null;
}

async function loadFallbackFile_(){
  if(FALLBACK_CATALOG.length) return FALLBACK_CATALOG;
  try{
    const res = await fetch('data/catalog-fallback.json', { cache:'force-cache' });
    if(res.ok){
      const d = await res.json();
      if(Array.isArray(d)) FALLBACK_CATALOG = d;
    }
  }catch(e){ /* مفيش نت ومش في الكاش — هنكمل بقائمة فاضية */ }
  return FALLBACK_CATALOG;
}

async function loadCatalog(){
  state.catalogLoading = true;
  state.catalogError = false;
  state.catalogStale = false;
  state.catalogAgeMin = 0;
  render();

  try{
    // ⚠️ من غير حد زمني، لو النت ضعيف أو الإشارة واقعة، الـ fetch ممكن يفضل
    // معلّق لوقت طويل من غير ما ينجح أو يفشل — وده اللي بيبان للموزع وكأن
    // التطبيق "واقف مش راضي يفتح". بنحط حد أقصى ١٥ ثانية.
    const controller = new AbortController();
    const timeoutId = setTimeout(()=>controller.abort(), 15000);
    const res = await fetch(APPS_SCRIPT_URL + '?action=catalog', {signal: controller.signal});
    clearTimeout(timeoutId);
    const data = await res.json();
    if(data && Array.isArray(data.items) && data.items.length){
      CATALOG = normalizeCatalogItems_(data.items);
      DISCOUNTS = data.discounts || {};
      saveCatalogCache_(data.items, DISCOUNTS);
    } else {
      throw new Error('empty catalog');
    }
  }catch(e){
    // ٢) آخر نسخة ناجحة من الجهاز — فيها أسعار وأرصدة حقيقية
    const cached = readCatalogCache_();
    if(cached){
      CATALOG = normalizeCatalogItems_(cached.items);
      DISCOUNTS = cached.discounts || {};
      state.catalogStale = true;
      state.catalogAgeMin = Math.max(1, Math.round((Date.now() - (cached.ts||0)) / 60000));
    } else {
      // ٣) الملف الثابت — أسامي بس، مفيش أسعار ولا أرصدة
      const fb = await loadFallbackFile_();
      CATALOG = fb.map(d=>Object.assign({price:null, available:true, inStock:true}, d));
      DISCOUNTS = {};
      state.catalogError = true;
    }
  }
  rebuildCatalogIndex_();   // ⚡ لازم بعد أي تعيين لـ CATALOG
  MAIN_GROUPS = [...new Set(CATALOG.map(d=>d.main))];
  SECTOR_CHIPS = [...MAIN_GROUPS, OTHER_SECTOR];
  state.catalogLoading = false;
  render();
}

// ===== pricing =====
// ⚠️ جوجل شيتس بيخزّن رقم الهاتف كـ "رقم" مش نص (وبيشيل الصفر اللي في الأول).
// فالقيم الراجعة من الشيت ممكن تبقى أرقام، و .trim() بيموت عليها.
// الدالة دي بتضمن إن أي قيمة نستخدمها كنص تبقى نص فعلاً.
function asText(v){
  return (v === null || v === undefined) ? '' : String(v);
}

// رقم الطلب المعروض للمستخدم: رقم تسلسلي لكل مخزن (1، 2، 3...) لو متوفر
// من السيرفر، وإلا (طلبات قديمة اتسجلت قبل الميزة دي) بنرجع لمعرّف الطلب
// القديم كـ fallback بس عشان الطلبات القديمة تفضل متعرّفة.
function orderNoDisplay_(order){
  if(!order) return '';
  return asText(order.orderNo).trim() || asText(order.id).toUpperCase();
}

function normalizeProductName(s){
  return String(s||'').trim().replace(/\s+/g,' ');
}
function findCatalogItem(main, product, color){
  // ⚡ بحث O(1) عن طريق الفهرس بدل المسح الخطي على 1000+ صنف في كل استدعاء
  const np = normalizeProductName(product), nc = normalizeProductName(color);
  let item = CATALOG_INDEX.get(main + '|' + np + '|' + nc);
  if(!item && nc===''){
    // الصنف متوقع من غير لون، لكن ممكن خلية "اللون" في الشيت فيها نص غلط
    // (زي اسم مجموعة فرعية) بدل ما تكون فاضية — لو في صنف واحد بس بنفس
    // الاسم والقطاع، نرجّعه بدل ما نسيب السعر مفقود
    const candidates = CATALOG_BY_MAIN_PRODUCT.get(main + '|' + np);
    if(candidates && candidates.length===1) item = candidates[0];
  }
  return item;
}
function findCatalogItemAnyMain(product, color){
  // ⚡ بحث O(1) عن طريق الفهرس
  const np = normalizeProductName(product), nc = normalizeProductName(color);
  const byProduct = CATALOG_BY_PRODUCT.get(np);
  let item = byProduct && byProduct.find(d=>normalizeProductName(d.color)===nc);
  if(!item && nc==='' && byProduct && byProduct.length===1) item = byProduct[0];
  return item;
}
function getDiscount(main){
  const v = DISCOUNTS[main];
  if(typeof v!=='number' || isNaN(v)) return 0;
  // ⚠️ السيرفر بيحوّل الكسر العشري لنسبة مئوية (×100)، وده بيولّد صور مشوّهة
  // زي 7.000000000000001% بسبب دقة الأرقام العشرية في الكمبيوتر. بنقرّبها
  // هنا لأقرب رقمين عشريين عشان تتعرض نضيفة (7%) في كل حتة بتستخدمها.
  return Math.round(v * 100) / 100;
}
// الخصم يتفصل ويتحسب بس للموزع (النوع من شيت المستخدمين)؛ العميل يشوف السعر
// من غير أي خصم خالص.
function isDiscountEligible(){
  return !!(state.currentUser && state.currentUser.distType === 'موزع');
}
// نفس محتوى بلوك "الأصناف المطلوبة" — استخرجناها لدالة مستقلة عشان نقدر
// نستخدمها في مكانين: الكارت جوه فورم الطلب، وشاشة مراجعة السلة الجديدة
// (اللي بتفتح لما تدوس على أيقونة السلة فوق).
function renderCartItemsHtml(cart){
  if(!cart.length) return '<div class="cartempty">لسه معملتش إضافة لأي صنف</div>';
  const cartGroups = new Map();
  cart.forEach((it,idx)=>{
    if(!cartGroups.has(it.main)) cartGroups.set(it.main, []);
    cartGroups.get(it.main).push({...it, _idx: idx});
  });
  const orderedMains = orderGroups_(cartGroups);
  const pricing = computeCartPricing(cart);
  const hasMissingPrice = cart.some(it=>it.lineTotal==null);

  return `
    ${orderedMains.map(main=>`
      <div class="cartgroup">
        <div class="cartgrouptitle">${esc(main)}</div>
        ${cartGroups.get(main).map(it=>`
          <div class="cartrow">
            <div class="info">
              <div class="pname">${esc(it.product)}</div>
              <div class="pmeta">${it.color ? esc(it.color) : ''}${it.note ? (it.color?' · ':'') + esc(it.note) : ''}${it.autoBundled ? ' <span class="autotag">🔗 مضاف تلقائيًا مع الباب</span>' : ''}</div>
            </div>
            <div class="qty">×${it.qty} ${esc(it.unitType||'')}<br><span class="linetotal">${it.lineTotal==null?'بدون سعر':Math.round(it.lineTotal).toLocaleString('en-US')+' ج.م'}</span></div>
            ${it.autoBundled ? '' : `<button class="del edit" data-act="edit-cart-item" data-main="${esc(it.main)}" data-product="${esc(it.product)}">✏️</button>`}
            <button class="del" data-act="del-cart" data-idx="${it._idx}">✕</button>
          </div>
        `).join('')}
      </div>
    `).join('')}
    ${renderPriceTable(cart)}
    ${(()=>{
      // ⚠️ البق الحقيقي: الملخص ده (الإجمالي قبل/بعد الخصم) كان بيتحكم فيه
      // بس بشرط "فيه خصم أصلاً" (discountAmount>0) — من غير ما يتأكد إن
      // زرار "إظهار الخصم" مفعّل. فحتى لو الزرار بيقول "مخفي"، الملخص كان
      // بيوري تفاصيل الخصم بره الجدول نفسه. دلوقتي بيتأكد من الزرار كمان.
      const showDiscountBreakdown = isDiscountEligible() && pricing.discountAmount>0 && (state.discountVisible || pricing.customPct>0);
      return showDiscountBreakdown;
    })() ? `
      <div class="carttotal">
        <span>الإجمالي قبل الخصم</span>
        <b>${Math.round(pricing.subtotal).toLocaleString('en-US')} ج.م</b>
      </div>
      ${pricing.discountAmount>0?`<div class="carttotal" style="color:var(--gold);">
        <span>${pricing.customPct>0 ? 'خصم مخصص ('+pricing.customPct+'%)' : 'خصم القطاع'}</span>
        <b>- ${Math.round(pricing.discountAmount).toLocaleString('en-US')} ج.م</b>
      </div>`:''}
      <div class="carttotal">
        <span>الإجمالي بعد الخصم</span>
        <b>${Math.round(pricing.total).toLocaleString('en-US')} ج.م</b>
      </div>
      ` : `
      <div class="carttotal">
        <span>الإجمالي</span>
        <b>${Math.round(state.discountVisible ? pricing.total : pricing.subtotal).toLocaleString('en-US')} ج.م</b>
      </div>
      `
    }
    ${hasMissingPrice ? '<div class="pricenote">⚠️ في أصناف بدون سعر مش داخلة في الإجمالي</div>' : ''}
  `;
}

function computeCartPricing(cartItems){
  const subtotal = cartItems.reduce((s,it)=> s + (it.lineTotal||0), 0);
  const customPct = (isDiscountEligible() && state.extraDiscount>0) ? state.extraDiscount : 0;
  let discountAmount = 0;
  if(isDiscountEligible()){
    cartItems.forEach(it=>{
      if(it.lineTotal==null) return;
      // لو في خصم مخصص → يحل محل خصم القطاع الأصلي
      const pct = customPct>0 ? customPct : getDiscount(it.main);
      if(pct>0) discountAmount += it.lineTotal * (pct/100);
    });
  }
  return { subtotal, discountAmount, customPct, total: subtotal - discountAmount };
}
// جدول عرض سعر رسمي: م / بيان / الكمية / السعر (+ نسبة الخصم / خصم مبلغ / الصافي للموزع بس).
// العميل يشوف نفس الجدول من غير أعمدة الخصم خالص.
function renderPriceTable(cartItems){
  if(!cartItems.length) return '';
  // الخصم مابيتعرضش غير لو الحساب موزع أصلاً (isDiscountEligible)، وحتى
  // ساعتها بس لو دوس على أيقونة "إظهار الخصم" — عشان يقدر يوري الشاشة
  // لعميل من غير ما نسبة الخصم تبان له بالغلط.
  const eligible = isDiscountEligible() && state.discountVisible;
  const head = eligible
    ? `<tr><th>م</th><th>بيان</th><th>الكمية</th><th>السعر</th><th>نسبة الخصم</th><th>خصم مبلغ</th><th>الصافي</th></tr>`
    : `<tr><th>م</th><th>بيان</th><th>الكمية</th><th>السعر</th></tr>`;
  const rows = cartItems.map((it,idx)=>{
    const desc = esc(it.product) + (it.color ? ' - ' + esc(it.color) : '');
    const qtyTxt = esc(String(it.qty)) + ' ' + esc(it.unitType||'');
    const priceTxt = it.lineTotal==null ? 'بدون سعر' : Math.round(it.lineTotal).toLocaleString('en-US');
    if(!eligible){
      return `<tr><td>${idx+1}</td><td>${desc}</td><td>${qtyTxt}</td><td>${priceTxt}</td></tr>`;
    }
    const pct = (state.extraDiscount>0) ? state.extraDiscount : getDiscount(it.main);
    const discAmt = (it.lineTotal!=null && pct>0) ? it.lineTotal*(pct/100) : 0;
    const net = it.lineTotal==null ? null : it.lineTotal - discAmt;
    return `<tr>
      <td>${idx+1}</td><td>${desc}</td><td>${qtyTxt}</td><td>${priceTxt}</td>
      <td>${pct>0 ? pct+'%' : '—'}</td>
      <td>${discAmt>0 ? Math.round(discAmt).toLocaleString('en-US') : '—'}</td>
      <td>${net==null ? '—' : Math.round(net).toLocaleString('en-US')}</td>
    </tr>`;
  }).join('');
  return `<div class="pricetablewrap"><table class="pricetable"><thead>${head}</thead><tbody>${rows}</tbody></table></div>`;
}
function calcUnitPrice(main, product, color, unitType){
  const item = findCatalogItem(main, product, color);
  if(!item || item.price==null) return null;
  const bigUnits = ['لفة','كرتونة'];
  const multiplier = bigUnits.includes(unitType) ? (item.unit || 1) : 1;
  // السعر المعروض في الشاشة دايمًا قبل الخصم — الخصم بيتحسب ويتفصل بس في عرض السعر النهائي
  return item.price * multiplier;
}
function fmtPrice(n){
  if(n==null) return 'السعر غير متاح';
  return Math.round(n).toLocaleString('en-US') + ' ج.م';
}
function renderOrderTotalLine(o){

}

// ===== Web Push Notification =====
const LS_PUSH_SUB = 'elkPushSub';

function urlBase64ToUint8Array(b64){
  const padding = '='.repeat((4 - b64.length%4)%4);
  const base64 = (b64+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw = atob(base64);
  return Uint8Array.from([...raw].map(c=>c.charCodeAt(0)));
}

// ═══════════════════════════════════════════════════════════════════
//  إشعارات المتصفح (Web Push) — متوقفة
// ═══════════════════════════════════════════════════════════════════
//
// ⚠️ الميزة دي **عمرها ما اشتغلت ولا مرة**. السيرفر كان بيبعت الإشعار خام
// من غير الحاجتين الإجباريتين في بروتوكول Web Push: هيدر VAPID موقّع
// (RFC 8292) وتشفير الـ payload بـ aes128gcm (RFC 8291). خدمة الـ push كانت
// بترد 401/400 دايمًا. و Apps Script مافيهوش ECDSA ولا AES-GCM ولا ECDH،
// فتنفيذ البروتوكول صح من هناك مش ممكن أصلاً.
//
// فبطّلنا نطلب إذن الإشعارات من المستخدم — مش من المنطقي نطلب إذن لحاجة
// مش هتشتغل. التبليغ كله بقى على واتساب (اللي شغال فعلاً).
//
// عايز الإشعارات تشتغل بجد؟ لازم خدمة وسيطة (Firebase Cloud Messaging HTTP v1
// أو OneSignal) — بتتنادى بـ UrlFetchApp عادي من Apps Script. ساعتها رجّع
// registerPush() تحت وشيل الـ return.
const PUSH_ENABLED = false;

async function registerPush(){
  if(!PUSH_ENABLED) return null;
  try{
    if(!('serviceWorker' in navigator)||!('PushManager' in window)) return null;
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      const perm = await Notification.requestPermission();
      if(perm!=='granted') return null;
      sub = await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    localStorage.setItem(LS_PUSH_SUB, JSON.stringify(sub.toJSON()));
    await sendPushSubToServer(sub.toJSON());
    return sub;
  }catch(e){ console.warn('registerPush:',e); return null; }
}

async function sendPushSubToServer(subJson){
  try{
    if(!getUserToken()) return;
    // السيرفر بياخد اسم المستخدم من التوكن نفسه — قبل كده كان بياخده من
    // البيانات المبعوتة، يعني أي حد كان يقدر يمسح اشتراك أي مستخدم تاني.
    await apiPost({ action:'savePushSub', token:getUserToken(), sub: subJson });
  }catch(e){ console.warn('sendPushSubToServer:',e); }
}

async function ensurePushRegistered(){
  if(!PUSH_ENABLED) return;
  if(!state.currentUser || state.currentUser.username==='admin') return;
  if(!('Notification' in window)) return;
  if(Notification.permission==='granted') await registerPush();
}

// صوت تنبيه بسيط (beep) من غير أي ملف صوت خارجي
function playNotifyBeep_(){
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = 'sine'; o.frequency.value = 880;
    o.connect(g); g.connect(ctx.destination);
    g.gain.setValueAtTime(0.001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.25, ctx.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
    o.start(); o.stop(ctx.currentTime + 0.36);
    setTimeout(()=>{ try{ ctx.close(); }catch(e){} }, 600);
  }catch(e){}
}

// بيتنادى لما نكتشف طلب/طلبات جديدة

    if('Notification' in window && Notification.permission === 'granted'){

// نداء خفيف كل فترة يجيب العدد بس (مش كل الطلبات)
async function adminPollNewOrders_(){
  if(!state.adminUnlocked || !getAdminToken()) return;
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?action=ordersMeta&token=' + encodeURIComponent(getAdminToken()));
    const raw = await res.text();
    let d = null;
    try{ d = JSON.parse(raw); }catch(e){ d = null; }
    // تشخيص: بنسجّل نتيجة آخر فحص عشان تبان في شريط الأدمن لو حصلت مشكلة
    if(Array.isArray(d)){
      state.pollDiag = '⚠️ نسخة السيرفر قديمة — اعمل New version للـ Apps Script';
    }else if(d && typeof d.count === 'number'){
      state.pollDiag = 'آخر فحص: ' + d.count + ' طلب · ' + new Date().toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }else if(d && d.error){
      state.pollDiag = '⚠️ ' + (d.error==='unauthorized' ? 'الجلسة انتهت — ادخل الرقم تاني' : d.error);
    }else{
      state.pollDiag = '⚠️ رد غير متوقع من السيرفر';
    }
    if(!d || typeof d.count !== 'number'){ render(); return; }
    const seen = adminSeenCount_();
    // أول مرة بعد الدخول: نثبّت العدد الحالي كخط أساس، من غير إشعار
    if(seen === null){ setAdminSeenCount_(d.count); state.adminMetaCount = d.count; render(); return; }
    if(d.count > seen){
      const delta = d.count - seen;
      // لو الأدمن واقف على شاشة المتابعة أصلاً، بنحدّث القايمة ونصفّر العداد
      if(state.view === 'admin'){
        setAdminSeenCount_(d.count);
        state.adminNewCount = 0;
        loadOrders();
      }else{
        state.adminNewCount = d.count - (adminSeenCount_() || 0);
        onNewOrders_(delta, d.last);
        render();
      }
    }
    state.adminMetaCount = d.count;
    render();
  }catch(e){
    state.pollDiag = '⚠️ تعذّر الاتصال بالسيرفر';
    render();
  }
}

// ===== safety net: never let a promise hang the UI forever =====
// لو أي عملية (نت بطيء، سيرفر واقف، مكتبة PDF اتعلقت...) ماخلصتش خلال المهلة دي،
// نرفض الـ Promise يدويًا عشان الزرار يرجع لحالته الطبيعية بدل ما يفضل يلف لحد الأبد.
function withTimeout(promise, ms, label){
  let timer;
  const timeout = new Promise((_, reject)=>{
    timer = setTimeout(()=> reject(new Error('timeout:' + (label||''))), ms);
  });
  return Promise.race([promise, timeout]).finally(()=> clearTimeout(timer));
}

// html2canvas بيشتغل على نفس الـ thread بتاع الواجهة، فلو الرسم تقيل الشاشة
// بتتجمّد فعليًا (والـ timeout نفسه مش بيقدر يشتغل لأن الـ thread متشغل).
// عشان كده بنقلل الـ scale على الموبايل وعلى الطلبات الكبيرة — الجودة تفضل
// كويسة والملف يتولد من غير ما التطبيق يهنج.
// بنطلّع نسخة صورة (PNG) من نفس الكانفس اللي بنعمل منه الـ PDF —
// عشان الإرسال على واتساب يبقى صورة تتفتح على طول بدل ملف PDF.
function canvasToPngBlob_(canvas){
  return new Promise(resolve=>{
    try{
      if(canvas.toBlob){
        canvas.toBlob(b=>resolve(b), 'image/png');
      } else {
        // متصفحات قديمة: نحوّل الـ dataURL بإيدنا
        const parts = canvas.toDataURL('image/png').split(',');
        const bin = atob(parts[1]);
        const arr = new Uint8Array(bin.length);
        for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
        resolve(new Blob([arr], {type:'image/png'}));
      }
    }catch(e){ resolve(null); }
  });
}

function pdfScale_(itemCount){
  const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent || '');
  const n = Number(itemCount) || 0;

  return n > 40 ? 1.5 : 2;
}

// ===== storage (Google Sheet via Apps Script) =====
// بيتأكد إن الطلب موجود فعلاً في الشيت (بنستخدمها بعد الـ timeout).
// مهم: الـ timeout مش معناه إن الحفظ فشل — ساعات السيرفر بيسجّل الطلب بس بياخد
// وقت طويل في الرد، والتطبيق يقطع الاتصال. لو قلنا للموزع "فشل" وهو اتسجل،
// هيبعته تاني ويتكرر الطلب مرتين.
async function orderExistsRemote(id){
  try{
    const d = await apiGet('lookup', { ids: id, token: getUserToken() });
    return Array.isArray(d) && d.some(o => String(o.id) === String(id));
  }catch(e){ return false; }
}

async function saveOrderRemote(order, isUpdate){
  const payload = Object.assign({}, order, { action: isUpdate ? 'update' : 'create', token: getUserToken() });
  const controller = new AbortController();
  // Apps Script بياخد وقت خصوصًا في أول نداء أو لما الطلب فيه أصناف كتير.
  // 25 ثانية كانت قصيرة وبتقطع على طلبات شغالة — رفعناها لـ 60.
  const killer = setTimeout(()=>controller.abort(), 60000);
  let res;
  try{
    res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload),
      signal: controller.signal
    });
  }catch(e){
    clearTimeout(killer);
    if(e && e.name==='AbortError'){
      // اتأخر في الرد — بس يمكن يكون اتسجل فعلاً. نتأكد بنفسنا قبل ما نقول "فشل".
      await new Promise(r=>setTimeout(r, 2500));
      if(await orderExistsRemote(order.id)) return { ok:true, recovered:true };
      throw new Error('السيرفر أخد وقت طويل ومردش. الطلب غالبًا ما اتسجلش — جرّب تاني.');
    }
    throw e;
  }finally{
    clearTimeout(killer);
  }
  if(!res.ok) throw new Error('server responded with status ' + res.status);
  let data;
  try{ data = await res.json(); }catch(e){ throw new Error('invalid server response'); }
  if(!data || data.ok !== true) throw new Error(data && data.error ? data.error : 'server did not confirm save');
  return data;
}

async function loadOrders(){
  state.ordersLoading = true; render();
  try{
    const res = await fetch(APPS_SCRIPT_URL + '?token=' + encodeURIComponent(getAdminToken()));
    const data = await res.json();
    if(Array.isArray(data)){
      // توحيد الحالات القديمة ('تحت التنفيذ') على النظام الجديد قبل أي فلترة
      data.forEach(function(o){ o.status = normStatus_(o.status); });
      // 🛡️ شبكة أمان: لو الشيت فيه صفوف مكررة بنفس الـ id (من قبل إصلاح
      // السيرفر)، مانعرضهاش مرتين. بنسيب أول ظهور لكل id.
      const seenIds = {};
      state.orders = data.filter(function(o){
        if(!o || o.id == null) return true;
        if(seenIds[o.id]) return false;
        seenIds[o.id] = true; return true;
      });
      state.adminMetaCount = state.orders.length;
      // لو الأدمن شايف القايمة دلوقتي، اعتبر كل ده "متشاف" وصفّر العداد
      if(state.view === 'admin'){ setAdminSeenCount_(state.orders.length); state.adminNewCount = 0; }
    } else if(data && data.error === 'unauthorized'){
      // التوكن خلص أو مش صالح — نرجّع الأدمن لشاشة الرقم
      setAdminToken('');
      state.adminUnlocked = false;
      stopAdminPoll_();
      showToast('انتهت جلسة الأدمن، ادخل الرقم تاني');
    } else {
      showToast('السيرفر مردش صح — الطلبات المعروضة ممكن تكون قديمة');
    }
  }catch(e){
    // ⚠️ قبل كده كنا بنعمل state.orders = [] هنا — فأي انقطاع بسيط في النت (أو
    // إعادة تحميل بعد تحديث) كان بيمسح الطلبات من الشاشة وتبان كأنها "اختفت".
    // دلوقتي بنسيب آخر قايمة ظاهرة زي ما هي وبنقول إن التحديث فشل.
    showToast('تعذّر تحديث الطلبات — النت. الطلبات الظاهرة زي ما هي');
  }
  state.ordersLoading = false;
  render();
}

// ═══════════════════════════════════════════════════════════════════
//  طبقة الاتصال بالسيرفر
// ═══════════════════════════════════════════════════════════════════
//
// ⚠️ قاعدة مهمة: كل عملية **بتقرا** بتروح GET، وكل عملية **بتغيّر أو بتمسح**
// بتروح POST. قبل كده الحذف وتغيير الحالة كانوا مجرد روابط GET — يعني مجرد
// فتح الرابط (أو أي أداة بتعمل prefetch للروابط) كان بيمسح طلب.
//
// ⚠️ الـ Content-Type لازم يفضل text/plain: ده بيخلي المتصفح يعتبر الطلب
// "بسيط" فمابيبعتش نداء OPTIONS قبله. Apps Script مابيردش على OPTIONS خالص،
// فأي حاجة غير كده بتفشل بخطأ CORS مبهم.

function apiUrl_(action, params){
  let url = APPS_SCRIPT_URL + '?action=' + encodeURIComponent(action);
  Object.keys(params || {}).forEach(k=>{
    const v = params[k];
    if(v !== undefined && v !== null && v !== '') url += '&' + k + '=' + encodeURIComponent(v);
  });
  return url;
}

async function apiGet(action, params, opts){
  const res = await fetch(apiUrl_(action, params), opts || {});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

async function apiPost(payload, opts){
  const res = await fetch(APPS_SCRIPT_URL, Object.assign({
    method:'POST',
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(payload)
  }, opts || {}));
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}

function loadUserSession(){
  // بنستخدم sessionStorage (مش localStorage) عشان الجلسة تتمسح لما التطبيق يتقفل

  // وجود تحديث للتطبيق (Service Worker) في كل مرة بدل ما نفضل شغالين بنسخة قديمة.
  try{
    const raw = sessionStorage.getItem(LS_USER_KEY);
    if(raw){
      const u = JSON.parse(raw);
      if(u && u.username){ state.currentUser = u; return; }
    }
  }catch(e){}
  // مفيش جلسة شغالة — لو الجهاز ده فيه بصمة متفعلة قبل كده، نعرض شاشة "افتح بالبصمة"
  // بدل فورم اليوزر/الباسورد مباشرة.
  try{
    if(localStorage.getItem(LS_BIOMETRIC_CREDID_KEY) && localStorage.getItem(LS_BIOMETRIC_VAULT_KEY)){
      state.showBiometricGate = true;
    }
  }catch(e){}
}

// ===== الدخول بالبصمة (WebAuthn - platform authenticator) =====
// ملحوظة مهمة: ده "قفل جهاز" محلي مش تسجيل دخول جديد للسيرفر. تسجيل الدخول
// الحقيقي (يوزر/باسورد) بيحصل مرة واحدة، وبعدين البصمة بتفتح نفس الجلسة
// المحفوظة على الجهاز ده بس — زي ما شغالة تطبيقات البنوك بالظبط.
function isWebAuthnSupported(){
  return !!(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
}
async function isPlatformAuthenticatorAvailable(){
  try{
    if(!isWebAuthnSupported()) return false;
    return await window.PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
  }catch(e){ return false; }
}
function isBiometricEnabledForThisDevice(){
  try{
    return !!(localStorage.getItem(LS_BIOMETRIC_CREDID_KEY) && localStorage.getItem(LS_BIOMETRIC_VAULT_KEY));
  }catch(e){ return false; }
}
function isBiometricEnabledForCurrentUser(){
  try{
    if(!state.currentUser) return false;
    if(!isBiometricEnabledForThisDevice()) return false;
    const v = JSON.parse(localStorage.getItem(LS_BIOMETRIC_VAULT_KEY) || 'null');
    return !!(v && v.username === state.currentUser.username);
  }catch(e){ return false; }
}
function b64FromBuf_(buf){
  let s=''; const bytes = new Uint8Array(buf);
  for(let i=0;i<bytes.length;i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function bufFromB64_(b64){
  const s = atob(b64);
  const bytes = new Uint8Array(s.length);
  for(let i=0;i<s.length;i++) bytes[i] = s.charCodeAt(i);
  return bytes.buffer;
}
async function enableBiometricLogin(){
  if(!state.currentUser){ return; }
  const available = await isPlatformAuthenticatorAvailable();
  if(!available){ showToast('البصمة/التعرف على الوجه مش متاحة على الجهاز ده'); return; }
  try{
    state.biometricBusy = true; render();
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    const userId = crypto.getRandomValues(new Uint8Array(16));
    const cred = await navigator.credentials.create({
      publicKey: {
        challenge,
        rp: { name:'القرشي لأبواب وشبابيك الـ UPVC' },
        user: { id:userId, name:state.currentUser.username, displayName:state.currentUser.distName || state.currentUser.username },
        pubKeyCredParams: [{ type:'public-key', alg:-7 }, { type:'public-key', alg:-257 }],
        authenticatorSelection: { authenticatorAttachment:'platform', userVerification:'required' },
        timeout: 60000
      }
    });
    localStorage.setItem(LS_BIOMETRIC_CREDID_KEY, b64FromBuf_(cred.rawId));
    // 🔑 نضمن إن أحدث توكن جلسة متخزّن جوه الخزنة — من غيره الدخول بالبصمة
    // بيرجّع توكن فاضي و"تابع طلبيتك" بتفشل بـ unauthorized.
    const vaultUser = Object.assign({}, state.currentUser, { token: state.currentUser.token || getUserToken() });
    localStorage.setItem(LS_BIOMETRIC_VAULT_KEY, JSON.stringify(vaultUser));
    showToast('اتفعّل الدخول بالبصمة على الجهاز ده ✅');
  }catch(e){
    showToast('اتلغى تفعيل البصمة');
  }
  state.biometricBusy = false; render();
}
function disableBiometricLogin(){
  try{
    localStorage.removeItem(LS_BIOMETRIC_CREDID_KEY);
    localStorage.removeItem(LS_BIOMETRIC_VAULT_KEY);
  }catch(e){}
  showToast('اتلغت البصمة من الجهاز ده');
  render();
}
async function unlockWithBiometric(){
  const credId = localStorage.getItem(LS_BIOMETRIC_CREDID_KEY);
  const vaultRaw = localStorage.getItem(LS_BIOMETRIC_VAULT_KEY);
  if(!credId || !vaultRaw){ state.showBiometricGate=false; render(); return; }
  state.biometricBusy = true; render();
  try{
    const challenge = crypto.getRandomValues(new Uint8Array(32));
    await navigator.credentials.get({
      publicKey: {
        challenge,
        allowCredentials: [{ id: bufFromB64_(credId), type:'public-key' }],
        userVerification: 'required',
        timeout: 60000
      }
    });
    const u = JSON.parse(vaultRaw);
    if(u && u.username){
      state.currentUser = u;
      // التوكن متخزّن جوه الخزنة مع باقي بيانات الحساب — لازم يرجع للجلسة
      // كمان، وإلا "طلباتي" هترجع فاضية (السيرفر بقى بيطلب توكن).
      setUserToken(u.token || '');
      try{ sessionStorage.setItem(LS_USER_KEY, JSON.stringify(u)); }catch(e){}
      state.showBiometricGate = false;
      checkForResumableDraft(); // 🛒 لو في مسودة محفوظة، نعرض إشعار بعد فتح البصمة
      ensurePushRegistered();
    }
  }catch(e){
    showToast('تعذّر التحقق بالبصمة، جرّب تاني أو ادخل بكلمة المرور');
  }
  state.biometricBusy = false; render();
}

async function submitLogin(){
  const username = state.authUsername.trim();
  const password = state.authPassword;
  if(!username){ state.authError='من فضلك اكتب اسم المستخدم'; render(); return; }
  if(!password){ state.authError='من فضلك اكتب كلمة المرور'; render(); return; }
  state.authLoading = true; state.authError=''; render();
  try{
    // 🔒 POST مش GET: الباسورد في رابط GET بيتكتب في سجلات السيرفر وفي
    // تاريخ المتصفح وفي أي بروكسي في النص.
    const data = await apiPost({ action:'login', username, password });
    state.authLoading = false;
    if(!data.ok){
      // ⚠️ مهم: نفرّق بين "الباسورد غلط" و"السيرفر مش فاهم الطلب".
      // السيرفر بيرجّع reason معروفة في حالة الرفض الحقيقي بس. لو رجّع error
      // خام (أو مرجّعش reason خالص)، يبقى المشكلة في السيرفر مش في الباسورد —
      // وأشهر سبب: الكود الجديد اتلصق في محرر Apps Script بس **مااتعملهوش
      // Deploy**، فالـ/exec لسه بيشغّل الكود القديم اللي مش عارف login كـ POST.
      // قبل كده كنا بنقول "الباسورد غلط" في الحالتين، والمستخدم يفضل يجرب
      // باسوردات صح ويستغرب ليه مش بيدخل.
      const known = (data.reason === 'pending' || data.reason === 'locked' || data.reason === 'invalid');
      if(data.reason==='pending')      state.authError = 'حسابك لسه قيد المراجعة، استنى موافقة الأدمن';
      else if(data.reason==='locked')  state.authError = 'اتقفل الحساب مؤقتًا بعد محاولات كتير غلط — استنى ١٥ دقيقة وحاول تاني';
      else if(known)                   state.authError = 'اسم المستخدم أو كلمة المرور غلط';
      else                             state.authError = '⚠️ السيرفر مش رد صح — الباسورد بتاعك غالبًا سليم.\nالسبب المتوقع: نسخة السيرفر قديمة ومحتاجة Deploy جديد.';
      render();
      return;
    }
    setUserToken(data.token || '');
    state.currentUser = { username: data.username || username, distName: data.distName||'', distRegion: data.distRegion||'', distPhone: data.distPhone||'', distType: data.distType||'موزع', token: data.token||'' };
    try{ sessionStorage.setItem(LS_USER_KEY, JSON.stringify(state.currentUser)); }catch(e){}
    // ⚠️ إصلاح جذري لمشكلة "اسم الموزّع غلط في الطلبات": لو الموزّع كتب اسم
    // غلط/مختصر مرة واحدة قبل كده، كان بيتحفظ محليًا على جهازه (localStorage)
    // للأبد، وبما إن الشرط القديم كان "لو فيه اسم موجود، سيبه"، الاسم الصحيح
    // المسجّل في حسابه (اللي إنت بتصححه في شيت المستخدمين) كان مايكسبش أبدًا
    // — فالاسم الغلط كان بيتكرر تلقائيًا في كل طلب جديد للأبد. دلوقتي اسم
    // الحساب (من السيرفر) بيفوز دايمًا وقت الدخول، ونحدّث النسخة المحفوظة
    // محليًا بيه كمان عشان الغلط ده يتصحح تلقائيًا ومايرجعش تاني.
    if(asText(data.distName)) state.distName = asText(data.distName);
    else if(!state.distName) state.distName = '';
    if(asText(data.distRegion)) state.distRegion = asText(data.distRegion);
    if(asText(data.distPhone)) state.distPhone = asText(data.distPhone);
    saveProfile();
    state.authPassword='';
    checkForResumableDraft(); // 🛒 لو في مسودة محفوظة، نعرض إشعار بعد الدخول مباشرة
    ensurePushRegistered();
    render();
  }catch(e){
    state.authLoading = false;
    state.authError = 'في مشكلة في الاتصال، حاول تاني';
    render();
  }
}

async function submitRegister(){
  const username = state.authUsername.trim();
  const password = state.authPassword;
  const distName = state.regDistName.trim();
  const distRegion = state.regDistRegion.trim();
  const distPhone = state.regDistPhone.trim();
  if(!username){ state.authError='من فضلك اكتب اسم المستخدم'; render(); return; }
  if(!password || password.length<4){ state.authError='كلمة المرور لازم تكون 4 حروف/أرقام على الأقل'; render(); return; }
  if(password !== state.authPassword2){ state.authError='تأكيد كلمة المرور مش مطابق'; render(); return; }
  if(!distName){ state.authError='من فضلك اكتب اسم الموزع / الفرع'; render(); return; }
  if(!distPhone){ state.authError='من فضلك اكتب رقم الهاتف'; render(); return; }
  state.authLoading = true; state.authError=''; render();
  try{
    const data = await apiPost({ action:'register', username, password, distName, distRegion, distPhone, distType: state.regDistType });
    state.authLoading = false;
    if(!data.ok){
      state.authError = data.reason==='exists' ? 'اسم المستخدم ده متسجل قبل كده' : 'حصلت مشكلة، حاول تاني';
      render();
      return;
    }
    const msg = 'طلب تفعيل حساب جديد\nاسم المستخدم: ' + username + '\nاسم الموزع: ' + distName + '\nالمنطقة: ' + distRegion + '\nالهاتف: ' + distPhone;
    showToast('اتسجل الطلب، هتفتح واتساب دلوقتي لإرسال طلب التفعيل للأدمن');
    setTimeout(()=>{ window.open('https://wa.me/' + ADMIN_WHATSAPP + '?text=' + encodeURIComponent(msg), '_blank'); }, 600);
    state.authView='login';
    state.authPassword=''; state.authPassword2='';
    render();
  }catch(e){
    state.authLoading = false;
    state.authError = 'في مشكلة في الاتصال، حاول تاني';
    render();
  }
}

async function submitForgot(){
  const username = asText(state.forgotUsername).trim();
  const p1 = asText(state.forgotNewPassword);
  const p2 = asText(state.forgotNewPassword2);
  if(!username){ state.authError='من فضلك اكتب اسم المستخدم'; render(); return; }
  if(!p1){ state.authError='من فضلك اكتب الباسورد الجديد اللي عايزه'; render(); return; }
  if(p1.length < 4){ state.authError='الباسورد لازم يكون 4 حروف/أرقام على الأقل'; render(); return; }
  if(p1 !== p2){ state.authError='الباسوردين مش متطابقين'; render(); return; }

  state.forgotSubmitting = true; state.authError=''; render();
  try{
    const d = await apiPost({ action:'requestPasswordReset', username, newPassword: p1 });
    if(d && d.ok){
      state.forgotSent = true;
    } else {

// ===== staging logic (multi product / multi color) =====
function stagedKey(main, product){ return main + '||' + product; }

function toggleStagedProduct(main, product){
  const key = stagedKey(main, product);
  const idx = state.staged.findIndex(s=>s.key===key);
  if(idx>=0){
    const s = state.staged[idx];
    if(s.extractedCartItems && s.extractedCartItems.length){
      state.cart.push(...s.extractedCartItems);
    }
    state.staged.splice(idx,1);
  }else{
    const colorRequired = hasRealColors(main, product);
    const units = unitOptionsForGroup(main);
    const defaultUnit = units[0];

    // لو الصنف ده موجود بالفعل في السلة، نسحبه للتعديل بدل ما نضيف نسخة جديدة
    const existing = [];
    state.cart = state.cart.filter(it=>{
      if(it.main===main && it.product===product && !it.autoBundled){ existing.push(it); return false; }
      return true;
    });

    const selectedColors = existing.length ? existing.map(it=>it.color) : (colorRequired ? [] : ['']);
    const qtys = {}, unitsMap = {};
    existing.forEach(it=>{ qtys[it.color] = it.qty; unitsMap[it.color] = it.unitType; });
    if(!colorRequired && existing.length===0){ qtys[''] = 1; unitsMap[''] = defaultUnit; }

    state.staged.push({
      key, main, product, colorRequired,
      availableColors: colorsForProduct(main, product).map(c=>c.color),
      selectedColors,
      qtys,
      units: unitsMap,
      unitOptions: units,
      cancelling:false,
      isEditingExisting: existing.length>0,
      extractedCartItems: existing
    });
  }
  render();
}

function toggleStagedColor(key, color){
  const s = state.staged.find(x=>x.key===key);
  if(!s) return;
  const i = s.selectedColors.indexOf(color);
  if(i>=0){ s.selectedColors.splice(i,1); delete s.qtys[color]; delete s.units[color]; }
  else{
    s.selectedColors.push(color);
    // ⚠️ قبل كده كنا بنحط كمية افتراضية = 1 هنا تلقائيًا أول ما اللون
    // يتضاف، وده كان بيخلي الموزع يضيف اللون التاني للسلة بكمية 1 من غير
    // قصد لو دوس "ضيف للسلة" على طول من غير ما يحدد كمية بنفسه. دلوقتي
    // بنسيبها فاضية (0) لحد ما هو يكتبها بنفسه، وconfirmStaged هيرفض
    // الإضافة لو فيه لون من غير كمية محددة.
    s.units[color] = s.units[color] || s.unitOptions[0];
  }
  render();
}

function setStagedQty(key, color, qty){
  const s = state.staged.find(x=>x.key===key);
  if(!s) return;
  s.qtys[color] = Math.max(1, qty);
  render();
}

function setStagedColorUnit(key, color, unit){
  const s = state.staged.find(x=>x.key===key);
  if(!s) return;
  s.units[color] = unit;
  render();
}

const DOOR_ACCESSORIES = [
  { product:'زاويه كرسي للابواب WPC', perDoor:4 },
  { product:'مفصله ابواب WPC', perDoor:4 },
  { product:'جوان ابواب WPC', perDoor:5.5 },
  { product:'قلب كالون نحاس ابواب WPC', perDoor:1 },
  { product:'كالون سلندر نحاس ابواب WPC', perDoor:1 },
];

// بعد "تمام، ضيفه للسلة"، بلوك "حدد التفاصيل" الطويل بيختفي من الصفحة —
// والصفحة بتقصر بشكل كبير، فمحتوى تحته بيتزحلق لفوق ويحل مكانه قدام عينك
// (حتى لو رقم التمرير نفسه فضل ثابت)، وده اللي كان بيحس إنه "بينزل تحت".
// بنمسك مكان شبكة الأصناف على الشاشة قبل التأكيد ونرجّعها لنفس المكان
// بالظبط بعده، عشان يفضل شايف نفس الأصناف اللي كان بيختار منها.
function confirmStaged(key){
  const s = state.staged.find(x=>x.key===key);
  if(!s) return;
  if(s.colorRequired && s.selectedColors.length===0){ showToast('اختار لون واحد على الأقل'); return; }
  // ⚠️ لازم كل لون متحدد يكون له كمية مكتوبة بالفعل — من غير ما نفترض 1
  // تلقائيًا. لو فيه لون (أول أو تاني) لسه من غير كمية، بنوقف الإضافة كلها
  // ونوريه بالظبط أي لون ناقصه الكمية، بدل ما نضيف بكمية افتراضية غلط.
  const missingQty = s.selectedColors.filter(c => !(s.qtys[c] > 0));
  if(missingQty.length){
    const names = missingQty.map(c=> c || 'بدون لون').join(' و ');
    showToast('حدد كمية ' + (missingQty.length>1 ? 'الألوان: ' : 'اللون: ') + names);
    return;
  }
  // ⚠️ كنا بنمسك مكان الشبكة كلها (.productgrid) قبل كده — بس دلوقتي التفاصيل
  // بتتحط جوه الشبكة نفسها (مش برّاها)، فحافة الشبكة العلوية ممكن ما تتحركش
  // خالص حتى لو المحتوى اللي إنت شايفه اتزحلق. بنمسك الصنف نفسه بدل الشبكة.
  const productSel = `[data-act="toggle-product"][data-val="${CSS.escape(s.product)}"]`;
  const doConfirm = ()=>{
  s.selectedColors.forEach(color=>{
    const unitType = s.units[color] || s.unitOptions[0];
    const qty = s.qtys[color];
    const catItem = findCatalogItem(s.main, s.product, color);
    const unitPrice = calcUnitPrice(s.main, s.product, color, unitType);
    // ⚠️ بنصوّر حالة التوفر في نفس لحظة الإضافة للسلة، ونخزّنها جوه الصنف.
    // قبل كده كنا بنحاول نحسبها تاني وقت بناء رسالة الواتساب باستخدام
    // findCatalogItem — وده بيفشل بسهولة (لون فاضي، اسم صنف اتغيّر، الكتالوج
    // اتحدّث بعد الإضافة...) فكانت اللافتة مش بتظهر خالص. دلوقتي بقت مضمونة.
    state.cart.push({
      main:s.main, product:s.product, name: catItem ? catItem.name : s.product, color: color||'',
      unitType, qty, unitPrice, lineTotal: unitPrice==null ? null : unitPrice*qty,
      unavailable: computeUnavailable_(s.main, s.product, color)
    });

    if(s.main==='ابواب WPC' && unitType==='بإكسسوارات'){
      DOOR_ACCESSORIES.forEach(acc=>{
        const accQty = acc.perDoor * qty;
        const accCatItem = findCatalogItem(s.main, acc.product, '') || findCatalogItemAnyMain(acc.product, '');
        const accMain = accCatItem ? accCatItem.main : s.main;
        const accPrice = accCatItem ? calcUnitPrice(accMain, acc.product, '', 'قطعة') : null;
        state.cart.push({
          main: accMain, product:acc.product, name: accCatItem ? accCatItem.name : acc.product, color:'',
          unitType:'قطعة', qty: accQty, unitPrice: accPrice,
          lineTotal: accPrice==null ? null : accPrice*accQty, autoBundled:true
        });
      });
    }
  });
    state.staged = state.staged.filter(x=>x.key!==key);
    showToast('تمت إضافة الصنف للسلة');
    autoSaveDraft();
    render();
  };
  withPositionAnchor_(productSel, doConfirm);
}

function cancelStaged(key){
  const s = state.staged.find(x=>x.key===key);
  if(!s) return;
  s.cancelling = true;
  render();
  const productSel = `[data-act="toggle-product"][data-val="${CSS.escape(s.product)}"]`;
  setTimeout(()=>{
    withPositionAnchor_(productSel, ()=>{
      if(s.extractedCartItems && s.extractedCartItems.length){
        state.cart.push(...s.extractedCartItems);
      }
      state.staged = state.staged.filter(x=>x.key!==key);
      autoSaveDraft();
      render();
    });
  }, 320);
}

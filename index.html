function renderOrderView(){
  if(state.catalogLoading){
    return `<main><div class="loading">جارٍ تحميل قائمة الأصناف...</div></main>`;
  }
  // تحذير حالة الأصناف — لازم يبقى واضح جدًا، لأن الموزع بيبني عليه قرار
  // إنه يبعت طلب. حالتين مختلفتين تمامًا في الخطورة، فالرسالة بتفرّق بينهم.
  let catalogErrorBanner = '';
  if(state.catalogError){
    catalogErrorBanner = `<div class="editbanner" style="background:#F8D7DA;border:1px solid #C24450;color:#7A1F28;">
      ⛔ <b>مفيش اتصال بالسيرفر — الأسعار والأرصدة مش ظاهرة خالص</b>
      <div style="font-size:12.5px;margin-top:4px;font-weight:400;">الأصناف اللي تحت أساميها بس. <b>ماتعتمدش على "متاح" دلوقتي</b> — ممكن يكون فيه أصناف موقوفة أو خلصت من المخزن.</div>
      <button class="chip" data-act="retry-catalog" style="margin-top:8px;">🔄 حاول تاني</button>
    </div>`;
  } else if(state.catalogStale){
    const age = state.catalogAgeMin >= 60
      ? ('من ' + Math.round(state.catalogAgeMin/60) + ' ساعة')
      : ('من ' + state.catalogAgeMin + ' دقيقة');
    catalogErrorBanner = `<div class="editbanner" style="background:#FBEBD1;">
      ⚠️ <b>مفيش نت — الأسعار والأرصدة دي محفوظة ${esc(age)}</b>
      <div style="font-size:12.5px;margin-top:4px;font-weight:400;">تقدر تكمّل طلبك عادي، بس يفضل تتأكد من المتاح قبل ما تبعت.</div>
      <button class="chip" data-act="retry-catalog" style="margin-top:8px;">🔄 حدّث دلوقتي</button>
    </div>`;
  }
  const saveErrorBanner = state.saveError ? `
    <div class="card" style="border:2px solid var(--danger);">
      <h2 style="color:var(--danger);">⚠️ الحفظ فشل — السبب:</h2>
      <textarea readonly style="width:100%;min-height:120px;font-family:monospace;font-size:12.3px;direction:ltr;text-align:left;padding:8px;">${esc(state.saveError)}</textarea>
      <button class="savebtn" data-act="clear-save-error" style="margin-top:8px;">إخفاء</button>
    </div>` : '';
  if(state.successOrderId){
    return `
    <main>
      <div class="card success">
        <div class="ic">${ico_('checkCircle',36)}</div>
        <h2>${state.successMode==='updated' ? 'تم عمل طلب جديد بالتعديل ✅' : 'تم إرسال الطلب بنجاح'}</h2>
        ${state.successMode==='updated' ? '<p style="color:#6B6B6B;font-size:13px;margin-top:-4px;">الطلب القديم اتعلّم «مُعدّل» عند المخزن، وده رقمه الجديد.</p>' : ''}
        <p>هيتم مراجعة طلبك والتواصل معاك لتأكيد التنفيذ</p>
        <div class="ordid">#${esc(state.successOrderId)}</div>
        <div class="wanote">
          <p class="wanote-t">📲 لو سمحت اضغط <b>«ابعت الطلب واتساب»</b> عشان المخزن يستلم طلبك.</p>
          <button class="wanote-btn ${state.waSent?'sent':''}" data-act="send-order-img" ${state.waImgPreparing?'disabled':''}>
            <span class="ic">📲</span> ${state.waImgPreparing ? 'جارٍ التجهيز...' : (state.waSent ? 'تم — ابعت تاني' : 'ابعت الطلب واتساب')}
          </button>
          ${(state.waSent || state.waImgPreparing) ? '' : '<div class="wanote-arrow">⬆️</div>'}
        </div>
        <!-- ✂️ بناءً على طلب صريح: المستندات بقت "عرض السعر" بس، بأيقوناته
             التلاتة (واتساب صورة / تنزيل PDF / معاينة). باقي المستندات
             (صورة الطلب العامة، أمر صرف المخزن، طلبية النواقص) اتشالت. -->
        <div class="docsection">
          <div class="docsectiontitle">${ico_('fileIcon',15)} عرض السعر</div>
          <div class="iconbtnrow">
            ${state.quotePdfGenerating ? `
              <div class="loading" style="padding:10px 20px;">جارٍ التجهيز...</div>
            ` : state.quotePdfPlain ? `
              <button class="iconbtn" data-act="preview-quote-plain"><span class="ic">${ico_('eyeIcon',16)}</span><span>معاينة</span></button>
              <button class="iconbtn" data-act="share-quote-plain"><span class="ic">${ico_('shareIcon',16)}</span><span>واتساب</span></button>
              <button class="iconbtn" data-act="download-quote-plain"><span class="ic">⬇️</span><span>تنزيل PDF</span></button>
            ` : `
              <div class="loading" style="padding:10px 20px;">جارٍ التجهيز...</div>
            `}
          </div>
        </div>

        <div class="docsection">
          <div class="docsectiontitle">📦 طلبية النواقص</div>
          <div class="iconbtnrow">
            <button class="iconbtn" data-act="shortage-img" data-group="kraft_new" ${state.shortageImgBusy==='last|kraft_new'?'disabled':''}><span class="ic">🖼️</span><span>${state.shortageImgBusy==='last|kraft_new'?'جارٍ...':'نواقص كرافت ونيو'}</span></button>
            <button class="iconbtn" data-act="shortage-img" data-group="combin_acc" ${state.shortageImgBusy==='last|combin_acc'?'disabled':''}><span class="ic">🖼️</span><span>${state.shortageImgBusy==='last|combin_acc'?'جارٍ...':'نواقص كومبن واكسسوارات'}</span></button>
          </div>
        </div>
        <br>
        <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;">
          <button class="newbtn outline" data-act="new-order">تسجيل طلب جديد</button>
        </div>
      </div>
    </main>`;
  }

  // كل قطاع بلونه الخاص عشان يتميّز عن التاني بصريًا وهو مجمّع 4 في الصف
  const SECTOR_COLOR_CLASS_ = {
    'قطاعات PVC كومبن': 'sc-1',
    'قطاعات كرافت لاين': 'sc-2',
    'نيو لاين': 'sc-3',
    'اكسسوارات pvc اكسا': 'sc-4',
    'ابواب WPC': 'sc-5',
    'تصنيع': 'sc-6',
    'حشوات': 'sc-7',
    'اخري': 'sc-8'
  };
  const sectorChips = SECTOR_CHIPS.map(g=>`
    <button class="chip ${g===OTHER_SECTOR?'gold':(SECTOR_COLOR_CLASS_[g]||'')} ${state.mainGroup===g?'active':''}" data-act="set-group" data-val="${esc(g)}">${esc(g)}</button>
  `).join('');

  let subSection = '';
  let productSection = '';
  // مفاتيح الأصناف اللي عرضنالها صف مختصر (وحدة+كمية+سعر) تحتها في الشبكة
  // نفسها — لأن اللون كان اتحدد بالفعل من خطوة "اختار اللون" فوق، فمفيش
  // داعي نودّي الموزع لقسم "حدد التفاصيل" البعيد. أي صنف تاني (لسه محتاج
  // يختار لون بنفسه) بيفضل يظهر في قسم "حدد التفاصيل" العادي تحت.
  const inlineStagedKeys_ = [];
  if(state.mainGroup && state.mainGroup!==OTHER_SECTOR){
    const needsSub = sectorNeedsSubFilter(state.mainGroup);
    const colorsAvail = !needsSub ? colorsForMain(state.mainGroup) : [];
    let subToUse = null;
    if(needsSub){
      const subs = subGroupsForMain(state.mainGroup);
      const isAcc = state.mainGroup.includes('اكسسوارات');
      const accQ = isAcc ? asText(state.accGlobalSearch).trim() : '';
      if(subs.length>1){
        subSection = `
        <div class="card">
          <h2><span class="num">4</span>اختار التصنيف الفرعي</h2>
          ${isAcc ? `
          <div class="searchbox accglobalsearch">
            <input type="text" placeholder="🔍 ابحث في كل الاكسسوارات (من غير ما تختار تصنيف)..." value="${esc(state.accGlobalSearch)}" data-act="acc-global-search">
          </div>
          ${accQ ? `<div class="accsearchhint">🔎 بتدوّر في كل الاكسسوارات على «${esc(accQ)}» — امسح البحث عشان ترجع للتصنيفات.</div>` : ''}
          ` : ''}
          ${accQ ? '' : `
          <div class="chipwrap chipgrid3">
            ${subs.map(s=>`<button class="chip ${state.subGroup===s?'active':''}" data-act="set-sub" data-val="${esc(s)}">${esc(s)}</button>`).join('')}
          </div>`}
        </div>`;
      }
      // لو فيه بحث عام في الاكسسوارات، نعرض من كل التصنيفات (sub=null) ونتخطى إجبار اختيار تصنيف
      subToUse = accQ ? null : state.subGroup;
    } else if(colorsAvail.length){
      // خطوة "اختار اللون" — بتظهر بعد القطاع مباشرة لأي قطاع فيه ألوان حقيقية
      subSection = `
      <div class="card">
        <h2><span class="num">4</span>اختار اللون</h2>
        <div class="chipwrap chipgrid4">
          ${colorsAvail.map(c=>`<button class="chip ${state.selectedColor===c?'active':''}" style="${getColorStyle(c)}" data-act="set-color" data-val="${esc(c)}">${esc(c)}</button>`).join('')}
        </div>
      </div>`;
    }
    const colorToUse = colorsAvail.length ? state.selectedColor : null;
    const accGlobalQ = (needsSub && state.mainGroup.includes('اكسسوارات')) ? asText(state.accGlobalSearch).trim() : '';
    const showProducts = needsSub ? (!!subToUse || !!accGlobalQ) : (colorsAvail.length ? !!colorToUse : true);
    if(showProducts){
      const prodMap = productsForGroup(state.mainGroup, subToUse);
      // البحث: لو فيه بحث عام في الاكسسوارات بنستخدمه، وإلا بنستخدم البحث العادي جوه التصنيف
      const q = (accGlobalQ || state.productSearch.trim()).toLowerCase();
      // ترتيب الأصناف رجع زي ما كان — بترتيب الكاتالوج الأصلي، من غير ترتيب حسب التوفر
      let names = [...prodMap.keys()].filter(n => !q || n.toLowerCase().includes(q));
      // لو دخلنا من خطوة "اختار اللون"، بنفلتر الأصناف على اللي فعلاً متاحة
      // باللون ده بس — عشان دي بالظبط اللي طلبها الموزع.
      if(colorToUse){
        names = names.filter(n => colorsForProduct(state.mainGroup, n).some(c=>c.color===colorToUse));
      }
      // ترتيب حسب توفر الرصيد: متوفر أولًا، بعده كمية قليلة، بعده متاح اعواد،
      // وأخيرًا مفيش رصيد خالص — والمنتجات الموقوفة (تعطيل يدوي) في الآخر خالص.
      if(warehouseAffectsStock(state.mainGroup)){
        const levelRank_ = lvl => lvl==='ok' ? 0 : lvl==='low' ? 1 : lvl==='crit' ? 2 : lvl==='out' ? 3 : 4;
        const rankFor_ = n => {
          const unavailable = colorToUse
            ? !!(findCatalogItem(state.mainGroup, n, colorToUse) && findCatalogItem(state.mainGroup, n, colorToUse).available===false)
            : isProductFullyUnavailable(state.mainGroup, n);
          if(unavailable) return 5;
          const lvl = colorToUse ? colorStockLevel(findCatalogItem(state.mainGroup, n, colorToUse)) : productStockLevel(state.mainGroup, n);
          return levelRank_(lvl);
        };
        names = names
          .map(n=>({n, r:rankFor_(n)}))
          .sort((a,b)=>a.r-b.r)
          .map(x=>x.n);
      }
      productSection = `
      <div class="card">
        <h2><span class="num">5</span>اختار الأصناف (تقدر تختار أكتر من واحد)</h2>
        <div class="currentctx">
          📍 إنت الآن في:
          <b>${esc(state.mainGroup)}</b>${subToUse ? ` — <b>${esc(subToUse)}</b>` : ''}${colorToUse ? ` — <b>${esc(colorToUse)}</b>` : ''}
        </div>
        <div class="searchbox">
          <input type="text" placeholder="ابحث عن اسم الصنف..." value="${esc(state.productSearch)}" data-act="search-product">
        </div>
        <div class="stocklegend">
          ${colorToUse ? `
          <span><i style="background:var(--success);"></i> متوفر</span>
          <span><i style="background:var(--gold);"></i> كمية قليلة</span>
          <span><i style="background:var(--danger);"></i> متاح اعواد</span>
          <span><i style="background:#000;"></i> مفيش رصيد خالص</span>
          <span><i style="background:#C9C5BA;"></i> موقوف</span>
          ` : `
          <span><i style="background:var(--success);"></i> متوفر</span>
          <span><i style="background:var(--danger);"></i> مفيش رصيد (السعر متاح)</span>
          <span><i style="background:#C9C5BA;"></i> موقوف</span>
          `}
        </div>
        <div class="productgrid listmode ${state.mainGroup && state.mainGroup.includes('اكسسوارات') ? 'compact' : ''}">
          ${(()=>{
            // 🔽 لو فيه صنف متحدد دلوقتي في القطاع ده، نعرضه هو بس ونخفي الباقي.
            // أول ما يلغي اختياره (يدوس عليه تاني أو يدوس إلغاء)، كل الأصناف
            // بترجع تظهر. بطلب صريح من المستخدم.
            const stagedNames = names.filter(n => state.staged.some(s=>s.key===stagedKey(state.mainGroup,n)));
            const visibleNames = stagedNames.length ? stagedNames : names;
            return visibleNames.length ? visibleNames.map(n=>{
            const stagedEntry = state.staged.find(s=>s.key===stagedKey(state.mainGroup,n));
            const isStaged = !!stagedEntry;
            const inCart = state.cart.some(it=>it.main===state.mainGroup && it.product===n);
            const colorItem = colorToUse ? findCatalogItem(state.mainGroup, n, colorToUse) : null;
            const unavailable = colorToUse ? !!(colorItem && colorItem.available===false) : isProductFullyUnavailable(state.mainGroup, n);
            // ⚠️ في مخازن العاشر والمنصورة، ولو الداخل عميل، الرصيد مالوش
            // معنى — نوري الصنف عادي من غير أي تلوين أو لافتة "متوفر/مفيش
            // رصيد" خالص. "موقوف" من الأدمن يفضل يتطبق دايمًا مهما كان.
            const showStock = warehouseAffectsStock(state.mainGroup);
            // في وضع "اختار اللون" بنستخدم المستوى الحقيقي بتاع اللون ده بالظبط
            // (4 مستويات: مفيش رصيد خالص / اعواد / قليلة / متوفر) — نفس الألوان
            // والتصميم المستخدمين أصلاً في شرائح الألوان.
            const lvl = unavailable ? 'unavailable' : (showStock ? (colorToUse ? colorStockLevel(colorItem) : productStockLevel(state.mainGroup, n)) : 'ok');
            const stockClass = unavailable ? 'unavailable' : (showStock ? (
              colorToUse
                ? (lvl==='ok' ? 'instock' : lvl==='low' ? 'lowstock' : lvl==='crit' ? 'critstock' : 'blackstock')
                : (lvl==='ok' ? 'instock' : lvl==='crit' ? 'lowstock' : 'outstock')
            ) : '');
            const tile = `
            <div class="ptile ${isStaged?'selected':''} ${inCart?'incart':''} ${stockClass}" data-act="${unavailable?'noop-unavailable':'toggle-product'}" data-val="${esc(n)}">
              ${isStaged?'<span class="tick">✓</span>':''}
              <span>${esc(n)}</span>
              ${unavailable?'<span class="unavailtag">موقوف</span>':''}
              ${colorToUse ? `
                ${(showStock && !unavailable && lvl==='out')?'<span class="stocktag black">مفيش رصيد خالص</span>':''}
                ${(showStock && !unavailable && lvl==='crit')?'<span class="stocktag out">متاح اعواد</span>':''}
                ${(showStock && !unavailable && lvl==='low')?'<span class="stocktag low">كمية قليلة</span>':''}
                ${(showStock && !unavailable && lvl==='ok')?'<span class="stocktag in">متوفر</span>':''}
              ` : `
                ${(showStock && !unavailable && lvl==='out')?'<span class="stocktag out">مفيش رصيد</span>':''}
                ${(showStock && !unavailable && lvl==='crit')?`<span class="stocktag low">كمية قليلة: ${esc(lowStockColorsLabel(state.mainGroup, n) || '—')}</span>`:''}
                ${(showStock && !unavailable && lvl==='ok')?`<span class="stocktag in">متوفر: ${esc(availableColorsLabel(state.mainGroup, n) || '—')}</span>`:''}
              `}
            </div>`;
            // ⚠️ لو اللون اتحدد بالفعل من خطوة "اختار اللون" فوق (colorToUse)
            // وده الصنف ده كان متضاف بلونه، بنعرض صف مختصر (وحدة+كمية+سعر+
            // زرار إضافة) على طول تحت الصنف — من غير ما نبعته لقسم "حدد
            // التفاصيل" البعيد ولا نعيد سؤاله عن اللون تاني.
            //
            // 🎨 ميزة إضافة ألوان تانية لنفس الصنف من غير ما تخرج من الشاشة:
            // بنعرض صف كمية/سعر منفصل لكل لون اختاره (colorToUse + أي لون
            // زوّده يدويًا)، وتحتهم زرار "+ أضف لون تاني" يفتح شرائح باقي
            // الألوان المتاحة لنفس الصنف. تفعيله من نفس toggleStagedColor
            // اللي بتستخدمها شرائح الألوان العادية.
            let inlineRow = '';
            if(isStaged){
              if(colorToUse && stagedEntry.selectedColors.includes(colorToUse)){
                const extraColors = stagedEntry.availableColors.filter(c=>c!==colorToUse);
                const pickerOpen = state.colorPickerOpenKey === stagedEntry.key;
                inlineRow = `<div class="inlinemulticolor">` +
                  stagedEntry.selectedColors.map(c=>`
                    ${stagedEntry.selectedColors.length>1 ? `<div class="inlinecolorlabel">${esc(c)}</div>` : ''}
                    ${renderInlineQtyRow(stagedEntry, c)}
                  `).join('') +
                  (extraColors.length ? `
                  <button class="addcolorbtn" data-act="toggle-color-picker" data-key="${esc(stagedEntry.key)}">
                    ${pickerOpen ? ico_('xCircle',14) + ' اقفل' : ico_('paletteIcon',14) + ' أضف لون تاني'}
                  </button>
                  ${pickerOpen ? `
                  <div class="chipwrap chipgrid4 chipsquares" style="margin-top:8px;">
                    ${extraColors.map(c=>{
                      const unavailable = isColorUnavailable(stagedEntry.main, stagedEntry.product, c);
                      const colorStyles = getColorStyle(c);
                      if(unavailable) return `<button class="chip disabled" style="${colorStyles}" data-act="noop-unavailable" disabled>${esc(c)}<small>موقوف</small></button>`;
                      if(!warehouseAffectsStock(stagedEntry.main)) return `<button class="chip" style="${colorStyles}" data-act="toggle-color" data-key="${esc(stagedEntry.key)}" data-val="${esc(c)}">${esc(c)}</button>`;
                      const lvl = colorStockLevel(findCatalogItem(stagedEntry.main, stagedEntry.product, c));
                      if(lvl==='out') return `<button class="chip nostockchip" style="${colorStyles}" data-act="toggle-color" data-key="${esc(stagedEntry.key)}" data-val="${esc(c)}">${esc(c)}<small>غير متاح رصيد</small></button>`;
                      if(lvl==='crit') return `<button class="chip outstockchip" style="${colorStyles}" data-act="toggle-color" data-key="${esc(stagedEntry.key)}" data-val="${esc(c)}">${esc(c)}<small>متاح اعواد</small></button>`;
                      if(lvl==='low') return `<button class="chip gold lowstockchip" style="${colorStyles}" data-act="toggle-color" data-key="${esc(stagedEntry.key)}" data-val="${esc(c)}">${esc(c)}<small>كمية قليلة</small></button>`;
                      return `<button class="chip greenchip" style="${colorStyles}" data-act="toggle-color" data-key="${esc(stagedEntry.key)}" data-val="${esc(c)}">${esc(c)}</button>`;
                    }).join('')}
                  </div>` : ''}
                  ` : '') +
                `</div>`;
              }else{
                // ⚠️ قبل كده كان بلوك التفاصيل بيروح لقسم "حدد التفاصيل" بعيد
                // تحت الشبكة. دلوقتي بيتفتح مكانه بالظبط تحت الصنف المضغوط،
                // فالموزع يشوف الكمية والوحدة وزراير ضيف للسلة/إلغاء على طول.
                inlineRow = `<div class="inlinestaged">${renderStagedBlock(stagedEntry)}</div>`;
              }
              inlineStagedKeys_.push(stagedEntry.key);
            }
            return tile + inlineRow;
          }).join('') : '<div class="empty">مفيش نتائج بالاسم ده</div>';
          })()}
        </div>
      </div>`;
    }
  }

  let otherSection = '';
  if(state.mainGroup===OTHER_SECTOR){
    otherSection = `
    <div class="card">
      <h2><span class="num">3</span>صنف غير موجود بالقائمة</h2>
      <div class="field">
        <label>اسم الصنف اللي عايزه *</label>
        <input type="text" placeholder="اكتب اسم الصنف" value="${esc(state.otherName)}" data-act="set-othername">
      </div>
      <div class="field">
        <label>ملاحظات على الصنف</label>
        <textarea placeholder="أي تفاصيل عن الصنف (مقاس، خامة...)" data-act="set-othernote">${esc(state.otherNote)}</textarea>
      </div>
      <label>الوحدة</label>
      <div class="chipwrap" style="margin-bottom:14px;">
        ${unitOptionsForGroup(OTHER_SECTOR).map(u=>`
          <button class="chip ${state.otherUnit===u?'active':''}" data-act="set-otherunit" data-val="${esc(u)}">${esc(u)}</button>
        `).join('')}
      </div>
      <label>الكمية</label>
      <div class="qtystepper">
        <button data-act="other-qty-dec" type="button">−</button>
        <input type="number" min="1" value="${state.otherQty}" data-act="other-qty-input">
        <button data-act="other-qty-inc" type="button">+</button>
      </div>
      <div class="field" style="margin-top:12px;">
        <label>السعر (اختياري، لو عارفه)</label>
        <input type="number" min="0" placeholder="مثال: 150" value="${esc(state.otherPrice)}" data-act="set-otherprice">
      </div>
      <button class="addbtn" data-act="add-other">إضافة للسلة</button>
    </div>`;
  }

  // الأصناف اللي عرضنالها صف مختصر تحت الصنف نفسه (لون متحدد من فوق) مش
  // بتتكرر هنا — القسم ده بقى بس للأصناف اللي لسه محتاجة تختار لون بنفسها.
  const remainingStaged = state.staged.filter(s => !inlineStagedKeys_.includes(s.key));
  const stagedSection = remainingStaged.length ? `
    <div class="card">
      <h2><span class="num">6</span>حدد التفاصيل</h2>
      ${remainingStaged.map(renderStagedBlock).join('')}
    </div>` : '';

  const cartSection = `
    <div class="card">
      <h2><span class="num">7</span>الأصناف المطلوبة (${state.cart.length})</h2>
      ${renderCartItemsHtml(state.cart)}
    </div>`;

  // المخزن بقى أول خطوة — يظهر كإيقونات، ولحد ما الموزع يختار مخزن،
  // باقي الفورم (بيانات الموزع، القطاعات، الأصناف...) ما بيظهرش خالص.
  const warehouseCard = `
    <div class="card">
      <h2><span class="num">1</span>برجاء اختيار المخزن لسهولة توجيهه للمسؤول</h2>
      <div class="whgrid">
        ${WAREHOUSES.map(w=>`
          <button class="whtile ${state.warehouse===w?'active':''}" data-act="pick-warehouse-inline" data-val="${esc(w)}">
            <span class="whicon">${warehouseIcon_(w)}</span>
            <span>${esc(w)}</span>
          </button>
        `).join('')}
      </div>
    </div>`;

  // ملحوظة: زرار "عندي طلب محفوظ في السلة" اتشال من هنا بناءً على طلب —
  // بقى متاح دلوقتي من تاب "طلباتي" في الهيدر (نفس شاشة متابعة الطلبات)،
  // فمفيش داعي يتكرر هنا تحت شاشة اختيار المخزن.

  // العميل ميشوفش شاشة اختيار المخزن أصلاً — مالهاش معنى بالنسباله لأنه
  // مش بيشوف رصيد في أي مخزن.
  if(!state.warehouse && !isClientAccount()){
    return `<main>${warehouseCard}</main>`;
  }

  const distSection = `
    <div class="card distcard">
      ${state.editingOrderId ? `<div class="editbanner">✏️ بتعدّل على طلب سابق #${esc(state.editingOrderId.toUpperCase())}</div>` : ''}
      ${isClientAccount() ? '' : `
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;">
        <span style="font-size:12px;color:var(--muted);">${warehouseIcon_(state.warehouse)} المخزن: <b style="color:var(--navy);">${esc(state.warehouse)}</b></span>
        <button class="chip" style="padding:3px 10px;font-size:11px;" data-act="pick-warehouse-inline" data-val="">غيّر</button>
      </div>
      ${(state.warehouse && !STOCK_TRACKED_WAREHOUSES_.includes(state.warehouse)) ? `
      <div class="warehousewarn">⚠ الأصناف في مخزن "${esc(state.warehouse)}" غير معتمدة إلا وقت التحميل فقط، نظرًا لعدم حجز بضاعة مسبقًا.</div>
      ` : ''}`}
      <h2><span class="num">2</span>بيانات الموزع</h2>
      <div class="row3">
        <div class="field">
          <label>اسم الموزع *</label>
          <input type="text" placeholder="فرع طنطا" value="${esc(state.distName)}" data-act="set-distname">
        </div>
        <div class="field">
          <label>المنطقة *</label>
          <input type="text" placeholder="المنشية" value="${esc(state.distRegion)}" data-act="set-distregion">
        </div>
        <div class="field">
          <label>الموبايل *</label>
          <input type="tel" placeholder="01xxxxxxxxx" value="${esc(state.distPhone)}" data-act="set-distphone">
        </div>
      </div>
    </div>`;

  const groupCard = `
    <div class="card">
      <h2><span class="num">3</span>اختار القطاع</h2>
      <div class="chipwrap chipgrid4">${sectorChips}</div>
    </div>`;

  const noteSection = `
    <div class="card">
      <h2><span class="num">8</span>ملاحظات عامة (اختياري)</h2>
      <textarea placeholder="أي تفاصيل إضافية عن الطلب..." data-act="set-note">${esc(state.note)}</textarea>
    </div>`;

  // ⚠️ رجّعنا الشكل الأصلي: كروت كاملة العرض واحد تحت التاني، مش أعمدة
  // ضيقة جنب بعض (112/230/250px) — الأعمدة الضيقة دي كانت هي السبب الحقيقي
  // إن أزرار القطاعات كانت بتظهر عمودي (واحد تحت التاني) رغم إن الكود بتاعها
  // نفسه أفقي — العمود كان ضيق أوي ومكنش بيسع غير زرار واحد في الصف.
  const orderColumns = `
    ${groupCard}
    ${subSection}
    ${productSection}
    ${otherSection}
    ${stagedSection}
  `;

  return `
  <main>
    ${saveErrorBanner}
    ${catalogErrorBanner}
    ${distSection}
    ${orderColumns}
    ${cartSection}
    ${noteSection}
    <div class="submitbar ${state.cart.length ? 'fixed' : ''}">
      <div class="submitbar-inner">
      ${state.cart.length ? `
      <div class="cartbar">
        <span class="cartbar-txt">🛒 ${state.cart.length} صنف في السلة</span>
        <button class="cartbar-btn" data-act="open-cart-review">مراجعة الطلب</button>
      </div>` : ''}
      <div class="submitrow">
        <button class="submitbtn" data-act="request-submit" ${state.submitting?'disabled':''}>
          <span class="ic">${state.submitting ? '⏳' : ico_('sendIcon',15)}</span>${state.submitting ? 'جارٍ الإرسال...' : (state.editingOrderId ? 'حفظ التعديلات' : 'إرسال الطلب')}
        </button>
        ${!state.editingOrderId ? `
        <button class="savebtn ${state.draftJustSaved?'saved':''}" data-act="save-draft" type="button">
          <span class="ic">${state.draftJustSaved?'✓':'🛒'}</span>${state.draftJustSaved?'اتحفظ':'حفظ للسلة'}

// ===== render: admin view =====
// نفس منطق الفلترة اللي المتابعة بتعرضه (بحث بالاسم + حالة الطلب)، بنستخدمه
// هنا وكمان في تجهيز PDF النواقص عشان الأصناف اللي بتتجمّع تكون مطابقة
// بالظبط لللي ظاهر على الشاشة في لحظة الضغط على الزرار.
// وقت الطلب كرقم قابل للمقارنة. بنعدّيه على Date عشان لو السيرفر رجّع
// نص أو تاريخ بدل رقم برضه يشتغل، ولو الوقت باظ (صفر/غير صالح) بنرجع صفر.
function orderTimeKey_(o){
  const t = new Date(o && o.ts != null ? o.ts : 0).getTime();
  return isFinite(t) ? t : 0;
}
// رقم الطلب كعدد — بنستخدمه كمرجّح احتياطي لو الأوقات متساوية أو ضايعة.
function orderNoKey_(o){
  const n = parseInt(String((o && o.orderNo) || '').replace(/[^0-9]/g, ''), 10);
  return isFinite(n) ? n : 0;
}

function filteredAdminOrders_(){
  const q = state.adminFilter.trim().toLowerCase();
  return state.orders.filter(o=>{
    if(state.adminStatusFilter!=='all' && o.status!==state.adminStatusFilter) return false;
    if(q && !(o.distName||'').toLowerCase().includes(q)) return false;
    return true;
  // الأحدث فوق والأقدم تحت. بنرتّب بالوقت تنازليًا، ولو الوقت متساوي أو مش
  // موجود بنرجع لرقم الطلب، عشان الترتيب مايعتمدش على ترتيب الصفوف الراجع
  // من الشيت خالص.
  }).slice().sort((a,b)=>{
    const d = orderTimeKey_(b) - orderTimeKey_(a);
    if(d !== 0) return d;
    return orderNoKey_(b) - orderNoKey_(a);
  });
}

async function loadManageApprovals(){
  state.manageApprovalsLoading = true; render();

    const [regRes, pwRes] = await Promise.all([
      fetch(APPS_SCRIPT_URL + '?action=manageRegRequests&token=' + encodeURIComponent(token)).then(r=>r.json()),
      fetch(APPS_SCRIPT_URL + '?action=managePasswordRequests&token=' + encodeURIComponent(token)).then(r=>r.json())
    ]);
    state.manageRegRequests = Array.isArray(regRes) ? regRes : [];
    state.managePwRequests = Array.isArray(pwRes) ? pwRes : [];
    state.manageApprovalsLoaded = true;
  }catch(e){

  }
  state.manageApprovalsLoading = false;
  render();
}

async function manageDecideReg(username, approve){
  try{
    const action = approve ? 'manageApproveReg' : 'manageRejectReg';
    const d = await apiPost({ action:action, token:getManageToken(), username:username });
    if(!d || d.ok !== true) throw new Error('server refused');
    state.manageRegRequests = state.manageRegRequests.filter(x=>x.username!==username);
    showToast(approve ? 'تمت الموافقة ✓' : 'اترفض الطلب');
    render();
  }catch(e){ showToast('حصل خطأ، حاول تاني'); }
}
async function manageDecidePw(id, approve){
  try{
    const action = approve ? 'manageApprovePasswordReset' : 'manageRejectPasswordReset';
    const d = await apiPost({ action:action, token:getManageToken(), id:id });
    if(!d || d.ok !== true) throw new Error('server refused');
    state.managePwRequests = state.managePwRequests.filter(x=>String(x.id)!==String(id));
    showToast(approve ? 'تمت الموافقة ✓' : 'اترفض الطلب');
    render();
  }catch(e){ showToast('حصل خطأ، حاول تاني'); }
}

async function manageSaveItem(){
  const d = state.manageEditDraft;
  const isNew = state.manageEditingName==='NEW';
  if(isNew){

    d.name = asText(d.product).trim() + (d.color ? ' - ' + asText(d.color).trim() : '');
  }
  state.manageSaving = true; render();
  try{
    const action = isNew ? 'manageAddCatalogItem' : 'manageUpdateCatalogItem';
    const r = await apiPost({ action, token:getManageToken(), item:d });
    if(r && r.ok){
      showToast(isNew ? 'اتضاف الصنف ✓' : 'اتحفظ التعديل ✓');
      state.manageEditingName = null;
      state.manageEditDraft = {};
    } else {
      showToast(isNew ? 'الاسم ده موجود بالفعل — جرّب اسم مختلف' : 'تعذّر الحفظ، حاول تاني');
    }

  state.manageSaving = false;
  render();
}

            <div class="dmeta">${ico_('clockIcon',12)} ${dateStr}</div>

        <div class="items">

            <div class="item-row"><span>${esc(it.product)}${it.color?' — '+esc(it.color):''}</span><b>×${it.qty} ${esc(it.unitType||'')}</b></div>

        <div class="adminbtnrow adminbtnrow-compact">
          ${isDone ? `<button class="delbtn pdf" data-act="notify-dist" data-id="${esc(o.id)}">${ico_('bellIcon',11)} بلّغ الموزع</button>` : ''}
          <button class="delbtn pdf" data-act="download-order-pdf" data-id="${esc(o.id)}" ${state.adminPdfGeneratingId===o.id?'disabled':''}>

            ${state.shortageImgBusy===(o.id+'|combin_acc') ? '⏳ جارٍ...' : ico_('imageIcon',11) + ' نواقص كومبن واكسسوارات'}

  return `
  <main>
    <div class="adminbar">
      <input type="text" placeholder="بحث باسم الموزع..." value="${esc(state.adminFilter)}" data-act="admin-search">
      <button class="exportbtn" data-act="refresh-orders">🔄 تحديث</button>

      <button class="exportbtn" data-act="export-excel-received">تصدير Excel (${STATUS_RECEIVED})</button>

      <button class="exportbtn" data-act="open-callmebot-page" title="لو الرقم قال دعوه للواتساب يبقى الرقم اتغيّر — هنا هتلاقي الرقم الجديد من موقعهم الرسمي">🌐 الصفحة الرسمية (لو الرقم اتغيّر)</button>

function isStandaloneMode(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOSDevice(){
  const ua = navigator.userAgent || '';
  if(/iphone|ipad|ipod/i.test(ua)) return true;
  // ⚠️ iPad من iPadOS 13 وطالع بيقول عن نفسه "Macintosh" في الـ userAgent،
  // فكان بيفشل في الكشف ويظهرله زرار تثبيت أندرويد اللي مش بيشتغل على iOS خالص.
  // بنكشفه هنا من إن عنده لمس (الماك مالوش شاشة لمس).
  if(/Macintosh/i.test(ua) && navigator.maxTouchPoints > 1) return true;
  return false;
}

// على iOS، "إضافة إلى الشاشة الرئيسية" شغالة في Safari بس.
// لو اليوزر فاتح اللينك من كروم أو فيسبوك أو واتساب، الخيار ده مش موجود عنده
// أصلاً — وده أكتر سبب بيخلي ناس الآيفون تقول "مش عارف أثبته".
// إشعار يدوي للموزع — بيفتح واتساب برسالة جاهزة. بيشتغل مع أي رقم من غير أي إعداد.
// نص رسالة تبليغ الموزع — مكان واحد بس عشان الرسالة النصية وصورة الإشعار
// يفضلوا متطابقين، ولو النص اتغير تاني نغيّره من هنا وبس.
function notifyMessageText_(ord){
  let msg;
  if(ord.status===STATUS_DONE){
    msg = '✅ تم تنفيذ طلبكم بالكامل وجاهز — يمكنكم التواصل معنا للاستلام\n';
  } else {
    msg = '✅ تم استلام الطلب الخاص بكم وجاري تنفيذه حسب المتاح بالمخزن وسيتم اعلامكم برساله بالمتاح\n';
  }
  msg += 'نشكر صبركم\n';
  msg += 'رقم الطلب: #' + orderNoDisplay_(ord) + '\n';
  msg += 'الموزع: ' + (asText(ord.distName) || '-') + '\n';
  msg += 'المنطقة: ' + (asText(ord.distRegion) || '-') + '\n';
  msg += 'المخزن: ' + (asText(ord.warehouse) || '-') + '\n';
  msg += 'شكرًا لتعاملك مع القرشي لأبواب وشبابيك الـ UPVC';
  return msg;
}

// ===== إرسال الطلب على واتساب (نص) =====
// اسم الصنف كامل: اسم الكتالوج + اللون كلمة واحدة متصلة
// مثال: "ضلفة باب مفصلي فتح للخارج كرافت بيج"
function itemFullName_(it){
  const base = asText(it.name || it.product).trim();
  const col  = asText(it.color).trim();
  if(!col) return base;
  return base.indexOf(col) === -1 ? (base + ' ' + col) : base;
}

// بيحسب لو الصنف ده مش متاح: يا إما موقوف من الأدمن، يا إما رصيده صفر
// في المخزن المختار (سواء لون بعينه أو الصنف كله).
// بتحسب هل الصنف غير متاح في مخزن معيّن بالظبط (مش معتمدة على state.warehouse).
// بنستخدمها في عرض السعر عشان الشارة تتحسب على مخزن الطلب نفسه والرصيد الحالي،
// مهما كان state.warehouse وقت الطباعة.
function unavailableForWarehouse_(main, product, color, warehouse){
  try{
    const c = color ? findCatalogItem(main, product, color) : null;
    if(c && c.available === false) return true;
    if(!color && isProductFullyUnavailable(main, product)) return true;
    // الاكسسوارات مستثناة من تتبّع الرصيد في كل المخازن → كله متاح
    if(main && main.includes('اكسسوارات')) return false;
    // المخزن ده أصلاً مش بيتتبّع فيه رصيد → كله متاح
    if(!STOCK_TRACKED_WAREHOUSES_.includes(asText(warehouse))) return false;
    // نحسب مستوى الرصيد يدويًا (نفس منطق colorStockLevel بس من غير ما نعتمد
    // على warehouseAffectsStock اللي بيبص على state.warehouse)
    const item = c || firstCatalogItem_(main, product);
    if(!item || item.available===false) return true;
    if(item.inStock === false) return true;
    // 🛘 CRITICAL: الرصيد الفعلي = الرصيد الخام - الحجز المحتفظ به
    // لو ما طرحناش الحجز، أصناف محجوزة بتظهر متاحة بالغلط.
    const reserved = (item.reserved_qty || 0);  // من عمود البضاعة المحجوزة
    const effectiveStock = Number(item.stock) - reserved;
    if(!isFinite(effectiveStock) || effectiveStock <= 0) return true;          // صفر رصيد فعلي
    const content = Number(item.unit) || 1;
    if(effectiveStock < content) return true;                      // أقل من لفة كاملة
    return false;
  }catch(e){ return false; }
}
// أول صنف مطابق (لو مفيش لون محدّد) — للاستخدام في حساب الرصيد على مستوى المنتج
function firstCatalogItem_(main, product){
  try{
    const opts = colorsForProduct(main, product).filter(c=>c.available!==false);
    if(!opts.length) return null;
    // نرجّع الصنف صاحب أقل رصيد عشان لو أي لون ناقص نعلّمه
    let worst = null, worstN = Infinity;
    for(const o of opts){
      const ci = findCatalogItem(main, product, o.color);
      const n = Number(ci && ci.stock);
      const v = isFinite(n) ? n : 0;
      if(v < worstN){ worstN = v; worst = ci; }
    }
    return worst;
  }catch(e){ return null; }
}

function computeUnavailable_(main, product, color){
  try{
    const c = color ? findCatalogItem(main, product, color) : null;
    if(c && c.available === false) return true;
    if(!color && isProductFullyUnavailable(main, product)) return true;
    if(!warehouseAffectsStock(main)) return false;
    const lvl = c ? colorStockLevel(c) : productStockLevel(main, product);
    // ⚠️ 'out' = رصيد صفر · 'crit' = فيه شوية عيدان بس أقل من لفة كاملة.
    // الاتنين لازم يتعلّموا "غير متاح" في عرض السعر، لأن الموزّع بيطلب باللفة
    // والرصيد مايكفيش لفة. قبل كده كنا بنعلّم 'out' بس، فالبنود اللي رصيدها
    // أقل من لفة (بس مش صفر) كانت بتعدّي من غير ملاحظة.
    return lvl === 'out' || lvl === 'crit';
  }catch(e){ return false; }
}

// شارة "غير متاح" الحمرا اللي بتتحط جنب اسم الصنف جوه المستندات.
// هنا (على عكس الواتساب) إحنا بنبني HTML، فالألوان متاحة عادي.
function unavailBadgeHTML_(it){
  if(!itemUnavailable_(it)) return '';
  return ' <span style="display:inline-block;background:#C0392B;color:#FFFFFF;' +
         'font-weight:800;font-size:10.5px;padding:1px 8px;border-radius:9px;' +
         'vertical-align:middle;white-space:nowrap;">\u25cf \u063a\u064a\u0631 \u0645\u062a\u0627\u062d</span>';
}
// ⚠️ المخازن برّه STOCK_TRACKED_WAREHOUSES_ (يعني كل حاجة غير طنطا حاليًا)
// مفيهاش رصيد متتبَّع صنف بصنف — يعني مفيش حجز بضاعة فعلي وقت الطلب، والكمية
// بتتأكد فعليًا بس وقت التحميل. عشان الموزّع يبقى فاهم ده وهو شايف عرض
// السعر، بنحط شارة برتقالية جنب كل صنف (مش حمرا زي "غير متاح" — دي معلومة
// عادية مش تحذير من نقص فعلي).
function unconfirmedBadgeHTML_(order){
  if(STOCK_TRACKED_WAREHOUSES_.includes(asText(order && order.warehouse))) return '';
  return ' <span style="display:inline-block;background:#FBEBD1;color:#8A5A00;' +
         'font-weight:800;font-size:10px;padding:1px 7px;border-radius:9px;' +
         'vertical-align:middle;white-space:nowrap;">\u26a0 \u063a\u064a\u0631 \u0645\u0639\u062a\u0645\u062f \u0625\u0644\u0627 \u0648\u0642\u062a \u0627\u0644\u062a\u062d\u0645\u064a\u0644</span>';
}
function unavailNameStyle_(it){
  return itemUnavailable_(it) ? 'color:#C0392B;font-weight:800;' : '';
}

// وقت بناء رسالة الواتساب: بنعتمد على اللقطة المخزّنة وقت الإضافة للسلة،
// ولو مش موجودة (طلب قديم) بنرجع نحسبها لحظيًا كخطة بديلة.
function itemUnavailable_(it){
  if(it && typeof it.unavailable === 'boolean') return it.unavailable;
  return computeUnavailable_(it && it.main, it && it.product, it && it.color);
}

function buildOrderWaText_(o){
  const d = new Date(o && o.ts ? o.ts : Date.now());
  const dateStr = d.toLocaleDateString('ar-EG-u-nu-latn',{day:'2-digit',month:'2-digit',year:'numeric'});
  const timeStr = d.toLocaleTimeString('ar-EG-u-nu-latn',{hour:'2-digit',minute:'2-digit'});
  const line = '\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501\u2501';
  let m = '\ud83d\udeaa *\u0627\u0644\u0642\u0631\u0634\u064a \u0644\u0623\u0628\u0648\u0627\u0628 \u0648\u0634\u0628\u0627\u0628\u064a\u0643 \u0627\u0644\u0640 UPVC*\n';
  m += '\u0637\u0644\u0628 \u062c\u062f\u064a\u062f\n' + line + '\n';
  m += '\ud83d\udc64 \u0627\u0644\u0645\u0648\u0632\u0639: ' + (asText(o.distName) || '-') + '\n';
  m += '\ud83d\udd22 \u0631\u0642\u0645 \u0627\u0644\u0637\u0644\u0628: #' + orderNoDisplay_(o) + '\n';
  m += '\ud83c\udfec \u0645\u062e\u0632\u0646 \u0627\u0644\u062a\u062d\u0645\u064a\u0644: ' + (asText(o.warehouse) || '-') + '\n';
  m += '\ud83d\udd50 \u0648\u0642\u062a \u0627\u0644\u0637\u0644\u0628: ' + dateStr + ' - ' + timeStr + '\n';
  m += line + '\n\ud83d\udce6 *\u0627\u0644\u0623\u0635\u0646\u0627\u0641*\n';
  const items = (o && o.items) ? o.items : [];
  const unavail = [];
  items.forEach(function(it, i){
    const bad = itemUnavailable_(it);
    if(bad) unavail.push(itemFullName_(it));
    m += (i+1) + ') ' + itemFullName_(it) + (bad ? ' \ud83d\udd34 *\u063a\u064a\u0631 \u0645\u062a\u0627\u062d*' : '') + '\n';
    m += '    \u0627\u0644\u0643\u0645\u064a\u0629: ' + (it.qty || 0) + ' ' + (asText(it.unitType) || '') + '\n';
  });
  m += line + '\n';
  // ⚠️ ملاحظة الأصناف غير المتاحة — بتتكتب في آخر الرسالة عشان المسؤول
  // ياخد باله إن الطلب فيه حاجات محتاجة تأكيد قبل التحميل.
  if(unavail.length){
    m += '\ud83d\udd34 *\u0623\u0635\u0646\u0627\u0641 \u063a\u064a\u0631 \u0645\u062a\u0627\u062d\u0629 \u2014 \u0645\u062d\u062a\u0627\u062c\u0629 \u062a\u0623\u0643\u064a\u062f*\n';
    unavail.forEach(function(n){ m += '\ud83d\udd34 *' + n + '*\n'; });
    m += line + '\n';
  }
  if(asText(o.note).trim()) m += '\ud83d\udcdd \u0645\u0644\u0627\u062d\u0638\u0627\u062a: ' + asText(o.note).trim() + '\n';
  m += '\u0625\u062c\u0645\u0627\u0644\u064a \u0639\u062f\u062f \u0627\u0644\u0623\u0635\u0646\u0627\u0641: ' + items.length;
  return m;
}

// ⚠️ السبب الحقيقي إن واتساب مكانش بيفتح: المتصفح (خصوصًا كروم/أندرويد
// وداخل الـPWA) بيمنع window.open لو مانداهش في نفس لحظة ضغطة المستخدم.
// إحنا بننادي عليه بعد await (استنينا رد السيرفر عشان نجيب رقم الطلب الحقيقي)
// فالضغطة بتبقى "ضاعت" وبيتمنع بصمت.
// الحل: بنفتح نافذة فاضية لحظة الضغط على "تأكيد الإرسال" (وهي لسه ضغطة حية)،
// ونحتفظ بيها، وبعد ما الطلب ينجح نوجّهها هي على لينك واتساب.
let __waWin = null;
function reserveWaWindow(){
  try{ __waWin = window.open('about:blank', '_blank'); }catch(e){ __waWin = null; }
}
function releaseWaWindow(){
  try{ if(__waWin && !__waWin.closed) __waWin.close(); }catch(e){}
  __waWin = null;
}
function orderWaUrl_(o){
  return 'https://wa.me/?text=' + encodeURIComponent(buildOrderWaText_(o));
}

// من غير رقم في اللينك -> واتساب بيفتح شاشة "اختار المرسل إليه"
// فالموزع هو اللي يقرر يبعتها لمين (شخص أو جروب) — بس الإرسال نفسه إجباري.
function openOrderWhatsApp(order){
  const o = order || state.lastOrder;
  if(!o){ showToast('مفيش طلب'); return; }
  const url = orderWaUrl_(o);
  // بنتنادى من ضغطة زرار مباشرة، فـ window.open شغّال عادي هنا.
  const w = window.open(url, '_blank');
  if(w){ state.waSent = true; render(); return true; }
  // احتياطي: نوجّه التبويب نفسه
  try{ window.location.href = url; state.waSent = true; render(); return true; }catch(e){}
  showToast('المتصفح منع فتح واتساب — جرّب تاني', 5000);
  return false;
}

// إشعارات الواتساب بتتبعت عن طريق CallMeBot، واللي بيحصل إن أحيانًا تفعيل
// الرقم عند CallMeBot بيقف (خصوصًا لو مفيش رسايل اتبعتت لفترة)، فالإشعارات
// بتوقف من غير أي خطأ ظاهر في التطبيق. الحل: يبعت رسالة التفعيل دي تاني
// لرقم CallMeBot الرسمي، ويرجع يشتغل عادي خلال دقايق.
// إشعارات الواتساب بتتبعت عن طريق CallMeBot، واللي بيحصل إن أحيانًا تفعيل
// الرقم عند CallMeBot بيقف (خصوصًا لو مفيش رسايل اتبعتت لفترة)، فالإشعارات
// بتوقف من غير أي خطأ ظاهر في التطبيق. الحل: يبعت رسالة التفعيل دي تاني

function notifyDistributorManually(id){

  if(!ord) return;

  // المستلم بنفسه (زي الجروب الخاص) بدل ما تتبعت لرقم الموزع تلقائيًا.

// أرقام مصر: بنحوّل 01xxxxxxxxx لصيغة دولية 201xxxxxxxxx
function normalizePhoneIntl_(p){
  let d = asText(p).replace(/\D/g,'');
  if(!d) return '';
  if(d.startsWith('20')) return d;
  if(d.startsWith('0')) return '20' + d.slice(1);
  if(d.startsWith('1')) return '20' + d;
  return d;
}

// الموزع بيبعت الطلب كـ"صورة" ويختار بنفسه هيبعتها لمين (جروب / شخص).
// مفيش رقم محدد — بنفتح شاشة المشاركة بتاعة الموبايل وهو يختار.
//
// ⚠️ قيد مهم: navigator.share لازم يتنده في نفس لحظة الضغطة. لو استنينا الصورة
// تتولد الأول (بتاخد ثانية أو اتنين)، المتصفح بيعتبر إن الضغطة ضاعت وبيلغي
// المشاركة. عشان كده فصلناها خطوتين: "جهّز الصورة" الأول، وبعدين "ابعت".
async function prepareOrderImage(){
  const o = state.lastOrder;
  if(!o){ showToast('مفيش طلب'); return; }
  state.orderImgPreparing = true; render();
  try{
    const blobs = await buildOrderImagePages(o);
    state.orderImages = (blobs && blobs.length) ? blobs : null;
    if(!state.orderImages) showToast('تعذّر تجهيز الصورة، حاول تاني');
  }catch(e){
    state.orderImages = null;
    showToast('تعذّر تجهيز الصورة: ' + (e && e.message ? e.message : e));
  }
  state.orderImgPreparing = false;
  render();
}

// إرسال الطلب كصور (نفس أصناف وأسعار عرض السعر، مقسّمة صفحات — كل صفحة صورة
// لوحدها، لأن واتساب بيبعت صور منفصلة مش PDF واحد طويل). بيجهّز الصور الأول
// لو مش متجهّزة، وبعدين يفتح شاشة مشاركة واتساب والموزع يختار المستلم.
// لو الجهاز مبيدعمش مشاركة الملفات، بينزّل الصور واحدة واحدة.
async function sendOrderAsImage(){
  const o = state.lastOrder;
  if(!o){ showToast('مفيش طلب'); return; }
  if(!state.orderImages || !state.orderImages.length){
    state.waImgPreparing = true; render();
    try{
      const blobs = await buildOrderImagePages(o);
      state.orderImages = (blobs && blobs.length) ? blobs : null;
    }catch(e){
      state.orderImages = null;
      showToast('تعذّر تجهيز الصورة: ' + (e && e.message ? e.message : e));
    }
    state.waImgPreparing = false; render();
    if(!state.orderImages){ showToast('تعذّر تجهيز الصورة، حاول تاني'); return; }
  }
  await shareOrderImage();
  // shareOrderImage بيعلّم state.orderSentToWa — بنزامنها مع waSent عشان الزرار
  if(state.orderSentToWa){
    state.waSent = true; render();
    autoReturnHomeAfterSend_();
  }
}

// بعد ما الموزع يبعت طلبه (واتساب) أو ينزّل مستنداته من شاشة "تم الإرسال"،
// مفيش داعي الشاشة تفضل واقفة هناك — بترجع تلقائي للشاشة الرئيسية (طلب
// جديد) بعد تأخير بسيط عشان يشوف رسالة التأكيد الأول.
let __autoHomeTimer = null;
function autoReturnHomeAfterSend_(){
  if(__autoHomeTimer) clearTimeout(__autoHomeTimer);
  showToast('تم ✅ هيرجعلك للشاشة الرئيسية...', 2500);
  __autoHomeTimer = setTimeout(()=>{
    __autoHomeTimer = null;
    if(state.successOrderId) resetOrderForm();
  }, 2200);
}

async function shareOrderImage(){
  const blobs = state.orderImages;
  if(!blobs || !blobs.length){ showToast('جهّز الصور الأول'); return; }
  const o = state.lastOrder;
  const base = 'طلب_' + String(o ? o.id : 'order').toUpperCase();
  const files = blobs.map((b,i)=> new File([b], base + (blobs.length>1 ? '_'+(i+1) : '') + '.png', {type:'image/png'}));
  // ⚠️ وضع تشخيص مؤقت: عشان نعرف بالظبط فين المشكلة عند الموزع (المتصفح
  // مش بيدعم مشاركة الملفات؟ ولا الدعم موجود بس المشاركة نفسها بترفض؟)
  // بنجمع السبب في متغيّر واحد ونوريه في التوست الأخير (مش توست منفصل،
  // عشان التوستات بتستبدل بعض على طول ومش بتتراكم).
  let fallbackReason = '';
  const canShareFiles = !!(navigator.canShare && navigator.canShare({files}));
  if(!navigator.share) fallbackReason = ' (المتصفح مبيدعمش المشاركة خالص)';
  else if(!canShareFiles) fallbackReason = ' (المتصفح مبيدعمش مشاركة الصور)';
  try{
    if(canShareFiles){
      // مفيش رقم — شاشة المشاركة هتفتح وهو يختار الجروب أو الشخص
      await navigator.share({ files, title:'طلبية', text:'طلب #' + (o ? orderNoDisplay_(o) : '') });
      state.orderSentToWa = true;
      render();
      return;
    }
  }catch(e){
    // المستخدم لغى المشاركة — مش خطأ
    if(e && e.name === 'AbortError') return;
    fallbackReason = ' (فشلت المشاركة: ' + (e && e.name ? e.name : 'خطأ') + ')';
  }
  // احتياطي: ننزّل الصور واحدة واحدة وهو يرفعهم بإيده
  blobs.forEach((b,i)=> downloadBlob(b, base + (blobs.length>1 ? '_'+(i+1) : '') + '.png'));
  showToast((blobs.length>1 ? ('اتحملت ' + blobs.length + ' صور') : 'اتحملت الصورة') + ' — افتح واتساب وابعتها من المعرض' + fallbackReason, 5000);
  state.orderSentToWa = true;
  render();
}

// تحديث إجباري: بيمسح كل الكاش ويلغي الـ Service Worker ويعيد التحميل من السيرفر.
// بيحل حالة إن الموبايل عالق على نسخة قديمة.
async function forceUpdate(){
  showToast('جارٍ التحديث... استنى لحظة');
  try{
    if('caches' in window){
      const keys = await caches.keys();
      await Promise.all(keys.map(k=>caches.delete(k)));
    }
  }catch(e){}
  try{
    if('serviceWorker' in navigator){
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r=>r.unregister()));
    }
  }catch(e){}
  // نضيف بارامتر عشوائي عشان نتخطى كاش المتصفح نفسه
  const u = new URL(window.location.href);
  u.searchParams.set('v', Date.now());
  window.location.replace(u.toString());
}

async function copyAppLink(){
  try{
    await navigator.clipboard.writeText(APP_URL);
    showToast('اتنسخ ✅ افتح Safari والصقه');

  }
}

function isIOSSafari(){
  if(!isIOSDevice()) return false;
  const ua = navigator.userAgent || '';
  // كروم على iOS فيه CriOS، فايرفوكس FxiOS، إيدج EdgiOS، وتطبيقات جوه (واتساب/فيسبوك) فيها FBAN/FBAV/Instagram
  if(/CriOS|FxiOS|EdgiOS|OPiOS|FBAN|FBAV|Instagram|Line|Twitter/i.test(ua)) return false;
  return /Safari/i.test(ua);
}

// ===== main render =====
// كل مرة بنعمل render بنعيد بناء الصفحة كلها (innerHTML) — وده كان بيضيّع
// مكان التمرير، فالشاشة ترجع لفوق (لأول صنف) في كل مرة تختار صنف.
// هنا بنحفظ مكان التمرير والحقل اللي إيدك فيه، وبنرجّعهم بعد إعادة البناء.
let lastViewKey = '';

// "مرساة" التمرير: بنحفظ العنصر اللي إيدك عليه ومكانه على الشاشة، وبعد إعادة
// البناء بنلاقيه تاني ونظبط التمرير عشان يفضل في نفس المكان بالظبط.
//
// ⚠️ حفظ scrollY لوحده مكانش كفاية: لما تختار صنف، بلوك "حدد التفاصيل" بيتحط
// *فوق* الشبكة، فالمحتوى بيتزحلق لتحت والصنف اللي دوست عليه بيروح من تحت إيدك
// حتى لو التمرير رجع لنفس الرقم. فبنمسك العنصر نفسه مش الرقم.
let scrollAnchor_ = null;

function currentScroll_(){
  return window.scrollY || window.pageYOffset ||
         (document.scrollingElement ? document.scrollingElement.scrollTop : 0) || 0;
}
function scrollTo_(y){
  try{ window.scrollTo(0, y); }catch(e){}
  try{ if(document.scrollingElement) document.scrollingElement.scrollTop = y; }catch(e){}
}

function selectorFor_(el){
  if(!el || !el.dataset || !el.dataset.act) return '';
  let sel = `[data-act="${el.dataset.act}"]`;
  const k = el.getAttribute('data-key');
  const v = el.getAttribute('data-val');
  if(k) sel += `[data-key="${CSS.escape ? CSS.escape(k) : k}"]`;
  if(v) sel += `[data-val="${CSS.escape ? CSS.escape(v) : v}"]`;
  return sel;
}

// بتتنده من onAction قبل ما نغيّر أي حاجة
function setScrollAnchor(el){
  try{
    const sel = selectorFor_(el);
    if(!sel) { scrollAnchor_ = null; return; }
    scrollAnchor_ = { sel, top: el.getBoundingClientRect().top };
  }catch(e){ scrollAnchor_ = null; }
}

function captureUiState_(){
  const el = document.activeElement;
  let focus = null;
  if(el && el.dataset && el.dataset.act && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
    focus = {
      sel: selectorFor_(el),
      start: el.selectionStart,
      end: el.selectionEnd
    };
  }
  return { scrollY: currentScroll_(), focus, anchor: scrollAnchor_ };
}

// ⚠️ كان فيه هنا نظام "مرساة" بيحاول يتتبّع العنصر المضغوط بالاسم ويعوّض
// أي فرق في مكانه بعد الرسم. ده كان بيتعارض مع تثبيت الارتفاع على body
// (اللي بيحل نفس المشكلة أصلاً بطريقة أبسط وأضمن) ومع تثبيت تمرير الشبكة
// الداخلية لوحدها — والتعارض ده هو اللي كان بيسبب قفزة لفوق لما تختار صنف.
// شلنا المرساة خالص وسيبنا حاجتين بس: رجّع نفس رقم التمرير بالظبط، ورجّع
// تمرير الشبكة الداخلية لوحدها (captureGridScroll_/restoreGridScroll_).
// بيحفظ مكان عنصر معيّن على الشاشة (بالـselector بتاعه، مش بمرجع العنصر
// نفسه، عشان العنصر بيتبني من جديد مع كل render) وبيرجّعه لنفس المكان
// بعد أي تغيير — مهما كان السبب في التغيير ده (إضافة/شيل تفاصيل، تغيير
// حالة، ...). أدق بكتير من مسك التمرير كرقم مجرد أو مسك حاوية كبيرة.
function withPositionAnchor_(selector, mutateAndRenderFn){
  let beforeTop = null;
  try{
    const el = document.querySelector(selector);
    if(el) beforeTop = el.getBoundingClientRect().top;
  }catch(e){}

  mutateAndRenderFn();

  if(beforeTop === null) return;
  const applyFix = ()=>{
    try{
      const el2 = document.querySelector(selector);
      if(!el2) return;
      const delta = el2.getBoundingClientRect().top - beforeTop;
      if(Math.abs(delta) > 1) window.scrollBy(0, delta);
    }catch(e){}
  };
  applyFix();
  requestAnimationFrame(applyFix);
}

function restoreUiState_(snap, sameScreen){
  if(!snap) return;
  if(sameScreen && Math.abs(currentScroll_() - snap.scrollY) > 0.5){
    scrollTo_(snap.scrollY);
  }
  const f = snap.focus;
  if(f && f.sel){
    const el = document.querySelector(f.sel);
    if(el && (el.tagName==='INPUT' || el.tagName==='TEXTAREA')){
      // ⚠️ el.focus() العادي بيخلي المتصفح يسحب الصفحة عشان يوريك الحقل —
      // preventScroll بيرجّع التركيز من غير ما يحرّك الصفحة.
      try{ el.focus({ preventScroll: true }); }catch(e){ el.focus(); }
      try{ el.setSelectionRange(f.start, f.end); }catch(e){}
    }
  }
  if(sameScreen){
    requestAnimationFrame(()=>{
      if(Math.abs(currentScroll_() - snap.scrollY) > 1) scrollTo_(snap.scrollY);
    });
  }
  scrollAnchor_ = null;
}

// 🔑 اللقطة الناقصة: ".productgrid" (شبكة الأصناف) عندها overflow-y:auto
// وscroll خاص بيها لوحدها (مش صفحة المتصفح). كل render بيستبدل الـ innerHTML
// بتاعها بالكامل، فالعنصر القديم بتمريره بيتمسح ويتحط عنصر جديد scrollTop=0 —
// فلو الموزع نازل جوه الشبكة ودوس على صنف تحت، الشبكة "تقفز" لفوق فورًا حتى
// لو صفحة المتصفح نفسها ثابتة. ده كان السبب الحقيقي الباقي وراء القفزات.
function captureGridScroll_(){
  const el = document.querySelector('.productgrid');
  return el ? el.scrollTop : null;
}
function restoreGridScroll_(val){
  if(val === null) return;
  const el = document.querySelector('.productgrid');
  if(el) el.scrollTop = val;
}

// عشان الموزع لما يختار صنف جديد (مش شايله قبل كده) ميحتاجش يدور بنفسه على
// كارت "حدد التفاصيل" اللي ممكن يكون بعيد أوي تحت شبكة الأصناف الطويلة —
// بندزّه (scroll) تلقائيًا لبلوك تفاصيل الصنف ده أول ما يتضاف، مع ترك مسافة
// من فوق عشان الهيدر الثابت ميغطيش أول سطر منه.
function scrollToStagedDetail_(key){
  requestAnimationFrame(()=>{
    const el = document.querySelector(`[data-stagedkey="${CSS.escape(key)}"]`);
    if(!el) return;
    const head = document.querySelector('.fixedhead-outer');
    const headH = head ? head.offsetHeight : 0;
    const rect = el.getBoundingClientRect();
    const targetY = window.scrollY + rect.top - headH - 12;
    window.scrollTo({ top: Math.max(0, targetY), behavior: 'smooth' });
  });
}

// بيحط مساحة تحت المحتوى بقد ارتفاع شريط الأزرار الثابت بالظبط،
// عشان آخر كارت في الصفحة يفضل قابل للوصول ومايتغطّاش وراه.
function applyFixedFooterSpacing_(){
  const bar = document.querySelector('.submitbar.fixed');
  const main = document.querySelector('#app > main');
  if(!main) return;
  main.style.paddingBottom = bar ? (bar.offsetHeight + 10) + 'px' : '';
}

function applyFixedHeaderSpacing_(){
  // ⚠️ سطر "نسخة vNN" كان بيروح تحت الهيدر الثابت ويختفي، لأنه أول عنصر
  // جاي في ترتيب الصفحة بعد الهيدر مباشرة — والهيدر الثابت مابياخدش مكانه
  // في الترتيب العادي، فالسطر ده كان بيترسم فوق الصفحة تمامًا (تحت الهيدر).
  // بندفعه هو كمان بنفس ارتفاع الهيدر، وبعده أول عنصر تاني (بانر أو main).
  const head = document.querySelector('.fixedhead-outer');
  const h = head ? head.offsetHeight : 0;
  const version = document.querySelector('#app > .versionline');
  if(version) version.style.marginTop = head ? h + 'px' : '';
  const target = document.querySelector('#app > .installbanner') || document.querySelector('#app > main');
  if(target) target.style.marginTop = '';
}

window.addEventListener('resize', function(){ try{ applyFixedFooterSpacing_(); }catch(e){} });

function render(){
  const app = $('#app');
  const snap = captureUiState_();
  const gridScroll = captureGridScroll_();

  // 🔑 السبب الرئيسي للقفز على مستوى الصفحة: وقت استبدال innerHTML الصفحة
  // بتفضى للحظة، فارتفاعها بيقل، والمتصفح بيقصقص مكان التمرير لأقصى حد متاح.
  // ⚠️ #app عليه min-height:100vh أصلاً، فقفل الارتفاع عليه مبيعملش حاجة —
  // القفل لازم يكون على <body> نفسه (هو صندوق التمرير الفعلي).
  const prevH = document.body.offsetHeight;
  if(prevH) document.body.style.minHeight = prevH + 'px';
  const unlock = ()=>{ try{ document.body.style.minHeight=''; }catch(e){} };

  try{
    if(!isStandaloneMode() && !state.installGateBypassed){
      app.innerHTML = renderInstallGate();
      bindEvents();
      unlock();
      return;
    }
    if(!state.currentUser){
      app.innerHTML = renderAuthView();
      bindEvents();
      unlock();
      return;
    }
    let view;
    if(state.view==='order') view = renderOrderView();
    else if(state.view==='myorders') view = renderMyOrdersView();
    else if(state.view==='manage') view = renderManageView();
    else view = renderAdminView();
    const banner = state.showInstallBanner ? renderInstallBanner() : '';
    app.innerHTML = renderHeader() + banner + view + renderPreviewModal() + renderDiagModal() + renderNotifyPrompt() + renderWarehouseModal() + renderStockModal() + renderPwRequestsModal() + renderCatalogUploadModal() + renderArchiveModal() + renderCartReviewModal() + renderGlobalError() + renderVersionMismatch_();
    bindEvents();
    applyFixedHeaderSpacing_();
    applyFixedFooterSpacing_();

    // نرجّع التمرير بس لو إحنا في نفس الشاشة (مش لما ننتقل من شاشة لشاشة)
    const viewKey = state.view + '|' + (state.successOrderId ? 'success' : '') + '|' + (state.adminUnlocked ? 'a' : '');
    restoreUiState_(snap, viewKey === lastViewKey);
    restoreGridScroll_(gridScroll);
    // ✅ أول ما شاشة النجاح تظهر (انتقال من الفورم ليها)، نثبّت الصفحة فوق
    // عشان الموزع يشوف رسالة النجاح وزرار الواتساب — مش يفضل نازل تحت زي
    // ما كان في الفورم. بنعملها بس عند الدخول للشاشة، مش مع كل رسم.
    if(state.successOrderId && viewKey !== lastViewKey){
      scrollTo_(0);
      requestAnimationFrame(()=>{ scrollTo_(0); });
    }
    lastViewKey = viewKey;
    requestAnimationFrame(()=>{ unlock(); restoreGridScroll_(gridScroll); });
  }catch(err){
    // لو أي جزء من الشاشة فشل يترندر، مانسيبش الشاشة "هنجانة" بصمت — نوريّ رسالة
    // واضحة بدل ما تفضل واقفة من غير أي تفسير.
    console.error('render() failed:', err);
    unlock();
    try{ showToast('⚠️ حصل خطأ في عرض الشاشة: ' + (err && err.message ? err.message : err)); }catch(e){}
  }
}

function renderAuthView(){
  let inner, mode='login';
  if(state.showBiometricGate){ inner = renderBiometricGate(); mode='login'; }
  else if(state.authView==='register'){ inner = renderRegisterForm(); mode='register'; }
  else if(state.authView==='forgot'){ inner = renderForgotForm(); mode='forgot'; }
  else { inner = renderLoginForm(); mode='login'; }
  const changed = state.lastAuthMode !== mode;
  state.lastAuthMode = mode;
  const welcome = mode==='register'
    ? { h:'يلا نبدأ! 🚀', s:'املا بياناتك عشان نفعّل حسابك' }
    : mode==='forgot'

// ===== events =====
// ═══════════════════════════════════════════════════════════════════
//  ربط الأحداث — تفويض (Event Delegation)
// ═══════════════════════════════════════════════════════════════════
//
// ⚡ قبل كده: بعد كل رسم كنا بنلف على **كل** عنصر فيه data-act ونربطله
// listener (أو تلاتة). الشاشة فيها مئات العناصر، والرسم بيحصل مع كل ضغطة —
// يعني مئات عمليات الربط والفك كل مرة. ده كان أكبر سبب للبطء على الموبايلات
// الضعيفة.
//
// دلوقتي: listener واحد بس على #app لكل نوع حدث، بيتربط **مرة واحدة في عمر
// الصفحة**. بندوّر على أقرب عنصر فيه data-act من مكان الضغطة بـ closest().
//
// 🔑 وده كمان بيحل مشكلة المودالات بشكل أنضف: خلفية المودال (.modalbg) ليها
// data-act="close-x" واللوحة اللي جواها data-act="noop". closest() بيرجّع
// أقرب واحد للضغطة — فالضغط جوه اللوحة بيوصل لـ"noop" (مابيعملش حاجة)
// والضغط على الخلفية بيوصل لـ"close-x". من غير أي stopPropagation خالص.

let eventsWired_ = false;

function bindEvents(){
  if(eventsWired_) return;       // مرة واحدة بس — الحاوية #app نفسها مابتتغيرش
  const app = $('#app');
  if(!app) return;
  eventsWired_ = true;

  const actOf = e => e.target.closest && e.target.closest('[data-act]');
  const isField = el => el.tagName==='INPUT' || el.tagName==='TEXTAREA' || el.tagName==='SELECT';

  // ---------- الضغط ----------
  app.addEventListener('click', e=>{
    const el = actOf(e);
    if(!el) return;
    if(isField(el)) return;      // الخانات ليها مسار تاني (input/change)
    setScrollAnchor(el);
    onAction(el.getAttribute('data-act'), el);
  });

  // ---------- الكتابة في الخانات ----------
  app.addEventListener('input', e=>{
    const el = e.target;
    if(!el.matches || !el.matches('[data-act]')) return;
    if(el.tagName!=='INPUT' && el.tagName!=='TEXTAREA') return;
    if(el.type==='file' || el.type==='checkbox') return;
    onInputChange(el.getAttribute('data-act'), el, el.value);
  });

  // ---------- القوايم المنسدلة، الملفات، ومربعات الاختيار ----------
  app.addEventListener('change', e=>{
    const el = e.target;
    if(!el.matches || !el.matches('[data-act]')) return;
    const act = el.getAttribute('data-act');

    if(el.tagName==='INPUT' && el.type==='file'){
      const file = el.files && el.files[0];
      if(file) handleCatalogFileSelected(act, file);
      return;
    }
    if(el.tagName==='INPUT' && el.type==='checkbox'){
      if(act==='manage-draft-available') state.manageEditDraft.available = el.checked;
      return;
    }
    if(el.tagName==='SELECT') onSelectChange(act, el, el.value);
  });

  // ---------- Enter في خانات معيّنة ----------
  app.addEventListener('keydown', e=>{
    if(e.key!=='Enter') return;
    const el = e.target;
    if(!el.matches || !el.matches('[data-act]')) return;
    const act = el.getAttribute('data-act');
    if(act==='pin-input')       onAction('pin-submit', el);
    else if(act==='auth-password')   onAction('login-submit', el);
    else if(act==='forgot-username') onAction('forgot-submit', el);
    // خانة الخصم المخصص: Enter = خلاص خلصت كتابة
    if(el.hasAttribute('data-extradiscount')) el.blur();
  });

  // ---------- الدخول للخانة ----------
  // ⚠️ focus مابيطلعش لفوق (مابيعملش bubbling) فمينفعش نستخدمه في التفويض —
  // البديل focusin وهو بيطلع عادي.
  app.addEventListener('focusin', e=>{
    const el = e.target;
    if(!el.matches || !el.matches('[data-act]')) return;
    // خانات الأرقام: أول ما الموزع يقف فيها، القيمة الحالية تتحدد كلها
    // تلقائيًا — عشان أي رقم جديد يمسح القديم بدل ما يتلزق جنبه.
    if(el.type==='number' || el.getAttribute('data-act')==='staged-qty-input'){
      try{ el.select(); }catch(err){}
    }
  });

  // ---------- الخروج من الخانة ----------
  app.addEventListener('focusout', e=>{
    const el = e.target;
    if(!el.matches) return;

    // خانة الخصم المخصص — بتتحدّث عند الخروج بس عشان مانضيعش الـ focus
    // أثناء الكتابة (الرسم الكامل بيعيد بناء الخانة).
    if(el.hasAttribute('data-extradiscount')){
      const pct = parseFloat(el.value);
      state.extraDiscount = (!isNaN(pct) && pct>=0 && pct<=100) ? pct : 0;
      render();
      return;
    }
    if(!el.matches('[data-act]')) return;
    // خانة كمية "صنف آخر": نسيب الموزع يمسحها وهو بيكتب، وبس لما يسيبها
    // بنتأكد إنها مش أقل من ١.
    if(el.getAttribute('data-act')==='other-qty-input'){
      if(!state.otherQty || state.otherQty<1){ state.otherQty=1; render(); }
    }
    // ⚠️ خانات كمية اللون: مابنرجّعهاش ١ تلقائيًا لو فضلت فاضية — ده كان
    // بيتسبب في "لون اتضاف للسلة بكمية ١ من غير ما الموزع يقصد".
    // confirmStaged هو اللي بيمنع الإضافة ويطلب منه يحدد الكمية.
  });
}

function onSelectChange(act, el, val){
  if(act==='set-color-unit'){
    setStagedColorUnit(el.getAttribute('data-key'), el.getAttribute('data-val'), val);
  }
  if(act==='manage-draft-main'){
    state.manageEditDraft.main = val;
  }
}

function onInputChange(act, el, val){
  const activeAct = el.getAttribute('data-act');
  const activeKey = el.getAttribute('data-key');
  const activeVal = el.getAttribute('data-val');
  const selStart = el.selectionStart, selEnd = el.selectionEnd;

  switch(act){
    case 'search-product': state.productSearch = val; break;
    case 'acc-global-search': state.accGlobalSearch = val; break;
    case 'set-manage-pin': state.managePinInput = val; break;
    case 'manage-search-item': state.manageSearch = val; break;
    case 'manage-draft-sub': state.manageEditDraft.sub = val; break;
    case 'manage-draft-product': state.manageEditDraft.product = val; break;
    case 'manage-draft-color': state.manageEditDraft.color = val; break;
    case 'manage-draft-price': state.manageEditDraft.price = val===''?'':Number(val); break;
    case 'manage-draft-stock': state.manageEditDraft.stock = val===''?'':Number(val); break;
    case 'manage-draft-unit': state.manageEditDraft.unit = val===''?1:Number(val); break;
    case 'set-distname': state.distName = val; autoSaveDraft(); saveProfile(); break;
    case 'set-distregion': state.distRegion = val; autoSaveDraft(); saveProfile(); break;
    case 'set-distphone': state.distPhone = val; autoSaveDraft(); saveProfile(); break;
    case 'set-note': state.note = val; autoSaveDraft(); break;
    case 'set-othername': state.otherName = val; break;
    case 'set-othernote': state.otherNote = val; break;
    case 'set-otherprice': state.otherPrice = val; break;
    case 'other-qty-input': {
      const n = parseInt(val);
      state.otherQty = val==='' ? 0 : (isFinite(n) ? Math.max(0, n) : 0);
      break;
    }
    case 'staged-qty-input': {
      const s = state.staged.find(x=>x.key===activeKey);
      if(s){
        const digitsOnly = val.replace(/[^0-9]/g,'');
        const n = parseInt(digitsOnly);
        s.qtys[activeVal] = digitsOnly==='' ? 0 : (isFinite(n) ? Math.max(0, n) : 0);
      }
      break;
    }
    case 'pin-input': state.pinInput = val.replace(/[^0-9]/g,''); state.pinError=false; break;
    case 'admin-search': state.adminFilter = val; break;
    case 'myorders-phone': state.myOrdersPhone = val; break;
    case 'auth-username': state.authUsername = val; state.authError=''; break;
    case 'auth-password': state.authPassword = val; state.authError=''; break;
    case 'auth-password2': state.authPassword2 = val; state.authError=''; break;
    case 'reg-distname': state.regDistName = val; break;
    case 'reg-distregion': state.regDistRegion = val; break;
    case 'reg-distphone': state.regDistPhone = val; break;
    case 'forgot-username': state.forgotUsername = val; state.authError=''; break;
    case 'forgot-newpass': state.forgotNewPassword = val; state.authError=''; break;
    case 'forgot-newpass2': state.forgotNewPassword2 = val; state.authError=''; break;
  }
  const scrollY = window.scrollY;
  render();
  window.scrollTo(0, scrollY);
  const again = document.querySelector(activeKey ? `[data-act="${activeAct}"][data-key="${activeKey}"][data-val="${activeVal}"]` : `[data-act="${activeAct}"]`);
  if(again && (again.tagName==='INPUT'||again.tagName==='TEXTAREA')){
    again.focus({preventScroll:true});
    if(selStart!=null && again.setSelectionRange){ try{ again.setSelectionRange(selStart, selEnd); }catch(e){} }
    window.scrollTo(0, scrollY);
  }
}

async function onAction(act, el){
  try{
    await onActionInner(act, el);
  }catch(err){
    // أي خطأ في أي زرار كان بيضيع بصمت (الزرار ميعملش حاجة خالص).
    // دلوقتي بيظهر في الصندوق الأحمر بالسبب الكامل.
    showFatalError('الزرار: ' + act + '\n' + (err && err.stack ? err.stack : String(err)));
  }
}

function showFatalError(msg){
  state.saveError = String(msg).slice(0, 900);
  try{ render(); }catch(e){
    // لو حتى render مكسور، نعرض الخطأ مباشرة في الصفحة
    const d = document.createElement('div');
    d.style.cssText = 'position:fixed;inset:0;z-index:99999;background:#fff;color:#900;padding:16px;font:12px monospace;direction:ltr;text-align:left;overflow:auto;white-space:pre-wrap;';
    d.textContent = msg;
    document.body.appendChild(d);
  }
}

// أي خطأ في أي مكان في التطبيق (حتى برّه الزراير) يظهر بدل ما يختفي
window.addEventListener('error', e=>{
  showFatalError('خطأ عام:\n' + (e.error && e.error.stack ? e.error.stack : e.message));
});
window.addEventListener('unhandledrejection', e=>{
  const r = e.reason;
  showFatalError('خطأ غير معالج:\n' + (r && r.stack ? r.stack : String(r)));
});

async function onActionInner(act, el){
  switch(act){
    case 'goto-login': state.authView='login'; state.authError=''; render(); break;
    case 'goto-register': state.authView='register'; state.authError=''; render(); break;
    case 'goto-forgot': state.authView='forgot'; state.authError=''; state.forgotSent=false; render(); break;
    case 'login-submit': await submitLogin(); break;
    case 'biometric-unlock': await unlockWithBiometric(); break;
    case 'use-password-login': state.showBiometricGate=false; render(); break;
    case 'enable-biometric': await enableBiometricLogin(); break;
    case 'disable-biometric': disableBiometricLogin(); break;
    case 'register-submit': await submitRegister(); break;
    case 'pick-warehouse':
      state.warehouse = el.getAttribute('data-val');
      state.showWarehouseModal = false;
      // اختار المخزن → نكمّل على تأكيد الإرسال على طول
      requestSubmit();
      break;
    case 'pick-warehouse-inline':{
      // ⚠️ ده الزرار بتاع خطوة "هتحمّل من أنهي مخزن؟" الأولى في الفورم —
      // كان الـ case بتاعه ناقص خالص، فالزرار كان بيبان بس مبيعملش حاجة
      // لما تدوس عليه (مفيش أي "action" مربوط بيه في التبديلة دي).
      const v = el.getAttribute('data-val');
      state.warehouse = v || '';
      render();
      break;
    }
    case 'close-warehouse': state.showWarehouseModal=false; render(); break;

    case 'archive-done': await archiveDoneOrders(); break;

      // ما نلمس أي بيانات تانية، ونوري فورم الدخول عشان يجدّد التوكن.
      setUserToken('');

      const v = el.getAttribute('data-view');

      break;
    }
    case 'go-back':{
      const hist = state.viewHistory || [];
      const prev = hist.pop();
      if(prev){ state.view = prev; render();
        if(prev==='admin' && state.adminUnlocked){ loadOrders(); markAdminOrdersSeen_(); }
      }
      break;
    }
    case 'set-group':{
      state.mainGroup = el.getAttribute('data-val');
      state.productSearch='';
      state.accGlobalSearch='';
      state.selectedColor = null;
      state.colorPickerOpenKey = null;
      if(sectorNeedsSubFilter(state.mainGroup)){

        state.subGroup = subs.length===1 ? subs[0] : null;
      } else {
        state.subGroup = null;
      }
      render();
      break;
    }
    case 'set-sub':
      state.subGroup = el.getAttribute('data-val');
      render();
      break;
    case 'set-color':
      state.selectedColor = el.getAttribute('data-val');
      render();
      break;
    case 'toggle-product':{
      const name = el.getAttribute('data-val');
      const key = stagedKey(state.mainGroup, name);
      const wasStaged = state.staged.some(x=>x.key===key);
      // بنمسك مكان الصنف اللي دوس عليه بالظبط، وبعد ما الألوان تتفتح تحته
      // ويحصل أي تحريك للأصناف التانية، برجّعه لنفس المكان على الشاشة —
      // فيفضل شايفه هو والصنف اللي بعده من غير ما الشاشة "تنط".
      withPositionAnchor_(`[data-act="toggle-product"][data-val="${CSS.escape(name)}"]`, ()=>{
        toggleStagedProduct(state.mainGroup, name);
        // لو دخلنا من خطوة "اختار اللون"، اللون ده يتاختار تلقائيًا جوه
        // تفاصيل الصنف عشان الموزع ميحتاجش يدوس عليه تاني بيده.
        if(state.selectedColor){
          const s = state.staged.find(x=>x.key===key);
          if(s && s.colorRequired && s.availableColors.includes(state.selectedColor) && !s.selectedColors.includes(state.selectedColor)){
            toggleStagedColor(key, state.selectedColor);
          }
        }
      });
      // ⚠️ لو الصنف ده جديد (مكانش شايله قبل كده)، دلوقتي هو مضاف لقسم
      // "حدد التفاصيل" البعيد تحت — بنودّي الموزع لهناك تلقائيًا عشان
      // ميحسش إن حاجة ماحصلتش. لو كان بيلغي صنف كان شايله، مش محتاجين نودّيه.
      // ⚠️ لو اللون متحدد بالفعل من فوق (state.selectedColor)، الصنف هيظهر
      // كصف مختصر تحت التايل نفسه على طول (مش في قسم بعيد)، فمفيش داعي
      // نعمل سكرول — هو أصلاً في مكانه قدام عين الموزع.
      if(!wasStaged && !state.selectedColor) scrollToStagedDetail_(key);
      break;
    }
    case 'noop-unavailable': showToast('الصنف ده غير متوفر حاليًا'); break;
    case 'toggle-color': toggleStagedColor(el.getAttribute('data-key'), el.getAttribute('data-val')); break;
    case 'toggle-color-picker':{
      const key = el.getAttribute('data-key');
      state.colorPickerOpenKey = (state.colorPickerOpenKey===key) ? null : key;
      render();
      break;
    }
    // ===== تبويب "إدارة" الجديد =====

      render();
      break;

    case 'manage-export-catalog': manageExportCatalog(); break;

    case 'manage-cancel-edit':

      state.manageEditDraft = {};

      break;

    case 'staged-qty-dec':{
      const s = state.staged.find(x=>x.key===el.getAttribute('data-key'));

      if(s) setStagedQty(s.key, c, (s.qtys[c]||0)-1);

    }
    case 'staged-qty-inc':{

      // دي كلها شروط لازم تتحقق عشان شبكة الأصناف (اللي فيها بلوك التعديل)
      // تتعرض أصلاً. فلو الموزع كان واقف في قطاع/تصنيف/لون مختلف، الشبكة
      // مكانتش بتتعرض خالص، فالشاشة كانت "واقفة مكانها" من غير ما تفتح حاجة.
      state.mainGroup = main;
      state.productSearch = '';
      state.accGlobalSearch = '';
      state.colorPickerOpenKey = null;
      if(sectorNeedsSubFilter(main)){
        const catEntry = CATALOG.find(d=>d.main===main && d.product===product);
        const subs = subGroupsForMain(main);
        state.subGroup = (catEntry && catEntry.sub) ? catEntry.sub : (subs.length===1 ? subs[0] : null);
      } else {
        state.subGroup = null;
        if(colorsForMain(main).length){
          // القطاعات دي بتحتاج خطوة "اختار اللون" قبل ما الشبكة تتعرض —
          // بنحدد أول لون للصنف ده في السلة عشان الخطوة دي تتخطى تلقائيًا.
          const existingColor = state.cart.find(it=>it.main===main && it.product===product);
          state.selectedColor = existingColor ? existingColor.color : null;
        }
      }
      toggleStagedProduct(main, product);
      requestAnimationFrame(()=>{
        const scrollTarget = document.querySelector('.stagedblock') || document.querySelector('.inlinestaged');
        if(scrollTarget) scrollTarget.scrollIntoView({behavior:'smooth', block:'center'});
      });
      break;

    case 'set-otherunit': state.otherUnit = el.getAttribute('data-val'); render(); break;
    case 'other-qty-dec': state.otherQty = Math.max(1, state.otherQty-1); render(); break;

    case 'request-submit': requestSubmit(); break;

    case 'open-cart-review': if(state.pendingDraft && !state.cart.length){ resumeDraft(); state.showResumeModal=false; } state.showCartReview=true; render(); break;

    case 'prepare-order-img': await prepareOrderImage(); break;

    case 'share-wh-img': await shareWarehouseImages(); break;
    case 'force-update': await forceUpdate(); break;
    case 'retry-catalog': await loadCatalog(); break;
    case 'copy-app-link': copyAppLink(); break;
    case 'run-diag': runDiagnostics(); break;
    case 'close-diag': state.showDiag=false; render(); break;

    case 'edit-order':{
      showToast('التعديل اتلغى — سجّل الطلب الإضافي كطلب جديد عادي');

    case 'pin-submit':

    case 'toggle-status':{

    }
    case 'preview-order-pdf':{
      const id = el.getAttribute('data-id');
      if(!state.adminPdfGeneratingId) handleOrderPDF(id, 'preview');
      break;
    }
    case 'preview-myorder-pdf':{
      const id = el.getAttribute('data-id');
      if(!state.adminPdfGeneratingId) previewMyOrderPDF(id);
      break;
    }
    case 'download-order-pdf':{
      const id = el.getAttribute('data-id');
      if(!state.adminPdfGeneratingId) handleOrderPDF(id, 'download');
      break;
    }
    case 'delete-delivered':
      if(confirm('هيتم حذف كل الطلبات "' + STATUS_DONE + '" نهائيًا. متأكد؟')) deleteDeliveredOrders();
      break;
    case 'toggle-order': {
      const id = el.getAttribute('data-id');
      if(state.adminOpenIds[id]) delete state.adminOpenIds[id]; else state.adminOpenIds[id] = true;
      render(); break;
    }
    case 'test-notify':{
      // بيتنادى من ضغطة حقيقية — فطلب الإذن والصوت هيشتغلوا (على عكس التلقائي)
      try{ if('Notification' in window && Notification.permission === 'default') await Notification.requestPermission(); }catch(e){}
      playNotifyBeep_();
      onNewOrders_(1, { distName: 'تجربة' });
      // نفحص السيرفر فورًا عشان يظهر التشخيص المحدّث
      adminPollNewOrders_();
      break;
    }
    case 'admin-status': state.adminStatusFilter = el.getAttribute('data-val'); render(); break;
    case 'export-excel-received': exportExcel(STATUS_RECEIVED); break;
    case 'export-excel-delivered': exportExcel(STATUS_DONE); break;
    case 'refresh-orders': loadOrders(); showToast('جارٍ التحديث...'); break;
    case 'install-app': installApp(); break;
    case 'dismiss-install': dismissInstallBanner(); break;
    case 'bypass-install': state.installGateBypassed = true; render(); break;
  }
}

// ===== PWA install support =====
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredInstallPrompt = e;
  state.showInstallBanner = true;
  render();
});
window.addEventListener('appinstalled', ()=>{
  state.showInstallBanner = false;
  deferredInstallPrompt = null;
  render();
});

async function installApp(){
  if(!deferredInstallPrompt) return;
  state.showInstallBanner = false; render();
  deferredInstallPrompt.prompt();
  try{ await deferredInstallPrompt.userChoice; }catch(e){}
  deferredInstallPrompt = null;
}

function dismissInstallBanner(){
  state.showInstallBanner = false;
  try{ sessionStorage.setItem('qurashi_install_dismissed','1'); }catch(e){}
  render();
}

if('serviceWorker' in navigator){
  let swReg = null;

  // ده كان سبب إن "التحديث ما وصلش لكل الناس": لما نسخة جديدة من الـ service
  // worker تتحمّل، بتفضل واقفة في حالة "waiting" ومش بتشتغل غير لما كل التابات
  // المفتوحة تتقفل خالص. على الموبايل (PWA) ده ممكن ميحصلش لأسابيع.
  // الحل: أول ما نلاقي نسخة مستنية، نبعتلها SKIP_WAITING تشتغل فورًا.
  function activateWaiting(reg){
    if(reg && reg.waiting){
      reg.waiting.postMessage({ type:'SKIP_WAITING' });
    }
  }

  window.addEventListener('load', ()=>{
    // ⚠️ لازم الرابط ده يبقى *ثابت* لنفس النسخة، ويتغيّر بس لما نرفع نسخة
    // جديدة. لو حطينا Date.now() هنا، المتصفح هيشوف "service worker جديد"
    // في كل مرة تفتح فيها الصفحة → يثبّته → controllerchange → reload →
    // ويرجع يعمل نفس الحاجة تاني = التطبيق يفضل عالق في حلقة تحديث
    // لا نهائية. استخدام APP_BUILD بيدينا أحسن الاتنين: يتخطى كاش الـCDN
    // لما نرفع تحديث فعلي، ويفضل ثابت طول ما النسخة هي هي.
    navigator.serviceWorker.register('sw.js?v=' + APP_BUILD, { updateViaCache: 'none' }).then(reg=>{
      swReg = reg;
      activateWaiting(reg);
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', ()=>{
          // النسخة الجديدة اتثبتت وفيه نسخة قديمة شغالة → فعّلها فورًا
          if(nw.state === 'installed' && navigator.serviceWorker.controller){
            activateWaiting(reg);
          }
        });
      });
      reg.update().catch(()=>{});
    }).catch(()=>{});
  });

  // فحص وجود تحديث كل مرة التطبيق يرجع للواجهة (بعد ما كان في الخلفية) أو كل دقيقة
  document.addEventListener('visibilitychange', ()=>{
    if(document.visibilityState==='visible' && swReg){
      swReg.update().then(()=>activateWaiting(swReg)).catch(()=>{});
    }
  });
  setInterval(()=>{
    if(swReg) swReg.update().then(()=>activateWaiting(swReg)).catch(()=>{});
  }, 60000);

  // ⚠️ حماية ضد حلقة التحديث اللانهائية: المتغير العادي بيتصفّر مع كل
  // reload، فمكانش بيمنع الحلقة لو حصل controllerchange تاني بعد التحميل.
  // بنستخدم sessionStorage عشان الحماية تفضل شغالة عبر الـreload نفسه،
  // وبنسمح بإعادة تحميل واحدة بس لكل نسخة (APP_BUILD).
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    let last = '';
    try{ last = sessionStorage.getItem('elk_sw_reloaded') || ''; }catch(e){}
    if(last === APP_BUILD) return;   // اتعمل reload قبل كده لنفس النسخة → بلاش تكرار
    try{ sessionStorage.setItem('elk_sw_reloaded', APP_BUILD); }catch(e){}
    showToast('🔄 في تحديث جديد للتطبيق، جارٍ التحديث...');
    setTimeout(()=>window.location.reload(), 700);
  });
}

// ⚠️ بيتأكد إن نسخة السيرفر تطابق نسخة التطبيق.
// الحالة دي بتحصل كتير: الملفات بتترفع على GitHub (فالتطبيق بياخد النسخة
// الجديدة)، بس محرر Apps Script مااتعملوش Deploy — فالسيرفر يفضل على الكود
// القديم. النتيجة أعطال غامضة (الدخول بيفشل، الأرشيف مايشتغلش) من غير أي
// رسالة مفهومة. دلوقتي بنكشفها ونقولها صريحة.
async function checkServerVersion_(){
  try{
    const d = await apiGet('version', {}, { cache:'no-store' });
    const sv = d && d.version ? String(d.version) : '';
    if(sv && sv !== APP_BUILD){
      state.serverVersionMismatch = sv;
      render();
    }
  }catch(e){ /* مفيش نت — مش وقتها */ }
}

// ===== init =====
loadUserSession();
restoreAdminSession();
restoreManageSession();
loadProfile();
// اللوجو بقى ملف مستقل — بنحمّله في الخلفية ونحوّله data URI عشان يبقى جاهز
// وقت توليد الـ PDF وصور الطلبات (html2canvas مابيستناش الصور اللي بتتحمّل).
preloadLogo_().then(()=>{ if(LOGO_DATA_URI) render(); });
checkServerVersion_();
loadCatalog().then(()=>{ checkForResumableDraft(); render(); });
render();
if(state.adminUnlocked && getAdminToken()) startAdminPoll_();

</script>
</body>
</html>

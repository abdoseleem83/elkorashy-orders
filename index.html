// ===== submit flow =====
function requestSubmit(){
  // حماية إضافية: أي قيمة جاية من الشيت ممكن تبقى رقم مش نص
  state.distName = asText(state.distName);
  state.distRegion = asText(state.distRegion);
  state.distPhone = asText(state.distPhone);
  state.note = asText(state.note);
  if(!state.distName.trim()){ showToast('من فضلك اكتب اسم الموزع / الفرع'); return; }
  if(!state.distRegion.trim()){ showToast('من فضلك اكتب المنطقة'); return; }
  if(!state.distPhone.trim()){ showToast('من فضلك اكتب رقم الهاتف — محتاجه عشان تقدر تستعلم عن طلباتك بعدين'); return; }
  // المخزن بيتسأل عنه هنا، وقت الإرسال — مش في بيانات الموزع. العميل مالوش
  // دعوة بالمخزن أصلاً فمابيتسألش عنه خالص.
  if(!asText(state.warehouse).trim() && !isClientAccount()){
    state.showWarehouseModal = true; render(); return;
  }
  if(state.cart.length===0){ showToast('لسه محضتش أي صنف للطلب'); return; }

  if(!state.editingOrderId){
    const lastDate = localStorage.getItem(LS_LAST_DATE_KEY);
    if(lastDate === todayStr()){
      state.showDailyWarning = true; render();
      return;
    }
  }
  state.showConfirmModal = true; render();
}

function proceedAfterDailyWarning(){
  state.showDailyWarning = false;
  state.showConfirmModal = true;
  render();
}

async function actuallySubmit(){
  state.showConfirmModal = false;
  state.saveError = '';
  state.submitting = true; render();

  const isUpdate = !!state.editingOrderId;
  // ⚠️ التعديل بقى بيعمل طلب *جديد* برقم وتاريخ جديد (id/ts جديدين)، والطلب
  // القديم بيتعلّم "مُعدّل" ويفضل ظاهر للأدمن. فبنبعت oldId عشان السيرفر
  // يعلّم القديم، و id جديد للطلب الجديد. (قبل كده كان بيحدّث نفس الصف.)
  const oldId = isUpdate ? state.editingOrderId : null;
  const id = (Date.now().toString(36) + Math.random().toString(36).slice(2,6));
  const order = {
    id, ts: Date.now(),
    oldId: oldId || undefined,
    username: state.currentUser ? state.currentUser.username : '',
    distName: asText(state.distName).trim(),
    distRegion: asText(state.distRegion).trim(),
    distPhone: asText(state.distPhone).trim(),
    warehouse: asText(state.warehouse).trim(),
    note: asText(state.note).trim(),
    items: state.cart,
    status: STATUS_RECEIVED
  };
  try{
    const resp = await saveOrderRemote(order, isUpdate);
    const orderNo = (resp && resp.orderNo) ? String(resp.orderNo) : id.toUpperCase();
    order.orderNo = orderNo;
    state.successOrderId = orderNo;
    state.successMode = isUpdate ? 'updated' : 'new';
    state.lastOrder = order;
    // الطلب الجديد (سواء جديد أو ناتج عن تعديل) بيتسجّل في "طلباتي" برقمه الجديد،
    // والمرجع القديم بيتشال عشان مايفضلش الطلب القديم ظاهر عند الموزع.
    if(oldId) removeOrderRef(oldId);
    saveOrderRef(id, order.distName);
    localStorage.setItem(LS_LAST_DATE_KEY, todayStr());
    localStorage.setItem(LS_LAST_ID_KEY, id.toUpperCase());
    state.cart=[]; state.staged=[]; state.distName=''; state.distRegion=''; state.distPhone=''; state.note=''; state.warehouse=''; state.editingOrderId=null;
    loadProfile();
    clearDraft();
    // ✅ إشعار فوري بعد استلام الطلب (5 ثواني عشان المستخدم يقراها)
    showToast(isUpdate
      ? '✅ تم استلام تعديلك — جاري المراجعة والتأكيد بالمتاح'
      : '✅ تم استلام طلبك — جاري المراجعة والتأكيد بالمتاح', 5000);
    // 📲 مابقناش نبعت واتساب تلقائيًا ولا إجباري — بطلب صريح من المستخدم.
    // بس بنعرض في شاشة النجاح ملاحظة + سهم بيشاور على زرار واتساب،
    // والموزع هو اللي يدوس بنفسه.
    // (v151 كانت جربت فتح تلقائي فور الحفظ، بس المتصفح مش دايمًا بيسمح بيه
    // من غير ضغطة مستخدم قريبة، فرجعنا للوضع اليدوي بطلب المستخدم.)
    state.waSent = false;
    state.waImgPreparing = false;
    state.orderImages = null;   // صور الطلب الجديدة بتتجهّز أول ما يدوس ابعت
    // ⚠️ بق مهم: كنا بنجهّز صور الطلب (html2canvas) لحظة ما يدوس "ابعت
    // واتساب" نفسها، وده معناه إن navigator.share() كانت بتتنادى بعد
    // await طويل (تجهيز الصور بياخد وقت) — والمتصفح بيسحب صلاحية "ضغطة
    // مستخدم حقيقية" لو استخدمناها بعد await طويل زي كده، فـ navigator.share
    // كانت بترفض تفتح بصمت من غير أي رسالة خطأ ظاهرة (بالظبط نفس مشكلة
    // window.open الموثّقة فوق مع reserveWaWindow). الحل: نبدأ تجهيز الصور
    // في الخلفية فورًا من هنا (من غير ما نستنى/await)، عشان لما الموزع يدوس
    // الزرار بعد كام ثانية، الصور تكون جاهزة والمشاركة تتنادى على طول جوه
    // الضغطة نفسها من غير أي انتظار قبلها.
    prepareOrderImage();
  }catch(e){
    // صندوق خطأ ثابت (مش toast بيختفي) فيه السبب الخام — عشان نعرف السبب الحقيقي
    state.saveError = 'نوع العملية: ' + (isUpdate ? 'تعديل' : 'جديد')
      + '\nرقم الطلب: ' + id
      + '\nعدد الأصناف: ' + (order.items ? order.items.length : 0)
      + '\nالخطأ: ' + (e && e.message ? e.message : String(e));
    console.error('actuallySubmit failed:', e);
  }
  state.submitting = false;
  render();
  // ✅ نولّد عرض السعر تلقائياً بعد ما الطلب يتبعت
  if(state.lastOrder && state.successOrderId) generateBothQuotes(state.lastOrder);
  // ⛔ مابقناش نولّد الـ PDF تلقائيًا هنا. html2canvas بيجمّد الشاشة وهو شغال،
  // فكانت شاشة النجاح متظهرش والمستخدم يفتكر إن الحفظ فشل — مع إنه نجح فعلاً.
  // دلوقتي شاشة النجاح بتظهر فورًا، والملفات بتتولّد بضغطة زرار وقت ما تحتاجها.
}

// ===== pricing helpers for quote (raw price, normalized to small unit) =====
function smallUnitLabelFor(main){
  if(main==='ابواب WPC') return 'قطعة';
  if(main.includes('اكسسوارات')) return 'قطعة';
  return 'عود';
}
// أمر صرف المخزن لازم يكون باللفة (وحدة العدّ اللي أمين المخزن بيشتغل بيها)،
// مش بالعود زي تصدير الإكسيل. لو الموزع طلب بالعود لصنف من مجموعات اللفة،
// بنحوّله للفة هنا (بالكسر لو مش لفة كاملة) بدل ما نسيبه بالعود.
const ROLL_GROUPS_ = ['قطاعات PVC كومبن', 'قطاعات كرافت لاين', 'نيو لاين', 'شاتر'];

// بيحوّل كمية بالوحدة الصغيرة (عود) للفة — لكن لو الكمية أقل من لفة كاملة،
// بيسيبها بالعود عشان متظهرش ككسر (زي 0.3 لفة) وده مش مفهوم عمليًا.
function rollsOrRodsDisplay_(smallQty, content){
  const c = Number(content) || 1;
  if(c <= 1) return { qty: smallQty, unitLabel: 'عود' };
  const rolls = smallQty / c;
  if(rolls < 1) return { qty: smallQty, unitLabel: 'عود' };
  return { qty: Math.round(rolls*10)/10, unitLabel: 'لفة' };
}

// ⚠️ بيفصل الكمية بالوحدة الصغيرة (عود) لجزئين: عدد اللفات الكاملة + الباقي
// بالعود (لو مش لفة كاملة بالظبط). ده بيتفرق عن rollsOrRodsDisplay_ اللي كان
// بيرجّع رقم واحد بس (لفة كسرية زي 1.5، أو عود لو أقل من لفة) — هنا بنرجّع
// الاتنين مع بعض عشان: (1) العرض يبقى واضح "1 لفة + 3 عود" بدل "1.4 لفة"،
// و(2) الخصم يتطبق بس على اللفات الكاملة (الموزع بياخد خصم اللفة لما يكمّل
// لفة كاملة فعلًا؛ الباقي اللي مكملش لفة بيتحسب بسعر العود العادي من غير خصم).
function splitRollsAndRods_(smallQty, content){
  const c = Number(content) || 1;
  if(c <= 1) return { rolls: 0, rods: smallQty };
  const wholeRolls = Math.floor((Number(smallQty)||0) / c + 1e-9);
  const remainderRods = Math.round(((Number(smallQty)||0) - wholeRolls*c) * 100) / 100;
  return { rolls: wholeRolls, rods: remainderRods };
}

function warehouseUnitDisplay(it){
  if(it.unitType === 'لفة' || it.unitType === 'كرتونة'){
    return { qty: it.qty, unitLabel: it.unitType };
  }
  if(ROLL_GROUPS_.includes(it.main) && it.unitType === 'عود'){
    const cat = findCatalogItem(it.main, it.product, it.color);
    const content = Number(cat && cat.unit) || 1;
    return rollsOrRodsDisplay_(Number(it.qty), content);
  }
  // أصناف من غير لفة أصلاً (أبواب/أكسسوارات) — تفضل بوحدتها الأصلية
  return { qty: it.qty, unitLabel: it.unitType || '' };
}

function normalizeItemToSmallUnit(it){
  if(it.main===OTHER_SECTOR) return { qty: it.qty, unitLabel: it.unitType||'' };
  if(it.main==='ابواب WPC') return { qty: it.qty, unitLabel:'قطعة' };
  // الاكسسوارات: نحافظ على وحدة الموزع (كرتونة أو قطعة) بدون تحويل
  if(it.main && it.main.includes('اكسسوارات')) return { qty: it.qty, unitLabel: it.unitType||'قطعة' };
  const bigUnits = ['لفة','كرتونة'];
  const catItem = findCatalogItem(it.main, it.product, it.color);
  const content = catItem ? (catItem.unit || 1) : 1;
  const label = smallUnitLabelFor(it.main);
  if(bigUnits.includes(it.unitType)) return { qty: it.qty * content, unitLabel: label };
  return { qty: it.qty, unitLabel: label };
}
function rawPriceForItem(it){
  const catItem = findCatalogItem(it.main, it.product, it.color);
  if(catItem && catItem.price!=null) return catItem.price;
  if(it.main===OTHER_SECTOR && it.unitPrice!=null) return it.unitPrice;
  return null;
}

function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// شاشة الأرصدة — للأدمن بس (فيها أرقام، والموزع مش المفروض يشوفها).
// الأرقام دي = الرصيد − المحجوز، بالعود/القطعة.
// بيبني مصفوفة الأرصدة: لكل مجموعة رئيسية → صفوف (الأصناف) وأعمدة (الألوان).
// الكميات باللفة. الصنف اللي كل ألوانه صفر مش بيتعرض خالص.
function stockMatrix_(){
  const q = asText(state.stockSearch).trim().toLowerCase();
  const groups = new Map();

  CATALOG.forEach(d=>{
    if(d.available === false) return;
    const n = Number(d.stock);
    if(!isFinite(n) || n <= 0) return;               // صفر → مش بيتعرض
    // أي كمية أقل من لفة كاملة بتتعتبر صفر — عشان التقرير يبقى واقعي
    const content_ = Number(d.unit) || 1;
    if(n < content_) return;
    if(q && !(d.main + ' ' + d.product + ' ' + (d.color||'')).toLowerCase().includes(q)) return;

    if(!groups.has(d.main)) groups.set(d.main, { colors:new Set(), rows:new Map() });
    const g = groups.get(d.main);
    const color = d.color || 'بدون لون';
    g.colors.add(color);

    if(!g.rows.has(d.product)) g.rows.set(d.product, {});
    const content = Number(d.unit) || 1;
    g.rows.get(d.product)[color] = n / content;      // باللفة
  });

  // ترتيب الألوان: الشائع الأول، وأي لون تاني بعديهم
  const PREF = ['بيج','ابيض','خشبي','رمادي','اسود'];
  return [...groups.entries()].map(([main, g])=>{
    const known = PREF.filter(c=>g.colors.has(c));
    const rest  = [...g.colors].filter(c=>!PREF.includes(c));
    return { main, colors:[...known, ...rest], rows:[...g.rows.entries()] };
  });
}

function fmtRolls_(v){
  if(v === undefined || v === null || v <= 0) return '';
  return (Math.round(v * 10) / 10).toString();
}

async function exportStockPDF(){
  if(!(await ensureLibs_('html2canvas','jspdf'))){
    showToast('مكتبة التصدير مش جاهزة، حاول تاني'); return;
  }
  const tables = stockTableHTML_(true);
  if(!tables){ showToast('مفيش أرصدة تتصدّر'); return; }

  state.stockPdfBusy = true; render();

  const wrap = document.createElement('div');
  wrap.style.position='fixed'; wrap.style.top='-9999px'; wrap.style.left='-9999px';
  wrap.style.width='860px';
  wrap.style.fontFamily = "'Cairo', sans-serif";
  wrap.style.direction='rtl';
  wrap.style.background='#FFFFFF';

  const dateStr = new Date().toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'});
  wrap.innerHTML = `
    <div style="padding:28px 34px;">
      <div style="display:flex;align-items:center;gap:14px;border-bottom:3px solid #1080C0;padding-bottom:14px;margin-bottom:16px;">
        <img src="${logoSrc_()}" style="width:54px;height:54px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid #DCE4EC;padding:4px;">
        <div style="flex:1;">

          <div style="font-size:12.9px;color:#6B7A8C;margin-top:2px;">الكميات باللفة · المتاح = الرصيد − المحجوز</div>
        </div>
        <div style="font-size:13.4px;color:#6B7A8C;">${esc(dateStr)}</div>
      </div>
      ${tables}
      ${CREDIT_LINE ? `<div style="margin-top:14px;text-align:center;color:#A8A498;font-size:10.1px;">${esc(CREDIT_LINE)}</div>` : ''}
    </div>`;
  document.body.appendChild(wrap);

  try{
    const canvas = await withTimeout(
      html2canvas(wrap, {scale: 1.5, backgroundColor:'#ffffff', useCORS:true, allowTaint:true}),
      30000, 'stock-pdf'
    );
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF('p','mm','a4');
    const imgData = canvas.toDataURL('image/png');
    const imgWidth = 210, pageHeight = 297;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    const totalPages = pdfPageCount_(imgHeight, pageHeight);
    let heightLeft = imgHeight, position = 0, pageNum = 1;
    doc.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
    stampPdfFooter_(doc, pageNum, totalPages);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      doc.addPage();
      pageNum++;
      doc.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
      stampPdfFooter_(doc, pageNum, totalPages);
      heightLeft -= pageHeight;

    previewPdfBlob({ blob, previewUrl: imgData, imgBlob }, 'الأرصدة_' + dateStr + '.pdf');

    showToast('تعذّر التصدير: ' + (e && e.message ? e.message : e));
  }
  try{ document.body.removeChild(wrap); }catch(e){}
  state.stockPdfBusy = false;
  render();
}

// ترتيب القطاعات للعرض: بنرتّب بالقطاعات المعروفة الأول، وبعدين بنضيف أي قطاع
// تاني موجود في الطلب بس مش موجود في قائمة الأصناف الحالية.
// ⚠️ قبل كده كنا بنعمل SECTOR_CHIPS.filter(...) وبس — فأي قطاع مش في القائمة
// الحالية كان بيتشال من الجدول بصمت، ولو كل الأصناف كده يطلع عرض السعر فاضي
// (بيحصل لو قائمة الأصناف فشلت تتحمّل، أو لو الطلب قديم وقطاعه اتغير).
function orderGroups_(groupsMap){
  const known = SECTOR_CHIPS.filter(g=>groupsMap.has(g));
  const rest = [...groupsMap.keys()].filter(g=>!SECTOR_CHIPS.includes(g));
  return [...known, ...rest];
}

// الإرسال على واتساب بقى بصورة (PNG) مش PDF — الصورة بتتفتح في الشات على طول
// من غير ما حد ينزّل ملف. لو الجهاز مش بيدعم مشاركة الصور، بنرجع للـ PDF.
async function shareAsImage_(q, baseName, title){
  if(!q) return false;
  // 1) الأفضل: مشاركة صورة
  if(q.imgBlob){
    try{
      const img = new File([q.imgBlob], baseName + '.png', {type:'image/png'});
      if(navigator.canShare && navigator.canShare({files:[img]})){
        await navigator.share({ files:[img], title: title, text:'طلب رقم #' + (state.successOrderId||'') });
        return true;
      }
    }catch(e){ /* المستخدم لغى أو الجهاز مش داعم */ }
  }
  // 2) احتياطي: مشاركة PDF
  try{
    const file = new File([q.blob], baseName + '.pdf', {type:'application/pdf'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({ files:[file], title: title, text:'طلب رقم #' + (state.successOrderId||'') });
      return true;
    }
  }catch(e){ /* fallthrough */ }
  return false;
}

// ===== quote PDF (عرض سعر) =====
// ⚠️ حساب صفوف عرض السعر (الكميات المعروضة/الأسعار/الخصومات/ملخص اللفات)
// اتفصل هنا في دالة واحدة عشان يتشارك فيها أكتر من مكان (PDF عرض السعر،
// وصور الطلب المتعددة اللي بتتبعت واتساب) من غير ما نكرر نفس المنطق المالي
// الحساس ده في أكتر من نسخة (لو غيّرناه، هيتغيّر في الاتنين مع بعض تلقائيًا).
function computeQuoteRows_(order){
  // ⚠️ عرض السعر بيتعرض باللفة لأصناف القطاعات لو الكمية لفة كاملة
  // أو أكتر — لكن لو الكمية أقل من لفة، بتتعرض بالعود عشان متبقاش كسر لفة
  // (زي 0.3 لفة) — بعكس تصدير الإكسيل اللي فضل بالعود زي ما هو (متلمسناهوش).
  // السعر بيتحوّل لسعر اللفة (سعر العود × محتوى اللفة) بس لما تكون العرض
  // فعلًا لفات، عشان الإجمالي يفضل مطابق للحقيقي بالظبط في الحالتين.
  const rows = [];
  order.items.forEach(it=>{
    const raw = rawPriceForItem(it); // سعر القطعة الصغيرة (عود/قطعة) — الأساس المالي الصحيح
    const norm = normalizeItemToSmallUnit(it);
    const unavailNow = unavailableForWarehouse_(it.main, it.product, it.color, asText(order.warehouse));
    if(ROLL_GROUPS_.includes(it.main)){
      // ⚠️ قاعدة الخصم: الخصم بيتطبق بس على اللفات الكاملة. لو الموزع طلب
      // مثلًا 7 عود ومحتوى اللفة 6 عود، بيتقسم لصفين: 1 لفة (بسعر اللفة +
      // خصم لو مؤهل) و1 عود باقي (بسعر العود العادي من غير خصم خالص) —
      // بدل ما يتحسب الكل بسعر واحد أو خصم واحد غلط.
      const catItem = findCatalogItem(it.main, it.product, it.color);
      const content = Number(catItem && catItem.unit) || 1;
      const split = splitRollsAndRods_(norm.qty, content);
      if(split.rolls>0){
        const dispPrice = raw==null ? null : raw*content;
        const lineRaw = dispPrice==null ? null : dispPrice*split.rolls;
        rows.push(Object.assign({}, it, { normQty: split.rolls, normUnit: 'لفة', rawPrice: dispPrice, lineRaw, unavailable: unavailNow, noRollDiscount:false }));
      }
      if(split.rods>0 || split.rolls===0){
        const dispQty = split.rods; // لو مفيش لفات خالص، دي كل الكمية بالعود
        const lineRaw = raw==null ? null : raw*dispQty;
        rows.push(Object.assign({}, it, { normQty: dispQty, normUnit: 'عود', rawPrice: raw, lineRaw, unavailable: unavailNow, noRollDiscount:true }));
      }
      return;
    }
    let dispQty = norm.qty, dispUnit = norm.unitLabel, dispPrice = raw;
    if(it.unitType === 'كرتونة'){
      // ⚠️ البق: الاكسسوارات بتتطلب بالكرتونة، لكن سعر الكتالوج سعر القطعة.
      // كان الإجمالي = عدد الكراتين × سعر القطعة (غلط). الصح: سعر الكرتونة =
      // سعر القطعة × عدد القطع في الكرتونة (عمود المحتوى D)، زي ما القطاعات
      // بتعمل مع اللفة، وزي ما السيرفر بيخصم المخزن (كرتونة = محتوى قطع).
      const catItem = findCatalogItem(it.main, it.product, it.color);
      const content = Number(catItem && catItem.unit) || 1;
      dispQty = it.qty;              // نفضل نعرض بالكرتونة زي ما الموزع طلب
      dispUnit = 'كرتونة';
      dispPrice = raw==null ? null : raw*content;   // سعر الكرتونة كاملة
    }
    const lineRaw = dispPrice==null ? null : dispPrice*dispQty;
    // ⚠️ الشارة "غير متاح" لازم تتحسب على مخزن الطلب نفسه (order.warehouse)
    // والرصيد الحالي — مش نعتمد على اللقطة القديمة المخزّنة وقت الإضافة (اللي
    // ممكن تكون false لو الرصيد اتغيّر بعد كده، أو لو state.warehouse وقت
    // الطباعة مش نفس مخزن الطلب). ده اللي كان بيخلي الملاحظات ماتظهرش للأدمن.
    rows.push(Object.assign({}, it, { normQty: dispQty, normUnit: dispUnit, rawPrice: dispPrice, lineRaw, unavailable: unavailNow, noRollDiscount:false }));
  });
  const subtotal = rows.reduce((s,r)=> s + (r.lineRaw||0), 0);
  // ⚠️ فرّقنا بين حاجتين هنا: "الخصم موجود أصلاً" (بيتحسب دايمًا لو موزع،
  // بغض النظر عن الزرار) و"نوريه ولا لأ" (ده بس اللي بيتحكم فيه الزرار).
  // لو الزرار "مخفي"، السعر النهائي المعروض لازم يفضل السعر بعد الخصم
  // (الموزع أخد خصمه فعلًا)، بس من غير ما نوري تفاصيل إزاي اتحسب.
  const eligible = isDiscountEligible(); // فيه خصم أصلاً لنوع الحساب ده؟
  const customPct = (eligible && state.extraDiscount>0) ? state.extraDiscount : 0;
  const showDiscount = eligible && (state.discountVisible || customPct>0); // نوري التفاصيل ولا لأ؟
  let discountTotal = 0;
  if(eligible){
    rows.forEach(r=>{
      if(r.lineRaw==null) return;
      if(r.noRollDiscount) return; // باقي العود اللي ملوش لفة كاملة — من غير خصم
      // لو في خصم مخصص → يحل محل خصم القطاع
      const pct = customPct>0 ? customPct : getDiscount(r.main);
      if(pct>0) discountTotal += r.lineRaw * (pct/100);
    });
  }
  const netTotal = subtotal - discountTotal;

  // ملخص عدد اللفات لكل قطاع (كومبن / كرافت لاين / نيو لاين / شاتر) — لو فيه
  // صنف كميته أقل من لفة هيبقى معروض بالعود، فبنجمع اللفات لوحدها والعيدان
  // لوحدها وبنوريهم مع بعض لو الاتنين موجودين.
  const ROLL_SUMMARY_SECTORS = ['قطاعات PVC كومبن', 'قطاعات كرافت لاين', 'نيو لاين', 'شاتر'];
  const rollSummary = [];
  ROLL_SUMMARY_SECTORS.forEach(sector=>{
    const items = rows.filter(r=>r.main===sector);
    if(!items.length) return;
    const totalRolls = items.filter(it=>it.normUnit==='لفة').reduce((a,it)=>a+it.normQty, 0);
    const totalRods = items.filter(it=>it.normUnit==='عود').reduce((a,it)=>a+it.normQty, 0);
    if(totalRolls>0 || totalRods>0) rollSummary.push({ sector, rolls: totalRolls, rods: totalRods });
  });
  const hasMissing = rows.some(r=>r.lineRaw==null);

  return { rows, subtotal, eligible, customPct, showDiscount, discountTotal, netTotal, rollSummary, hasMissing };
}

    const imgWidth = 210;
    const pageHeight = 297;
    const imgHeight = canvas.height * imgWidth / canvas.width;
    const totalPages = pdfPageCount_(imgHeight, pageHeight);
    let heightLeft = imgHeight;
    let position = 0;
    let pageNum = 1;
    doc.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
    stampPdfFooter_(doc, pageNum, totalPages);
    heightLeft -= pageHeight;
    while(heightLeft > 0){
      position = heightLeft - imgHeight;
      doc.addPage();
      pageNum++;
      doc.addImage(imgData,'PNG',0,position,imgWidth,imgHeight);
      stampPdfFooter_(doc, pageNum, totalPages);
      heightLeft -= pageHeight;
    }
    const imgBlob = await canvasToPngBlob_(canvas);
    result = { blob: doc.output('blob'), previewUrl: imgData, imgBlob: imgBlob };
  }catch(e){ console.error('buildQuotePDF failed:', e); result = null; }

        </div>` : ''}
        <div style="display:flex;justify-content:flex-end;margin-top:16px;">

            </div>
            <div style="display:flex;justify-content:space-between;padding:9px 12px;background:#002050;color:#fff;border-radius:8px;font-size:14.6px;font-weight:800;margin-top:4px;">
              <span>الإجمالي بعد الخصم</span><span>${Math.round(netTotal).toLocaleString('en-US')} ج.م</span>

              <span>الإجمالي</span><span>${Math.round(subtotal).toLocaleString('en-US')} ج.م</span>
            </div>
            `}
            ${hasMissing ? '<div style="font-size:10.7px;color:#8A5A00;margin-top:6px;text-align:left;">⚠️ فيه أصناف بدون سعر متاح مش داخلة في الإجمالي</div>' : ''}
          </div>
        </div>
        ${rollSummary.length ? `
        <div style="margin-top:12px;display:flex;justify-content:flex-end;">

            <div style="font-size:11px;font-weight:800;color:#002050;margin-bottom:5px;">عدد اللفات حسب القطاع</div>

              return `<div style="display:flex;justify-content:space-between;font-size:11px;color:#20242B;padding:3px 0;"><span>${esc(r.sector)}</span><span style="font-weight:700;">${esc(parts.join(' + '))}</span></div>`;

        </div>` : ''}
        ${order.note ? `<div style="margin-top:14px;padding-top:10px;border-top:1px dashed #DCE4EC;font-size:11.3px;color:#6B7A8C;">ملاحظات: ${esc(order.note)}</div>` : ''}
        ` : ''}
        ${PREPARED_BY_LINE ? `<div style="margin-top:16px;text-align:center;color:#A8A498;font-size:9.2px;">${esc(PREPARED_BY_LINE)}</div>` : ''}
        ${CREDIT_LINE ? `<div style="margin-top:4px;text-align:center;color:#A8A498;font-size:9.2px;">${esc(CREDIT_LINE)}</div>` : ''}
      </div>`;
    document.body.appendChild(wrap);
    try{
      const canvas = await withTimeout(
        html2canvas(wrap, {scale: 2, backgroundColor:'#ffffff', useCORS:true, allowTaint:true}),
        20000, 'order-img-p' + (p+1)
      );
      const blob = await canvasToPngBlob_(canvas);
      if(blob) blobs.push(blob);
    }catch(e){ console.error('buildOrderImagePages failed (page ' + (p+1) + '):', e); }
    try{ document.body.removeChild(wrap); }catch(e){}
  }
  return blobs;
}

// ===== طلبية نواقص (صور، مش PDF): زرارين — كرافت ونيو / كومبن واكسسوارات =====
// كل زرار بيطلّع صورة واحدة (PNG) بدل PDF: من فوق "طلبية نواقص {اسم الفرع}"
// والتاريخ، والأصناف باللفة (لمجموعات اللفة)، ومن تحت إجمالي كل قطاع من
// القطاعات اللي بتتحسب باللفة (كرافت/نيو/كومبن). الصفحة دايمًا مقسومة عمودين
// جنب بعض؛ لو الأصناف زادت عن نص الصفحة الأولى بتكمل في العمود التاني تلقائيًا.
const SHORTAGE_IMG_GROUPS_ = {
  kraft_new: { label: 'كرافت ونيو', mains: ['قطاعات كرافت لاين', 'نيو لاين'] },
  combin_acc: { label: 'كومبن واكسسوارات', mains: ['قطاعات PVC كومبن', 'اكسسوارات pvc اكسا'] }
};
// القطاعات اللي إجماليها باللفة بيتحسب في الفوتر (اكسسوارات وحداتها مختلطة
// كرتونة/قطعة فمفيش إجمالي واحد يبقى له معنى ليها).
const SHORTAGE_TOTAL_MAINS_ = ['قطاعات كرافت لاين', 'نيو لاين', 'قطاعات PVC كومبن'];

async function buildShortageImageGroup(order, groupKey){
  if(!(await ensureLibs_('html2canvas'))) return null;
  const group = SHORTAGE_IMG_GROUPS_[groupKey];
  if(!order || !order.items || !order.items.length || !group) return null;

  const relevant = order.items.filter(it => group.mains.includes(it.main));
  if(!relevant.length) return null;

  const date = new Date(order.ts);
  const dateStr = date.toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'});

  // الأصناف باللفة لمجموعات اللفة (أو بالعود لو الكمية أقل من لفة كاملة)،
  // وبباقي وحداتها الصغيرة لغير كده
  const rows = relevant.map(it=>{
    const norm = normalizeItemToSmallUnit(it);
    if(ROLL_GROUPS_.includes(it.main)){
      // ⚠️ لو الكمية مش لفة كاملة بالظبط (زي 1.4 لفة)، بنقسمها لجزئين واضحين:
      // عدد اللفات الكاملة + الباقي بالعود — بدل ما تتعرض كسر لفة مش مفهوم
      // عمليًا لأمين المخزن (زي "1.4 لفة"). بيتعرضوا مع بعض "1 لفة + 3 عود".
      const cat = findCatalogItem(it.main, it.product, it.color);
      const content = Number(cat && cat.unit) || 1;
      const split = splitRollsAndRods_(norm.qty, content);
      const parts = [];
      if(split.rolls>0) parts.push(split.rolls + ' لفة');
      if(split.rods>0 || split.rolls===0) parts.push(split.rods + ' عود');
      return Object.assign({}, it, { rollQty: split.rolls, rodQty: (split.rods>0||split.rolls===0)?split.rods:0, dispLabel: parts.join(' + ') });
    }
    return Object.assign({}, it, { rollQty: 0, rodQty: 0, dispLabel: norm.qty + ' ' + norm.unitLabel });
  });

  const groupsMap = new Map();
  rows.forEach(r=>{
    if(!groupsMap.has(r.main)) groupsMap.set(r.main, []);
    groupsMap.get(r.main).push(r);
  });
  const orderedMains = group.mains.filter(m=>groupsMap.has(m));

  // صف واحد مسطّح لكل الأصناف، بالقطاع الأول وبعدين باللون جوه القطاع —
  // زي عرض السعر بالظبط: كل مجموعة لون بتاخد هيدر فرعي لوحدها بدل ما اللون
  // يتكرر مكتوب جنب كل صنف صنف.
  const flat = [];
  orderedMains.forEach(main=>{
    const items = groupsMap.get(main);
    const colorOrder = [];
    const byColor = new Map();
    items.forEach(it=>{
      const c = asText(it.color);
      if(!byColor.has(c)){ byColor.set(c, []); colorOrder.push(c); }
      byColor.get(c).push(it);
    });
    const multiColor = colorOrder.filter(c=>c).length > 1 || (colorOrder.length>1 && colorOrder.some(c=>c));
    let firstInMain = true;
    colorOrder.forEach(colorKey=>{
      let firstInColor = true;
      byColor.get(colorKey).forEach(it=>{
        flat.push(Object.assign({}, it, {
          sectionStart: firstInMain,
          sectionLabel: main,
          colorStart: multiColor && !!colorKey && firstInColor,
          colorLabel: multiColor ? colorKey : null
        }));
        firstInMain = false; firstInColor = false;
      });
    });
  });

  // إجمالي كل قطاع من القطاعات المحسوبة باللفة (كرافت/نيو/كومبن) — ممكن
  // يبقى فيه إجمالي لفات وإجمالي عيدان مع بعض لو فيه أصناف اتعرضت بالعود
  // (كميات أقل من لفة كاملة)، فبنعرض الاتنين لو موجودين.
  const totals = orderedMains
    .filter(m=>SHORTAGE_TOTAL_MAINS_.includes(m))
    .map(m=>{
      const items = groupsMap.get(m);
      const rollsSum = items.reduce((a,it)=>a+(Number(it.rollQty)||0), 0);
      const rodsSum = items.reduce((a,it)=>a+(Number(it.rodQty)||0), 0);
      const parts = [];
      if(rollsSum>0) parts.push(Math.round(rollsSum*10)/10 + ' لفة');
      if(rodsSum>0) parts.push(Math.round(rodsSum*10)/10 + ' عود');
      return { main: m, text: parts.join(' + ') };
    })
    .filter(t=>t.text);

  // 📄 الورقة دلوقتي ليها شكل ثابت: عمودين، كل عمود 15 سطر بالظبط
  // (= 30 صنف للصفحة). الزيادة بتروح لصفحة/صورة جديدة بنفس المقاس بالظبط،
  // بدل ما الورقة تتمدّد وتطول والخط يصغّر عشان يدخل فيها (اللي كان بيخلي
  // كل صورة بحجم وشكل مختلف حسب عدد الأصناف).
  // 🗜️ للطلبات الكبيرة (أكتر من 30 صنف) بنكثّف الأعمدة لـ 18 سطر بدل 15،
  // وبنقلّل المسافات (padding/font) عشان الطلبية الكبيرة تفضل في ورقة واحدة
  // بدل ما تتقسّم صفحتين، مع الحفاظ على المسافات الواسعة المريحة للطلبات
  // الصغيرة العادية.
  const isCompact_ = flat.length > 30;
  const ROWS_PER_COL_ = isCompact_ ? 18 : 15;
  const PER_PAGE_ = ROWS_PER_COL_ * 2;
  const pages = [];
  for(let i=0; i<flat.length; i+=PER_PAGE_){
    pages.push(flat.slice(i, i+PER_PAGE_));
  }
  if(!pages.length) pages.push([]);

  const rowPad_ = isCompact_ ? '6px 8px' : '9px 8px';
  const rowFont_ = isCompact_ ? '17px' : '20px';
  const idxFont_ = isCompact_ ? '12px' : '14px';
  const colorFont_ = isCompact_ ? '13px' : '15px';
  const secPad_ = isCompact_ ? '5px 10px' : '7px 10px';
  const secMargin_ = isCompact_ ? '7px' : '10px';
  const colorPad_ = isCompact_ ? '4px 10px 4px 16px' : '5px 10px 5px 18px';
  const colorMargin_ = isCompact_ ? '6px' : '8px';

  function rowsHTML(list, startIndex){
    let html = '';
    list.forEach((it,i)=>{
      if(it.sectionStart && SHORTAGE_IMG_GROUPS_[groupKey].mains.length>1){
        html += `<div style="padding:${secPad_};background:#4FA8DC;color:#002050;font-weight:800;font-size:15px;border-radius:6px;margin:${i===0?'0':secMargin_} 0 6px 0;">${esc(it.sectionLabel)}</div>`;
      }
      if(it.colorStart){
        html += `<div style="padding:${colorPad_};background:#D6E7F8;border-right:3px solid #1080C0;color:#002050;font-weight:800;font-size:13px;border-radius:4px;margin:${(i===0||it.sectionStart)?'0':colorMargin_} 0 5px 0;">◂ ${esc(it.colorLabel)}</div>`;
      }
      const bg = i%2===0 ? '#FFFFFF' : '#F3F6FA';
      html += `
      <div style="display:flex;align-items:baseline;gap:8px;background:${bg};padding:${rowPad_};border-bottom:1px solid #DCE4EC;border-radius:4px;">
        <span style="color:#8A8470;font-weight:800;font-size:${idxFont_};min-width:20px;">${startIndex+i+1}.</span>
        <span style="flex:1;font-weight:800;font-size:${rowFont_};color:#002050;line-height:1.25;">
          ${esc(it.name || it.product)}${(it.color && !it.colorLabel)?` <span style="color:#6B7A8C;font-size:${colorFont_};font-weight:700;">- ${esc(it.color)}</span>`:''}
        </span>
        <span style="font-weight:800;font-size:${rowFont_};color:#1080C0;white-space:nowrap;">${esc(it.dispLabel||'')}</span>
      </div>`;
    });
    return html;
  }

  const blobs = [];
  for(let p=0; p<pages.length; p++){
    const pageItems = pages[p];
    const pageStart = p * PER_PAGE_;
    const colA = pageItems.slice(0, ROWS_PER_COL_);
    const colB = pageItems.slice(ROWS_PER_COL_);
    const isLast = (p === pages.length - 1);

    const wrap = document.createElement('div');
    wrap.style.position='fixed'; wrap.style.top='-9999px'; wrap.style.left='-9999px';
    wrap.style.width = '1180px';
    wrap.style.fontFamily = "'Cairo', sans-serif";
    wrap.style.direction='rtl';
    wrap.style.background='#FFFFFF';

    wrap.innerHTML = `
    <div style="padding:28px 34px;">
      <div style="display:flex;align-items:center;gap:14px;border-bottom:3px solid #1080C0;padding-bottom:14px;margin-bottom:16px;">
        <img src="${logoSrc_()}" style="width:54px;height:54px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid #DCE4EC;padding:4px;">
        <div style="flex:1;">
          <div style="font-size:22px;font-weight:800;color:#002050;">اوردر رقم #${esc(orderNoDisplay_(order))} ${esc(group.label)}${order.warehouse ? ` <span style="color:#1080C0;">— مخزن ${esc(asText(order.warehouse))}</span>` : ''}</div>
        </div>
        <div style="text-align:left;">
          <div style="font-size:12.3px;color:#6B7A8C;">${esc(dateStr)}</div>
          ${pages.length>1 ? `<div style="font-size:12.3px;color:#6B7A8C;font-weight:800;">صفحة ${p+1} من ${pages.length}</div>` : ''}
        </div>
      </div>

      <div style="display:flex;gap:28px;align-items:flex-start;min-height:640px;">
        <div style="flex:1;">${rowsHTML(colA, pageStart)}</div>
        <div style="flex:1;">${colB.length ? rowsHTML(colB, pageStart + colA.length) : ''}</div>
      </div>

      ${(isLast && totals.length) ? `
        <div style="margin-top:16px;padding-top:12px;border-top:1px dashed #DCE4EC;display:flex;gap:22px;flex-wrap:wrap;">
          ${totals.map(t=>`<div style="font-size:13.4px;"><span style="color:#6B7A8C;">إجمالي ${esc(t.main)}: </span><b style="color:#002050;">${esc(t.text)}</b></div>`).join('')}
        </div>
      ` : ''}
      ${PREPARED_BY_LINE ? `<div style="margin-top:8px;text-align:center;color:#A8A498;font-size:9.6px;">${esc(PREPARED_BY_LINE)}</div>` : ''}
      ${CREDIT_LINE ? `<div style="margin-top:4px;text-align:center;color:#A8A498;font-size:10.1px;">${esc(CREDIT_LINE)}</div>` : ''}
    </div>
  `;
    document.body.appendChild(wrap);

    try{
      // ⚠️ الدقة بقت ثابتة (2) لكل الصفحات — قبل كده كانت بتتغيّر حسب عدد
      // الأصناف، فالصور كانت بتطلع بأحجام ووضوح مختلف. دلوقتي كل صفحة
      // فيها 30 صنف كحد أقصى، فالحجم متحكوم فيه أصلاً.
      const canvas = await withTimeout(
        html2canvas(wrap, {scale: 2, backgroundColor:'#ffffff', useCORS:true, allowTaint:true}),
        20000, 'shortage-img-' + groupKey + '-p' + (p+1)
      );
      const blob = await canvasToPngBlob_(canvas);
      if(blob) blobs.push(blob);
    }catch(e){ console.error('buildShortageImageGroup failed (page ' + (p+1) + '):', e); }
    try{ document.body.removeChild(wrap); }catch(e){}
  }
  return blobs;
}

// بيدوّر على الطلب بمعرّفه (لو موجود) وإلا بيرجع لآخر طلب اتبعت (state.lastOrder) —
// عشان نفس الزرارين يشتغلوا هنا وفي شاشة "تم إرسال الطلب".
function findOrderForShortage_(id){
  if(id){
    const o = state.orders.find(o=>o.id===id) || state.myOrders.find(o=>o.id===id);
    if(o) return o;
  }
  return state.lastOrder;
}

async function handleShortageImage(id, groupKey){
  const order = findOrderForShortage_(id);
  if(!order){ showToast('مفيش طلب'); return; }
  const busyKey = id || 'last';
  state.shortageImgBusy = busyKey + '|' + groupKey; render();
  try{
    const blobs = await buildShortageImageGroup(order, groupKey);
    if(blobs && blobs.length){
      const label = SHORTAGE_IMG_GROUPS_[groupKey].label;
      const base = 'نواقص_' + label.replace(/\s+/g,'_') + '_' + orderNoDisplay_(order);
      if(blobs.length === 1){
        previewImageBlob(blobs[0], base + '.png');
      } else {
        // أكتر من صفحة: بنعرض الأولى ونحمّل الباقي، وبنقول للمستخدم صراحةً
        // إن فيه صفحات زيادة عشان مايفتكرش إن الباقي ضاع.
        previewImageBlob(blobs[0], base + '_1.png');
        blobs.slice(1).forEach((b,i)=> downloadBlob(b, base + '_' + (i+2) + '.png'));
        showToast('الطلب اتقسم ' + blobs.length + ' صفحات — الباقي اتحمّل عندك');
      }
    } else {
      showToast('مفيش أصناف من "' + SHORTAGE_IMG_GROUPS_[groupKey].label + '" في الطلب ده');
    }
  }catch(e){
    console.error('handleShortageImage failed:', e);
    showToast('حصل خطأ في تجهيز الصورة: ' + (e && e.message ? e.message : e));
  }
  state.shortageImgBusy = null;
  render();
}

// ===== صور المخزن =====
// صورة لكل مجموعة رئيسية لوحدها (عشان متبقاش صفحة طويلة)، من غير أي أسعار —
// فيها: مسلسل / اسم العميل / الصنف / الكمية. توجّهها للمخزن على طول.
async function buildWarehouseImage(order, mainGroup, rows, pageNo, pageCount){
  if(!(await ensureLibs_('html2canvas'))) return null;

  const wrap = document.createElement('div');
  wrap.style.position='fixed'; wrap.style.top='-9999px'; wrap.style.left='-9999px';
  wrap.style.width='760px';
  wrap.style.fontFamily = "'Cairo', sans-serif";
  wrap.style.direction='rtl';
  wrap.style.background='#FFFFFF';

  const date = new Date(order.ts);
  const dateStr = date.toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'});

  wrap.innerHTML = `

async function prepareWarehouseImages(){
  const o = state.lastOrder;
  if(!o || !o.items || !o.items.length){ showToast('مفيش طلب'); return; }
  state.whImgPreparing = true; state.warehouseImages = []; render();

  // مجموعة رئيسية لكل صورة
  const groups = new Map();
  o.items.forEach(it=>{
    if(!groups.has(it.main)) groups.set(it.main, []);
    groups.get(it.main).push(it);
  });
  const ordered = orderGroups_(groups);
  const out = [];
  for(let i=0;i<ordered.length;i++){
    const g = ordered[i];
    // فسحة صغيرة بين كل صورة عشان الواجهة ما تتجمدش
    await new Promise(r=>setTimeout(r, 60));
    const blob = await buildWarehouseImage(o, g, groups.get(g), i+1, ordered.length);
    if(blob) out.push({ group: g, blob: blob });
  }
  state.warehouseImages = out;
  state.whImgPreparing = false;
  if(!out.length) showToast('تعذّر تجهيز الصور، حاول تاني');
  render();
}

async function shareWarehouseImages(){
  const imgs = state.warehouseImages || [];
  if(!imgs.length){ showToast('جهّز الصور الأول'); return; }
  const o = state.lastOrder;
  const base = 'مخزن_' + String(o ? o.id : 'order').toUpperCase();
  const files = imgs.map((x, i)=> new File([x.blob], base + '_' + (i+1) + '_' + x.group + '.png', {type:'image/png'}));
  try{
    if(navigator.canShare && navigator.canShare({files})){
      await navigator.share({ files, title:'أمر صرف مخزن', text:'طلب #' + (o?orderNoDisplay_(o):'') });
      return;
    }
  }catch(e){
    if(e && e.name === 'AbortError') return;
  }
  // احتياطي: ننزّلهم واحدة واحدة
  imgs.forEach((x,i)=> downloadBlob(x.blob, base + '_' + (i+1) + '_' + x.group + '.png'));
  showToast('اتحملت الصور — ابعتها من المعرض');
}

// ===== رفع الأصناف/الرصيد من إكسل (الأدمن) =====
async function handleCatalogFileSelected(act, file){
  if(!(await ensureLibs_('exceljs'))){ showToast('حصل خطأ في تحميل أداة قراءة الإكسل، حاول تاني'); return; }
  state.catalogUploadFileName = file.name;
  state.catalogUploadResult = null;
  state.catalogUploadRows = null;
  render();
  try{
    const buffer = await file.arrayBuffer();
    const wb = new ExcelJS.Workbook();
    await wb.xlsx.load(buffer);
    const ws = wb.worksheets[0];
    if(!ws) throw new Error('الملف فاضي');
    const headerRow = ws.getRow(1);
    const headerMap = {}; // نص العنوان (متريم) → رقم العمود
    headerRow.eachCell((cell, colNumber)=>{
      const h = String(cell.value==null ? '' : cell.value).trim();
      if(h) headerMap[h] = colNumber;
    });
    const nameCol = headerMap['اسم الصنف'];
    const stockCol = headerMap['الرصيد'];
    if(!nameCol || !stockCol){
      throw new Error('لازم يكون في عمودين اسمهم بالظبط "اسم الصنف" و"الرصيد" — استخدم النموذج الجاهز');
    }
    const getCell = (row, colName)=>{
      const idx = headerMap[colName];
      if(!idx) return '';
      const v = row.getCell(idx).value;
      if(v && typeof v==='object' && v.text!=null) return v.text; // نص غني/رابط
      return v==null ? '' : v;
    };
    const rows = [];
    ws.eachRow((row, rowNumber)=>{
      if(rowNumber===1) return;
      const name = String(getCell(row,'اسم الصنف')||'').trim();
      if(!name) return;
      if(state.catalogUploadMode==='stock'){
        rows.push({ name, stock: getCell(row,'الرصيد') });
      } else {
        rows.push({
          name,
          main: String(getCell(row,'القطاع')||'').trim(),
          sub: String(getCell(row,'التصنيف الفرعي')||'').trim(),
          unit: getCell(row,'الوحدة'),
          product: String(getCell(row,'اسم المنتج')||'').trim(),
          color: String(getCell(row,'اللون')||'').trim(),
          price: getCell(row,'السعر'),
          stock: getCell(row,'الرصيد'),
          disabled: String(getCell(row,'تعطيل')||'').trim()==='لا'
        });
      }
    });
    if(!rows.length) throw new Error('مفيش صفوف فيها اسم صنف في الملف');
    state.catalogUploadRows = rows;
  }catch(e){
    state.catalogUploadResult = { error: 'تعذّر قراءة الملف: ' + (e && e.message ? e.message : 'خطأ غير معروف') };
    state.catalogUploadRows = null;
  }
  render();
}

async function downloadCatalogTemplate(){
  if(!(await ensureLibs_('exceljs'))){ showToast('حصل خطأ في تحميل أداة الإكسل، حاول تاني'); return; }
  const wb = new ExcelJS.Workbook();
  const isStock = state.catalogUploadMode==='stock';

  // وهمي) — عشان لو الأدمن كتب الاسم بإيده وغيّر حرف أو مسافة عن غير قصد،
  // الرفع كان بيفشل بصمت (الاسم "مش موجود"). كده هو بس بيغيّر الأرقام.
  const seen = new Set();
  const uniqueItems = [];
  CATALOG.forEach(d=>{
    if(d.name && !seen.has(d.name)){ seen.add(d.name); uniqueItems.push(d); }
  });
  if(isStock){
    ws.columns = [
      { header:'اسم الصنف', key:'name', width:40 },
      { header:'الرصيد', key:'stock', width:12 },
    ];
    if(uniqueItems.length){
      uniqueItems.forEach(d=>ws.addRow({ name:d.name, stock: (d.stock===null||d.stock===undefined) ? '' : d.stock }));
    } else {
      ws.addRow({ name:'مثال: حلق مفصلي بدون بار كومبن - ابيض', stock:25 });
    }
  } else {
    ws.columns = [
      { header:'اسم الصنف', key:'name', width:34 },
      { header:'القطاع', key:'main', width:20 },
      { header:'التصنيف الفرعي', key:'sub', width:20 },
      { header:'الوحدة', key:'unit', width:10 },
      { header:'اسم المنتج', key:'product', width:28 },
      { header:'اللون', key:'color', width:14 },
      { header:'السعر', key:'price', width:10 },
      { header:'الرصيد', key:'stock', width:10 },
      { header:'تعطيل', key:'disabled', width:10 },
    ];
    if(uniqueItems.length){
      uniqueItems.forEach(d=>ws.addRow({
        name:d.name, main:d.main||'', sub:d.sub||'', unit:d.unit||1,
        product:d.product||d.name, color:d.color||'',
        price:(d.price===null||d.price===undefined)?'':d.price,
        stock:(d.stock===null||d.stock===undefined)?'':d.stock,
        disabled:d.available===false?'لا':''
      }));
    } else {
      ws.addRow({ name:'مثال: حلق مفصلي بدون بار كومبن - ابيض', main:'قطاعات PVC كومبن', sub:'', unit:4, product:'حلق مفصلي بدون بار كومبن', color:'ابيض', price:250, stock:25, disabled:'' });
    }
  }
  ws.getRow(1).font = { bold:true };
  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = isStock ? 'نموذج_تحديث_الرصيد.xlsx' : 'نموذج_رفع_الأصناف.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function submitCatalogUpload(){
  if(!state.catalogUploadRows || !state.catalogUploadRows.length) return;
  state.catalogUploadBusy = true; state.catalogUploadResult = null; render();
  const isManageCtx = state.catalogUploadContext==='manage';
  try{
    const res = await fetch(APPS_SCRIPT_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({
        action: isManageCtx ? 'manageUploadCatalog' : 'uploadCatalog',
        token: isManageCtx ? getManageToken() : getAdminToken(),
        mode: state.catalogUploadMode, rows: state.catalogUploadRows
      })
    });

    if(data && data.ok){
      state.catalogUploadResult = { updated:data.updated||0, added:data.added||0, notFound:data.notFound||[] };
      showToast('تم رفع الملف بنجاح ✅');

    state.catalogUploadResult = { error: 'تعذّر الاتصال بالسيرفر، حاول تاني' };
  }
  state.catalogUploadBusy = false;
  render();
}

async function exportExcel(statusFilter){
  // statusFilter: واحدة من المراحل التلاتة بالظبط — كل زرار بيصدّر ملف مستقل بطلباته بس
  const ordersForFile = state.orders.filter(o=>o.status===statusFilter);

  if(ordersForFile.length===0){ showToast('مفيش طلبات "' + statusFilter + '" لتصديرها'); return; }
  if(!(await ensureLibs_('exceljs'))){ showToast('حصل خطأ في تحميل أداة التصدير، حاول تاني'); return; }

  const NAVY='FF1F3050', WHITE='FFFFFFFF', LIGHT='FFF5F3EE', GOLD='FFC9A227';
  const wb = new ExcelJS.Workbook();
  const ws = wb.addWorksheet(statusFilter, { views:[{ rightToLeft:true }] });
  ws.columns = [
    { header:'م', key:'serial', width:6 },
    { header:'الموزع', key:'dist', width:18 },
    { header:'المنطقة', key:'region', width:14 },
    { header:'الصنف', key:'product', width:32 },
    { header:'الكمية', key:'qty', width:8 },
    { header:'الوحدة', key:'unit', width:10 },
    { header:'سعر الوحدة', key:'price', width:11 },
    { header:'الإجمالي', key:'total', width:11 },
    { header:'التاريخ', key:'date', width:14 },
  ];
  const headerRow = ws.getRow(1);
  headerRow.eachCell(cell=>{
    cell.font = { bold:true, color:{argb:WHITE}, size:12, name:'Arial' };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:NAVY} };
    cell.alignment = { horizontal:'center', vertical:'middle' };
    cell.border = { top:{style:'thin'}, bottom:{style:'thin'}, left:{style:'thin'}, right:{style:'thin'} };
  });
  headerRow.height = 22;

  // ⚠️ مهم جدًا: بنجمّع كل طلب لوحده بالـ id الفريد بتاعه، مش باسم الموزّع.
  // قبل كده كان التجميع بالاسم (distName)، فلو موزّعين مختلفين ليهم نفس الاسم
  // بالظبط (زي أكتر من موزّع اسمه "طنطا") كانت طلباتهم بتتلم كلها مع بعض —
  // فيظهر عند موزّع أصناف موزّع تاني ماطلبهاش. التجميع بالـ id الفريد بيضمن
  // إن كل طلب يظهر بأصنافه هو بس ومستحيل يختلط بطلب موزّع تاني.
  const groups = new Map();
  ordersForFile.forEach(o=>{
    const key = o.id;   // مفتاح فريد لكل طلب
    if(!groups.has(key)) groups.set(key, { dist:o.distName||'', region:o.distRegion||'', ts:o.ts, items:[] });
    o.items.forEach(it => groups.get(key).items.push(it));
  });

  let rowIdx = 2, toggle=false, grandTotal=0, serial=0;
  groups.forEach((g)=>{
    const dist = g.dist;
    const startRow = rowIdx;
    const dateStr = new Date(g.ts).toLocaleDateString('ar-EG',{day:'2-digit',month:'2-digit',year:'numeric'});
    const fillColor = toggle ? LIGHT : WHITE;
    g.items.forEach((it, idx)=>{
      grandTotal += it.lineTotal||0;
      serial++;
      // بنصدّر بالوحدة الصغيرة (عود / قطعة) مش باللفة — زي عرض السعر بالظبط
      let norm = normalizeItemToSmallUnit(it);
      // 📦 في تصدير الإكسيل تحديدًا: الأكسسوارات دايمًا بالقطعة، حتى لو الموزع
      // طلب بالكرتونة (كرتونة × عدد القطع في الكرتونة = عمود المحتوى unit).
      // ده محلي هنا بس — مش في normalizeItemToSmallUnit — عشان مايأثرش على
      // طلبية النواقص اللي بتفضل بالكرتونة. الإجمالي (lineTotal) ما بيتغيرش،
      // وسعر الوحدة تحت بيطلع سعر القطعة تلقائيًا من (الإجمالي ÷ الكمية).
      if(it.main && it.main.includes('اكسسوارات') && it.unitType === 'كرتونة'){
        const accCat = findCatalogItem(it.main, it.product, it.color);
        const accContent = Number(accCat && accCat.unit) || 1;
        norm = { qty: it.qty * accContent, unitLabel: 'قطعة' };
      }
      // ⚠️ سعر الوحدة المعروض لازم يطابق الإجمالي: نستخرجه من (الإجمالي ÷ الكمية)
      // عشان الكرتونة/اللفة تظهر بسعرها الكامل مش بسعر القطعة (نفس بق عرض السعر).
      const unitPriceDisp = (it.lineTotal!=null && norm.qty) ? (it.lineTotal / norm.qty) : rawPriceForItem(it);
      const row = ws.addRow({
        serial,
        dist: idx===0?dist:'', region: idx===0?g.region:'',
        product: it.name || it.product,
        qty: norm.qty, unit: norm.unitLabel||'',
        price: unitPriceDisp==null ? 'غير متاح' : Math.round(unitPriceDisp),
        total: it.lineTotal==null ? 'غير متاح' : Math.round(it.lineTotal),
        date: idx===0?dateStr:''
      });
      row.eachCell(cell=>{
        cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:fillColor} };
        cell.border = { top:{style:'hair',color:{argb:'FFDDDDDD'}}, bottom:{style:'hair',color:{argb:'FFDDDDDD'}}, left:{style:'hair',color:{argb:'FFDDDDDD'}}, right:{style:'hair',color:{argb:'FFDDDDDD'}} };
        cell.alignment = { horizontal:'right', vertical:'middle', wrapText:true };
        cell.font = { name:'Arial', size:11 };
      });
      rowIdx++;
    });
    if(g.items.length>1){
      ws.mergeCells(startRow,2,rowIdx-1,2); ws.mergeCells(startRow,3,rowIdx-1,3); ws.mergeCells(startRow,9,rowIdx-1,9);
    }
    const distCell = ws.getCell(startRow,2);
    distCell.font = { bold:true, color:{argb:NAVY}, size:11, name:'Arial' };
    distCell.alignment = { horizontal:'right', vertical:'middle', wrapText:true };
    toggle = !toggle;
  });
  ws.autoFilter = { from:'A1', to:'I1' };

  const totalRow = ws.addRow({ product:'الإجمالي الكلي', total: Math.round(grandTotal) });
  ws.mergeCells(rowIdx, 1, rowIdx, 7);
  totalRow.eachCell(cell=>{
    cell.font = { bold:true, color:{argb:WHITE}, size:12, name:'Arial' };
    cell.fill = { type:'pattern', pattern:'solid', fgColor:{argb:GOLD} };
    cell.alignment = { horizontal:'center', vertical:'middle' };
  });

  const buffer = await wb.xlsx.writeBuffer();
  const blob = new Blob([buffer], { type:'application/octet-stream' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const fileTag = statusFilter.replace(/\s+/g,'_');
  a.href = url; a.download = 'طلبات_الموزعين_' + fileTag + '.xlsx';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ===== render: staged product block =====
// ⚠️ لما اللون يكون اتحدد بالفعل من خطوة "اختار اللون" العامة اللي فوق
// الشبكة (state.selectedColor)، مفيش داعي نعيد عرض اختيار اللون تاني ولا
// نودّي الموزع لقسم "حدد التفاصيل" البعيد — بنعرضله بس وحدة+كمية+سعر
// وزرار "ضيف للسلة" مباشرة تحت الصنف، عشان يقدر يضيف أصناف كتير بسرعة.
// صف الكمية بشكل 3 أسطر (بطلب صريح):
//  سطر 1: الوحدة (لفة...) + الكمية (- عدد +)
//  سطر 2: سعر الوحدة + الإجمالي
//  سطر 3: ضيف للسلة + إلغاء
// بيتستخدم في القطاعات (اللون متحدد) وفي الاكسسوارات (بعد اختيار اللون).
// ⚠️ بتتأكد إن الكمية اللي الموزّع طالبها (مهما كانت الوحدة: عود/لفة/كرتونة)
// ماتتجاوزش الرصيد الفعلي المتاح في المخزن. بترجع نص التحذير لو فيه تجاوز،
// أو '' لو الكمية سليمة. بتشتغل بس في المخازن اللي رصيدها متتبَّع فعليًا
// (طنطا حاليًا) — المخازن التانية مالهاش رصيد دقيق أصلاً فمفيش داعي نقارن.
function stockShortageWarning_(main, product, color, unitType, qty){
  if(!warehouseAffectsStock(main)) return '';
  const item = findCatalogItem(main, product, color);
  if(!item) return '';
  const stock = Number(item.stock);
  if(!isFinite(stock)) return '';
  const bigUnits = ['لفة','كرتونة'];
  const content = Number(item.unit) || 1;
  const requestedBase = bigUnits.includes(unitType) ? qty * content : qty;
  if(requestedBase > stock){
    // بنوري المتاح دايمًا بالوحدة الأساسية (عود/قطعة) عشان الرقم يبقى دقيق
    // ومالوش لبس، بدل ما نحاول نحوّله للفة/كرتونة وممكن يبقى كسر مربك.
    return `⚠ الكمية أكبر من المتاح في المخزن — المتاح فعليًا: ${stock} (المطلوب: ${requestedBase})`;
  }
  return '';
}

function render3LineQty(s, color, opts){
  opts = opts || {};
  const unitType = s.units[color] || s.unitOptions[0];
  const rawQty = s.qtys[color];
  const hasQty = rawQty != null && rawQty > 0;
  const qty = hasQty ? rawQty : 0;
  const price = calcUnitPrice(s.main, s.product, color, unitType);
  const lineTotal = (price==null || !hasQty) ? null : price*qty;
  const fmt = n => n==null ? '—' : Math.round(n).toLocaleString('en-US');
  const shortageMsg = hasQty ? stockShortageWarning_(s.main, s.product, color, unitType, qty) : '';
  return `
  <div class="qty3">
    <div class="qty3-line qty3-unitqty">
      ${s.unitOptions.length>1 ? `
      <select class="cqselect" data-act="set-color-unit" data-key="${esc(s.key)}" data-val="${esc(color)}">
        ${s.unitOptions.map(u=>`<option value="${esc(u)}" ${s.units[color]===u?'selected':''}>${esc(u)}</option>`).join('')}
      </select>` : `<span class="cqunitfixed">${esc(s.unitOptions[0])}</span>`}
      <div class="qtystepper small">
        <button data-act="staged-qty-dec" data-key="${esc(s.key)}" data-val="${esc(color)}" type="button">−</button>
        <input type="text" inputmode="numeric" pattern="[0-9]*" min="1" placeholder="حدد الكمية" value="${hasQty ? qty : ''}" data-act="staged-qty-input" data-key="${esc(s.key)}" data-val="${esc(color)}">
        <button data-act="staged-qty-inc" data-key="${esc(s.key)}" data-val="${esc(color)}" type="button">+</button>
      </div>
    </div>
    ${shortageMsg ? `<div class="qty3-shortage">${esc(shortageMsg)}</div>` : ''}
    <div class="qty3-line qty3-price">
      <span class="qty3-cell"><b>السعر:</b> ${fmt(price)}</span>
      <span class="qty3-cell qty3-total"><b>الإجمالي:</b> ${fmt(lineTotal)}</span>
    </div>
    <div class="qty3-line qty3-btns">
      <button class="confirmbtn" data-act="confirm-staged" data-key="${esc(s.key)}">✓ ضيف للسلة</button>
      <button class="cancelbtn" data-act="cancel-staged" data-key="${esc(s.key)}">✖ إلغاء</button>
    </div>
  </div>`;
}

function renderInlineQtyRow(s, color){
  return `<div class="inlineqtyrow">${render3LineQty(s, color)}</div>`;
}

function renderStagedBlock(s){
  return `
  <div class="stagedblock ${s.cancelling?'cancelling':''}" data-stagedkey="${esc(s.key)}">
    <div class="stagedhead">
      <div>
        <div class="stagedname">${esc(s.product)} ${s.isEditingExisting?'<span class="edittag">✏️ تعديل</span>':''}</div>
        <div class="stagedmain">${esc(s.main)}</div>
      </div>
    </div>
    ${s.colorRequired ? `
    <label>الألوان (اختار أكتر من واحد)</label>
    <div class="chipwrap chipgrid4 chipsquares" style="margin-bottom:10px;grid-template-columns:repeat(${Math.min(Math.max(s.availableColors.length,1),5)}, minmax(0,1fr));">
      ${s.availableColors.map(c=>{
        const unavailable = isColorUnavailable(s.main, s.product, c);
        if(unavailable){
          return `<button class="chip disabled" data-act="noop-unavailable" disabled>${esc(c)}<small>موقوف</small></button>`;
        }
        const sel = s.selectedColors.includes(c) ? 'active' : '';
        // ⚠️ في مخازن العاشر/المنصورة، أو لو الداخل عميل، الرصيد مالوش معنى —
        // اللون بيتعرض عادي (شكل افتراضي، مفيش لون تلوين ولا لافتة خالص).
        if(!warehouseAffectsStock(s.main)){
          return `<button class="chip ${sel}" data-act="toggle-color" data-key="${esc(s.key)}" data-val="${esc(c)}">${esc(c)}</button>`;
        }
        const lvl = colorStockLevel(findCatalogItem(s.main, s.product, c));
        // أحمر: أقل من لفة (أو صفر) · أصفر: أقل من 5 لفات · عادي: كفاية
        if(lvl === 'out'){
          return `<button class="chip nostockchip ${sel}" data-act="toggle-color" data-key="${esc(s.key)}" data-val="${esc(c)}">${esc(c)}<small>غير متاح رصيد</small></button>`;
        }
        if(lvl === 'crit'){
          return `<button class="chip outstockchip ${sel}" data-act="toggle-color" data-key="${esc(s.key)}" data-val="${esc(c)}">${esc(c)}<small>متاح اعواد</small></button>`;
        }
        if(lvl === 'low'){
          return `<button class="chip gold lowstockchip ${sel}" data-act="toggle-color" data-key="${esc(s.key)}" data-val="${esc(c)}">${esc(c)}<small>كمية قليلة</small></button>`;
        }
        return `<button class="chip greenchip ${sel}" data-act="toggle-color" data-key="${esc(s.key)}" data-val="${esc(c)}">${esc(c)}</button>`;
      }).join('')}
    </div>
    ${(()=>{
      // ⚠️ كان فيه تناقض هنا: لون "مفيش رصيد خالص" (out) كان بياخد نفس رسالة
      // "الكمية قليلة" بتاعة لون فيه رصيد جزئي (low/crit) — وده مضلل، لأن
      // "قليلة" بتوحي إن فيه حاجة، والصفر مفيهوش حاجة أصلاً. بنفصل الرسالتين.
      const outs = s.selectedColors.filter(c => colorStockLevel(findCatalogItem(s.main, s.product, c)) === 'out');
      const partial = s.selectedColors.filter(c => {
        const l = colorStockLevel(findCatalogItem(s.main, s.product, c));
        return l === 'low' || l === 'crit';
      });
      let html = '';
      if(outs.length){
        html += `<div class="lowstocknote" style="background:#FDECEC;border-color:var(--danger);color:#8A1F1F;">🚫 مفيش رصيد خالص في: ${
          outs.map(c=>esc(c)).join(' · ')
        } — السعر متاح لو حبيت تطلبه</div>`;
      }
      if(partial.length){
        html += `<div class="lowstocknote">⚠️ الكمية مش كتيرة في: ${
          partial.map(c=>esc(c)).join(' · ')
        } — يفضل تتأكد الأول</div>`;
      }
      return html;
    })()}` : ''}
    ${s.selectedColors.length>0 ? `
    <div class="colorqtytable stacked">
      ${s.selectedColors.map(c=>{
        const unitType = s.units[c] || s.unitOptions[0];
        const rawQty = s.qtys[c];
        const hasQty = rawQty != null && rawQty > 0;
        const qty = hasQty ? rawQty : 0;
        const price = calcUnitPrice(s.main, s.product, c, unitType);
        const lineTotal = (price==null || !hasQty) ? null : price*qty;
        const fmt = n => n==null ? '—' : Math.round(n).toLocaleString('en-US');
        const shortageMsg = hasQty ? stockShortageWarning_(s.main, s.product, c, unitType, qty) : '';
        return `
        <div class="cqrow2">
          <div class="cqrow2-color">${c?esc(c):esc(s.product)}</div>
          <div class="cqrow2-line">
            ${s.unitOptions.length>1 ? `
            <select class="cqselect" data-act="set-color-unit" data-key="${esc(s.key)}" data-val="${esc(c)}">
              ${s.unitOptions.map(u=>`<option value="${esc(u)}" ${s.units[c]===u?'selected':''}>${esc(u)}</option>`).join('')}
            </select>` : `<span class="cqunitfixed">${esc(s.unitOptions[0])}</span>`}
            <div class="qtystepper small">
              <button data-act="staged-qty-dec" data-key="${esc(s.key)}" data-val="${esc(c)}" type="button">−</button>
              <input type="text" inputmode="numeric" pattern="[0-9]*" min="1" placeholder="حدد الكمية" value="${hasQty ? qty : ''}" data-act="staged-qty-input" data-key="${esc(s.key)}" data-val="${esc(c)}">
              <button data-act="staged-qty-inc" data-key="${esc(s.key)}" data-val="${esc(c)}" type="button">+</button>
            </div>
          </div>
          ${shortageMsg ? `<div class="qty3-shortage">${esc(shortageMsg)}</div>` : ''}
          <div class="cqrow2-line cqrow2-price">
            <span class="qty3-cell"><b>السعر:</b> ${fmt(price)}</span>
            <span class="qty3-cell qty3-total"><b>الإجمالي:</b> ${fmt(lineTotal)}</span>
          </div>
        </div>`;
      }).join('')}
    </div>` : ''}
    <div class="stagedbtns">
      <button class="confirmbtn" data-act="confirm-staged" data-key="${esc(s.key)}">${s.isEditingExisting?'✓ حفظ التعديل':'✓ تمام، ضيفه للسلة'}</button>
      <button class="cancelbtn" data-act="cancel-staged" data-key="${esc(s.key)}">✖ إلغاء</button>
    </div>
  </div>`;
}
